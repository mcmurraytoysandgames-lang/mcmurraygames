}
/* ---------------- enemy behaviours ---------------- */
function updateEnemyAI(e,dt){
  const p=A.p, d=dist(e,p), a=angTo(e,p);
  e.face=a;
  const step=(sx,sy)=>{ e.x+=sx*dt; e.y+=sy*dt; };
  switch(e.ai){
    case 'chase': step(Math.cos(a)*e.spd,Math.sin(a)*e.spd); break;
    case 'swoop': {
      const wob=Math.sin(e.t*5)*.9;
      step(Math.cos(a+wob)*e.spd,Math.sin(a+wob)*e.spd);
      if(d<50) { e.x-=Math.cos(a)*e.spd*dt*1.4; e.y-=Math.sin(a)*e.spd*dt*1.4; }
      break; }
    case 'shooter': {
      const want=270;
      const dir=d>want?1:d<want-90?-1:0;
      step(Math.cos(a)*e.spd*dir,Math.sin(a)*e.spd*dir);
      step(Math.cos(a+1.57)*e.spd*.5*Math.sin(e.t*1.6),Math.sin(a+1.57)*e.spd*.5*Math.sin(e.t*1.6));
      e.cd-=dt; if(e.cd<=0&&d<620){ e.cd=e.def.shot.cd;
        eshoot(e,a,e.def.shot.spd,e.def.shot.dmg,8,'#ff9a3d'); AU.blip(300,.07,'square',.06,-120); }
      break; }
    case 'spreader': {
      const dir=d>320?1:d<200?-1:0; step(Math.cos(a)*e.spd*dir,Math.sin(a)*e.spd*dir);
      e.cd-=dt; if(e.cd<=0&&d<640){ e.cd=e.def.shot.cd;
        for(let i=-1;i<=1;i++) eshoot(e,a+i*.26,e.def.shot.spd,e.def.shot.dmg,8,'#7cf5ff');
        AU.blip(420,.1,'triangle',.06,-200); }
      break; }
    case 'charger': {
      if(e.state===0){ step(Math.cos(a)*e.spd*.55,Math.sin(a)*e.spd*.55);
        e.cd-=dt; if(d<340&&e.cd<=0){ e.state=1; e.ca=a; e.ct=.75; AU.blip(180,.2,'sawtooth',.08,300); } }
      else { e.ct-=dt; step(Math.cos(e.ca)*e.spd*3.4,Math.sin(e.ca)*e.spd*3.4);
        if(A.parts.length<380) A.parts.push({x:e.x,y:e.y,vx:0,vy:0,life:.24,max:.24,c:e.def.c1,r:6});
        if(e.ct<=0){ e.state=0; e.cd=1.5; } }
      break; }
    case 'blink': {
      e.cd-=dt;
      if(e.cd<=0){ puff(e.x,e.y,10,e.def.c1,150,5,.4);
        const ba=rnd(0,TAU),br=rnd(120,220);
        e.x=clamp(p.x+Math.cos(ba)*br,30,A.w-30); e.y=clamp(p.y+Math.sin(ba)*br,30,A.h-30);
        puff(e.x,e.y,10,e.def.c1,150,5,.4); e.cd=rnd(1.6,2.6); AU.blip(700,.1,'sine',.06,-400);
        for(let i=0;i<3;i++) eshoot(e,angTo(e,p)+rnd(-.3,.3),180,9,8,'#bcd4ff');
      } else step(Math.cos(a)*e.spd*.4,Math.sin(a)*e.spd*.4);
      break; }
    case 'hopper': {
      e.cd-=dt;
      if(e.cd<=0){ e.state=1; e.hopA=a; e.ct=.55; e.cd=rnd(1.1,1.9); AU.boing(); }
      if(e.state===1){ e.ct-=dt; step(Math.cos(e.hopA)*e.spd*2.2,Math.sin(e.hopA)*e.spd*2.2);
        e.hop=Math.sin((1-e.ct/.55)*Math.PI)*26; if(e.ct<=0){ e.state=0; e.hop=0; shake(2); } }
      else e.hop=0;
      break; }
    case 'tank': {
      step(Math.cos(a)*e.spd,Math.sin(a)*e.spd);
      e.cd-=dt; if(e.cd<=0&&d<420){ e.cd=2.6;
        for(let i=0;i<8;i++) eshoot(e,i*TAU/8+e.t,150,10,9,'#ffb86b');
        AU.thump(); }
      break; }
    case 'dasher': {
      e.cd-=dt;
      if(e.cd<=0){ e.state=1; e.ct=.32; e.ca=a; e.cd=rnd(.9,1.5); }
      if(e.state===1){ e.ct-=dt; step(Math.cos(e.ca)*e.spd*3.6,Math.sin(e.ca)*e.spd*3.6); if(e.ct<=0) e.state=0; }
      else step(Math.cos(a+Math.sin(e.t*3)*.8)*e.spd*.7,Math.sin(a+Math.sin(e.t*3)*.8)*e.spd*.7);
      break; }
    case 'pulser': {
      step(Math.cos(a)*e.spd*.6,Math.sin(a)*e.spd*.6);
      e.cd-=dt; if(e.cd<=0){ e.cd=3.1; e.pulse=1;
        for(let i=0;i<14;i++) eshoot(e,i*TAU/14+rnd(-.1,.1),190,11,9,'#8dff3a');
        AU.blip(90,.3,'square',.14,120); shake(4); }
      e.pulse=Math.max(0,(e.pulse||0)-dt*2);
      break; }
    /* space */
    case 'sfighter': {
      const want=300, dir=d>want?1:d<want-120?-1:0;
      step(Math.cos(a)*e.spd*dir,Math.sin(a)*e.spd*dir);
      step(Math.cos(a+1.57)*e.spd*.8*Math.sin(e.t*1.3),Math.sin(a+1.57)*e.spd*.8*Math.sin(e.t*1.3));
      e.cd-=dt; if(e.cd<=0&&d<700){ e.cd=e.def.shot.cd; eshoot(e,a,e.def.shot.spd,e.def.shot.dmg,7,'#ff7a4a'); AU.blip(340,.06,'square',.05,-150); }
      break; }
    case 'smine': { step(Math.cos(a)*e.spd,Math.sin(a)*e.spd); e.spin2=(e.spin2||0)+dt*2; break; }
    case 'sdrone': {
      const want=380, dir=d>want?1:-1;
      step(Math.cos(a)*e.spd*dir*.7,Math.sin(a)*e.spd*dir*.7);
      e.cd-=dt; if(e.cd<=0&&d<760){ e.cd=e.def.shot.cd;
        for(let i=-1;i<=1;i++) eshoot(e,a+i*.22,e.def.shot.spd,e.def.shot.dmg,8,'#8dff3a'); }
      break; }
  }
}

/* ---------------- boss brain ---------------- */
function updateBoss(b,dt){
  const p=A.p, d=dist(b,p), a=angTo(b,p);
  b.face=a;
  b.phase = b.hp<b.max*.28?3 : b.hp<b.max*.6?2 : 1;
  const hasteful=1+(b.phase-1)*.28;
  if(!b.atk){
    b.cd-=dt*hasteful;
    const want=300;
    const dir=d>want+60?1:d<want-80?-1:0;
    b.x+=Math.cos(a)*b.spd*dir*dt; b.y+=Math.sin(a)*b.spd*dir*dt;
    b.x+=Math.cos(a+1.57)*b.spd*.7*Math.sin(b.t*.9)*dt; b.y+=Math.sin(a+1.57)*b.spd*.7*Math.sin(b.t*.9)*dt;
    if(b.cd<=0){ b.atk=pick(b.attacks); b.atkT=0; b.sub=0; b.cd=rnd(1.9,3.0)/hasteful; }
    return;
  }
  b.atkT+=dt;
  switch(b.atk){
    case 'radial': {
      if(b.sub<3&&b.atkT>b.sub*.45){ b.sub++;
        const n=12+b.phase*3, off=rnd(0,TAU);
        for(let i=0;i<n;i++) eshoot(b,off+i*TAU/n,215,13,10,b.def.c1);
        AU.blip(200,.16,'square',.1,-80); shake(4); }
      if(b.atkT>1.5) b.atk=null; break; }
    case 'spiral': {
      if(b.atkT<2.2&&b.atkT>(b.sub*.075)){ b.sub++;
        const ang=b.atkT*7.5;
        for(let k=0;k<2+b.phase;k++) eshoot(b,ang+k*TAU/(2+b.phase),245,11,9,b.def.c2);
      }
      if(b.atkT>2.3) b.atk=null; break; }
    case 'charge': {
      if(b.sub===0){ b.ca=a; b.sub=1; AU.blip(140,.3,'sawtooth',.12,340); }
      if(b.atkT<1.1){ b.x+=Math.cos(b.ca)*520*dt; b.y+=Math.sin(b.ca)*520*dt;
        if(A.parts.length<380) A.parts.push({x:b.x,y:b.y,vx:0,vy:0,life:.3,max:.3,c:b.def.c1,r:14});
        if(b.x<b.r+20||b.x>A.w-b.r-20) b.ca=Math.PI-b.ca;
        if(b.y<b.r+20||b.y>A.h-b.r-20) b.ca=-b.ca;
      } else { b.atk=null; shake(8); AU.thump(); }
      break; }
    case 'minions': {
      if(b.sub===0){ b.sub=1;
        const n=1+b.phase; for(let i=0;i<n;i++) spawnEnemy(b.spawnType,G.planet.tier,i*.3);
        toast('REINFORCEMENTS!'); AU.blip(420,.2,'triangle',.1,300); }
      if(b.atkT>.6) b.atk=null; break; }
    case 'ringwave': {
      if(b.sub<2&&b.atkT>b.sub*.7){ b.sub++;
        const n=20, off=rnd(0,TAU);
        for(let i=0;i<n;i++) eshoot(b,off+i*TAU/n,130+b.sub*70,12,11,'#ff8ae0',{life:4});
        AU.blip(110,.3,'sine',.14,180); shake(6); }
      if(b.atkT>1.7) b.atk=null; break; }
    case 'blinkbarrage': {
      if(b.sub===0){ b.sub=1; puff(b.x,b.y,20,b.def.c1,220,8,.5);
        const ba=rnd(0,TAU); b.x=clamp(p.x+Math.cos(ba)*280,80,A.w-80); b.y=clamp(p.y+Math.sin(ba)*280,80,A.h-80);
        puff(b.x,b.y,20,b.def.c1,220,8,.5); AU.blip(760,.14,'sine',.1,-420); }
      if(b.atkT>.3&&b.sub<6&&b.atkT>b.sub*.12){ b.sub++;
        eshoot(b,angTo(b,p)+rnd(-.16,.16),330,12,9,'#cfe0ff'); }
      if(b.atkT>1.1) b.atk=null; break; }
    case 'slam': {
      if(b.atkT<.7){ b.x=lerp(b.x,p.x,dt*4); b.y=lerp(b.y,p.y,dt*4); b.hop=Math.sin(b.atkT/.7*Math.PI)*54; }
      else if(b.sub===0){ b.sub=1; b.hop=0; shake(16); AU.boom();
        for(let i=0;i<22;i++) eshoot(b,i*TAU/22,240,15,11,'#ffcf5c');
        puff(b.x,b.y,26,'#ffcf5c',300,9,.6); }
      if(b.atkT>1.2) b.atk=null; break; }
    default: b.atk=null;
  }
}

/* ---------------- flow ---------------- */
function arriveAtPlanet(){
  const t=G.travelTarget;
  if(!t||G.scene!=='space') return;   // abandoned or already moved on
  Landing.start(t);
}
function onBossDefeated(){
  if(!resolveArena()) return;   // never pay a bounty twice
  const pl=G.planet, b=pl.boss;
  G.cleared[pl.id]=true;
  const pay=Math.round(pl.reward*DF().pay*(1+.2*pk('greed')));
  G.sprockets+=pay; G.bountyTotal+=pay;
  G.stats.bosses++; G.stats.peak=Math.max(G.stats.peak,G.sprockets);
  if(G.hp>G.maxhp*.8) G.stats.healthyBoss++;
  checkAchv();
  CG.happy(); CG.progress(); SAVE.mark();
  UI.hud(); MUS.stinger('win');
  UI.say(b.name,b.death,'boss:'+pl.id,()=>{
    if(pl.id==='ultradoom'){ UI.victory(); return; }
    UI.result('BOUNTY CLAIMED!', pl.name+' is free. '+b.name+' has been folded into a small cube.',
      [{k:'+'+pay+' SPROCKETS'},{k:'PLANET CLEARED'}],
      ()=>{ backToMap(); });
  });
}
function playerDown(){
  if(!resolveArena()) return;   // and never charge a death twice
  AU.boom(); shake(20); MUS.duck(.45); MUS.stinger('lose');
  const lost=Math.floor(G.sprockets*.12);
  G.sprockets=Math.max(0,G.sprockets-lost);
  setTimeout(()=>{
    UI.result('YOU GOT SPLORTED','Gary scraped you off the rocks and rebooted your spine. Insurance took a cut.',
      [{k:'-'+lost+' SPROCKETS'},{k:'FULL REPAIR'}],
      ()=>{ G.hp=G.maxhp; G.ship.hp=G.ship.maxhp; backToMap(); });
  },700);
}
function backToMap(){
  G.hp=Math.max(G.hp,G.maxhp*.5); G.ship.hp=G.ship.maxhp;
  G.paused=false; UI.modal=null; A.resolved=true; A.done=true;
  UI.hold(360); validateLoadout(); SAVE.mark();
  $('pausedTag').classList.remove('on');
  document.querySelectorAll('.layer').forEach(l=>l.classList.remove('on'));
  G.scene='starmap'; Starmap.enter(); UI.hud();
  if(!planetById('ultradoom').unlockedShown && PLANETS.slice(0,5).every(p=>G.cleared[p.id])){
    planetById('ultradoom').unlockedShown=true;
    UI.say('SHIP AI "GARY"','All five bounties cleared. The big one just unlocked: EMPEROR GLARBAXX THE UNREASONABLE, on Ultra-Doom Prime. Buy everything you can carry first. I am serious.','gary');
    UI.say('EMPEROR GLARBAXX','So. The little orange one has been collecting my staff. Come to Ultra-Doom Prime. Bring a bib.','boss:ultradoom');
  }
}
/* =========================================================================
   RENDERING — everything is drawn with thick cartoon ink
   ========================================================================= */
const INK='#100a2c';
function circ(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); }
function inked(fill,lw=4){ ctx.fillStyle=fill; ctx.fill(); ctx.lineWidth=lw; ctx.strokeStyle=INK; ctx.stroke(); }
function blobPath(x,y,r,t,wob=.14){
  ctx.beginPath();
  for(let i=0;i<=18;i++){ const a=i/18*TAU, rr=r*(1+Math.sin(a*3+t*3)*wob);
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.closePath();
}
function eyes(x,y,r,n,lookA,scale=1){
  const sp=r*.42;
  for(let i=0;i<n;i++){
    const ex=x+(n===1?0:(i?sp:-sp)), ey=y-r*.14;
    const er=r*(n===1?.42:.3)*scale;
    circ(ex,ey,er); inked('#fff',3);
    circ(ex+Math.cos(lookA)*er*.36,ey+Math.sin(lookA)*er*.36,er*.5); ctx.fillStyle=INK; ctx.fill();
    circ(ex-er*.22,ey-er*.28,er*.18); ctx.fillStyle='#fff'; ctx.fill();
  }
}
function mouthGrin(x,y,r){
  ctx.beginPath(); ctx.arc(x,y+r*.28,r*.42,.25,Math.PI-.25);
  ctx.lineWidth=3; ctx.strokeStyle=INK; ctx.stroke();
}
function fang(x,y,r){
  ctx.beginPath(); ctx.moveTo(x-r*.3,y+r*.26); ctx.lineTo(x+r*.3,y+r*.26); ctx.lineTo(x,y+r*.62); ctx.closePath();
  inked('#fff',3);
}

function drawEnemy(e){
  const d=e.def, s=d.shape||'blob', hop=e.hop||0, x=e.x, y=e.y-hop, r=e.r;
  ctx.save();
  if(e.spawn>0) ctx.globalAlpha=.4;
  if(e.flash>0){ ctx.shadowColor='#fff'; ctx.shadowBlur=18; }
  const c1=e.flash>.4?'#ffffff':d.c1, c2=d.c2, look=e.face||0;
  switch(s){
    case 'bat':
      ctx.save(); ctx.translate(x,y);
      for(const sd of [-1,1]){ ctx.beginPath(); ctx.moveTo(sd*r*.5,0);
        ctx.quadraticCurveTo(sd*r*1.9,-r*.9+Math.sin(e.t*11)*r*.5,sd*r*2.1,r*.4);
        ctx.quadraticCurveTo(sd*r*1.2,r*.2,sd*r*.5,r*.5); ctx.closePath(); inked(c2,3); }
      ctx.restore();
      circ(x,y,r); inked(c1); eyes(x,y,r,2,look); fang(x,y,r); break;
    case 'taco':
      ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(e.t*3)*.12);
      ctx.beginPath(); ctx.arc(0,r*.2,r,Math.PI,0); ctx.closePath(); inked(c1);
      ctx.beginPath(); ctx.arc(0,r*.2,r*.72,Math.PI,0); ctx.closePath(); inked('#7bd86a',3);
      ctx.restore();
      eyes(x,y+r*.05,r,2,look); break;
    case 'knight':
      ctx.save(); ctx.translate(x,y); ctx.rotate(look);
      ctx.beginPath(); ctx.moveTo(r*.4,-4); ctx.lineTo(r*2.1,-3); ctx.lineTo(r*2.1,3); ctx.lineTo(r*.4,4); ctx.closePath(); inked('#e8ecf5',3);
      for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(r*2.0,i*6-2); ctx.lineTo(r*2.7,i*6); ctx.lineTo(r*2.0,i*6+2); ctx.closePath(); inked('#cfd6e6',2); }
      ctx.restore();
      circ(x,y,r); inked(c1);
      ctx.beginPath(); ctx.rect(x-r*.7,y-r*.3,r*1.4,r*.34); inked(INK,2);
      eyes(x,y-r*.1,r,1,look,.7); break;
    case 'ghost':
      ctx.beginPath(); ctx.moveTo(x-r,y+r*.6); ctx.lineTo(x-r,y-r*.2);
      ctx.arc(x,y-r*.2,r,Math.PI,0); ctx.lineTo(x+r,y+r*.6);
      for(let i=0;i<4;i++) ctx.quadraticCurveTo(x+r-r*.5*(i*2+1),y+r*.6+(i%2?18:-8),x+r-r*.5*(i*2+2),y+r*.6);
      ctx.closePath(); inked(c1); eyes(x,y-r*.2,r,2,look); mouthGrin(x,y-r*.1,r); break;
    case 'sheep':
      ctx.save(); ctx.translate(x,y);
      for(let i=0;i<7;i++){ const a=i/7*TAU; circ(Math.cos(a)*r*.6,Math.sin(a)*r*.6,r*.55); inked('#fff',3); }
      circ(0,0,r*.7); inked('#f4efe6',3);
      ctx.beginPath(); ctx.rect(-r*.42,r*.1,r*.84,r*.5); inked(c2,3);
      ctx.restore();
      eyes(x,y-r*.1,r,2,look,.8); break;
    case 'squid':
      ctx.save(); ctx.translate(x,y);
      for(let i=0;i<5;i++){ const px=(i-2)*r*.36;
        ctx.beginPath(); ctx.moveTo(px,r*.2);
        ctx.quadraticCurveTo(px+Math.sin(e.t*6+i)*r*.5,r*.9,px+Math.sin(e.t*6+i)*r*.8,r*1.4);
        ctx.lineWidth=6; ctx.strokeStyle=c2; ctx.lineCap='round'; ctx.stroke(); }
      ctx.restore();
      ctx.beginPath(); ctx.ellipse(x,y,r*.9,r*1.05,0,0,TAU); inked(c1);
      eyes(x,y-r*.15,r,2,look); break;
    case 'barnacle':
      blobPath(x,y,r,e.t,.09); inked(c2);
      circ(x,y,r*.62); inked(c1,3);
      for(let i=0;i<5;i++){ const a=i/5*TAU+e.t*.4; circ(x+Math.cos(a)*r*.8,y+Math.sin(a)*r*.8,r*.2); inked('#fff',2); }
      eyes(x,y,r,1,look); break;
    case 'bot':
      ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(e.t*8)*.16);
      ctx.beginPath(); ctx.rect(-r*.8,-r*.9,r*1.6,r*1.8); inked(c1);
      ctx.beginPath(); ctx.rect(-r*.55,-r*.55,r*1.1,r*.6); inked(INK,2);
      ctx.beginPath(); ctx.moveTo(0,-r*.9); ctx.lineTo(0,-r*1.5); ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.stroke();
      circ(0,-r*1.6,r*.2); inked('#ffd23f',3);
      ctx.restore();
      eyes(x,y-r*.25,r,2,look,.62); break;
    case 'speaker':
      ctx.beginPath(); ctx.rect(x-r*.85,y-r,r*1.7,r*2); inked(c2);
      circ(x,y+r*.2,r*.6); inked(c1,3); circ(x,y+r*.2,r*.25); inked(INK,2);
      if(e.pulse>0){ circ(x,y+r*.2,r*(1+ (1-e.pulse)*2)); ctx.strokeStyle='#8dff3a'; ctx.lineWidth=4; ctx.globalAlpha=e.pulse; ctx.stroke(); ctx.globalAlpha=1; }
      eyes(x,y-r*.55,r,2,look,.55); break;
    case 'jelly':
      ctx.save(); ctx.translate(x,y);
      for(let i=0;i<6;i++){ const px=(i-2.5)*r*.3;
        ctx.beginPath(); ctx.moveTo(px,r*.3); ctx.quadraticCurveTo(px,r*.9,px+Math.sin(e.t*5+i)*r*.4,r*1.3);
        ctx.lineWidth=5; ctx.strokeStyle=c2; ctx.lineCap='round'; ctx.stroke(); }
      ctx.beginPath(); ctx.arc(0,0,r,Math.PI,0); ctx.closePath(); inked(c1);
      ctx.restore(); eyes(x,y-r*.3,r,1,look); break;
    case 'ship':
      ctx.save(); ctx.translate(x,y); ctx.rotate((e.face||0)+Math.PI/2);
      if(e.ai==='smine'){ ctx.rotate(e.spin2||0);
        for(let i=0;i<8;i++){ const a=i*TAU/8; ctx.beginPath(); ctx.moveTo(0,0);
          ctx.lineTo(Math.cos(a)*r*1.5,Math.sin(a)*r*1.5); ctx.lineWidth=7; ctx.strokeStyle=c2; ctx.stroke(); }
        circ(0,0,r); inked(c1); circ(0,0,r*.4); inked('#ff2020',3);
      } else {
        ctx.beginPath(); ctx.moveTo(0,-r*1.25); ctx.lineTo(r*.95,r*.85); ctx.lineTo(0,r*.4); ctx.lineTo(-r*.95,r*.85); ctx.closePath(); inked(c1);
        circ(0,-r*.25,r*.36); inked('#8ef0ff',3);
        ctx.beginPath(); ctx.moveTo(-r*.3,r*.5); ctx.lineTo(0,r*(1.1+Math.random()*.5)); ctx.lineTo(r*.3,r*.5); ctx.closePath(); inked('#ff9a3d',2);
      }
      ctx.restore(); break;
    /* ---- bosses ---- */
    case 'slug':
      ctx.save(); ctx.translate(x,y);
      ctx.beginPath(); ctx.ellipse(0,r*.5,r*1.35,r*.6,0,0,TAU); inked(c2,5);
      blobPath(0,0,r,e.t,.1); inked(c1,5);
      for(const sd of [-1,1]){ ctx.beginPath(); ctx.moveTo(sd*r*.35,-r*.6);
        ctx.quadraticCurveTo(sd*r*.7,-r*1.5,sd*r*.45,-r*1.75); ctx.lineWidth=7; ctx.strokeStyle=c2; ctx.stroke();
        circ(sd*r*.45,-r*1.8,r*.2); inked('#fff',3); circ(sd*r*.45,-r*1.8,r*.09); ctx.fillStyle=INK; ctx.fill(); }
      circ(r*.55,-r*.55,r*.5); inked('#ffd23f',4);
      ctx.restore(); eyes(x,y,r,2,look,.9); mouthGrin(x,y+r*.2,r); break;
    case 'chef':
      ctx.save(); ctx.translate(x,y);
      blobPath(0,r*.1,r,e.t,.06); inked(c1,5);
      ctx.beginPath(); ctx.ellipse(0,-r*1.05,r*.72,r*.55,0,0,TAU); inked('#fff',4);
      ctx.beginPath(); ctx.rect(-r*.75,-r*.72,r*1.5,r*.26); inked('#f2f2f2',3);
      ctx.save(); ctx.rotate(Math.sin(e.t*4)*.3); ctx.translate(r*1.1,0);
      ctx.beginPath(); ctx.rect(-4,-r*.9,8,r*1.5); inked('#dfe4ee',3);
      for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.rect(i*7-2,-r*1.4,4,r*.6); inked('#dfe4ee',2); }
      ctx.restore(); ctx.restore();
      eyes(x,y-r*.1,r,2,look,.9);
      ctx.beginPath(); ctx.arc(x,y+r*.3,r*.36,0,Math.PI); inked('#7a1020',3); break;
    case 'steve':
      ctx.save(); ctx.translate(x,y);
      ctx.beginPath(); ctx.roundRect(-r*1.15,-r*.75,r*2.3,r*1.5,r*.5); inked(c1,5);
      ctx.restore();
      eyes(x,y-r*.1,r,2,look,.85);
      ctx.beginPath(); ctx.arc(x,y+r*.3,r*.3,0,Math.PI); inked('#2a2a55',3);
      for(let i=0;i<3;i++){ ctx.font='900 '+(14+i*7)+'px sans-serif'; ctx.fillStyle='#cfe0ff';
        ctx.fillText('Z',x+r*.9+i*16,y-r*.7-i*18-Math.sin(e.t*2+i)*6); }
      break;
    case 'squidboss':
      ctx.save(); ctx.translate(x,y);
      for(let i=0;i<7;i++){ const px=(i-3)*r*.34;
        ctx.beginPath(); ctx.moveTo(px,r*.3);
        ctx.quadraticCurveTo(px+Math.sin(e.t*4+i)*r*.8,r*1.1,px+Math.sin(e.t*4+i)*r*1.2,r*1.8);
        ctx.lineWidth=11; ctx.strokeStyle=c2; ctx.lineCap='round'; ctx.stroke(); }
      ctx.beginPath(); ctx.ellipse(0,0,r*1.0,r*1.15,0,0,TAU); inked(c1,5);
      ctx.beginPath(); ctx.moveTo(-r*.9,-r*.75); ctx.lineTo(r*.9,-r*.75); ctx.lineTo(0,-r*1.5); ctx.closePath(); inked('#2a2a3a',4);
      ctx.beginPath(); ctx.ellipse(0,r*.55,r*.7,r*.3,0,0,TAU); inked('#e9e2d0',3);
      ctx.restore(); eyes(x,y-r*.2,r,2,look,.9); break;
    case 'dj':
      ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(e.t*7)*.1);
      circ(0,0,r); inked(c1,5);
      for(let i=0;i<10;i++){ const a=i*TAU/10+e.t*2; ctx.beginPath();
        ctx.rect(Math.cos(a)*r*.6-4,Math.sin(a)*r*.6-4,9,9); inked(i%2?'#fff':'#31e6ff',2); }
      for(const sd of [-1,1]){ circ(sd*r*1.15,0,r*.42); inked('#2a2a3a',4); }
      ctx.beginPath(); ctx.arc(0,-r*.15,r*1.15,Math.PI,0); ctx.lineWidth=9; ctx.strokeStyle='#2a2a3a'; ctx.stroke();
      ctx.restore(); eyes(x,y,r,2,look,.8); break;
    case 'emperor':
      ctx.save(); ctx.translate(x,y);
      for(let i=0;i<4;i++){ const a=i*TAU/4+e.t*.7; ctx.beginPath();
        ctx.moveTo(0,0); ctx.quadraticCurveTo(Math.cos(a)*r*1.5,Math.sin(a)*r*1.5,Math.cos(a)*r*1.9,Math.sin(a)*r*1.9);
        ctx.lineWidth=13; ctx.strokeStyle=c2; ctx.lineCap='round'; ctx.stroke(); }
      blobPath(0,0,r,e.t,.08); inked(c1,6);
      ctx.beginPath(); ctx.moveTo(-r*.8,-r*.8);
      for(let i=0;i<5;i++){ ctx.lineTo(-r*.8+i*r*.4,-r*(i%2?1.6:1.0)); }
      ctx.lineTo(r*.8,-r*.8); ctx.closePath(); inked('#ffd23f',4);
      ctx.restore();
      eyes(x,y,r,2,look,1.1); fang(x,y+r*.2,r*1.2); break;
    default:
      blobPath(x,y,r,e.t,.13); inked(c1); eyes(x,y,r,d.eyes||2,look); mouthGrin(x,y,r);
  }
  ctx.restore();
  /* health pip for tough guys */
  if(!e.boss&&e.hp<e.max&&e.max>60){
    const w=e.r*1.8; ctx.fillStyle='#0007'; ctx.fillRect(x-w/2,y-e.r-16,w,6);
    ctx.fillStyle='#ff5b8a'; ctx.fillRect(x-w/2,y-e.r-16,w*(e.hp/e.max),6);
  }
}

function drawPlayer(){
  const p=A.p, t=performance.now()/1000;
  ctx.save();
  if(p.inv>0&&Math.floor(t*20)%2) ctx.globalAlpha=.45;
  if(A.mode==='space'){
    ctx.translate(p.x,p.y); ctx.rotate(p.face+Math.PI/2);
    ctx.beginPath(); ctx.moveTo(-14,26); ctx.lineTo(0,32+Math.random()*10); ctx.lineTo(14,26); ctx.closePath(); inked('#ff9a3d',3);
    ctx.beginPath(); ctx.moveTo(0,-30); ctx.quadraticCurveTo(20,4,16,24); ctx.lineTo(-16,24); ctx.quadraticCurveTo(-20,4,0,-30); ctx.closePath(); inked('#ffd23f',4);
    ctx.beginPath(); ctx.moveTo(16,10); ctx.lineTo(30,26); ctx.lineTo(14,24); ctx.closePath(); inked('#ff2fa0',3);
    ctx.beginPath(); ctx.moveTo(-16,10); ctx.lineTo(-30,26); ctx.lineTo(-14,24); ctx.closePath(); inked('#ff2fa0',3);
    circ(0,-6,10); inked('#8ef0ff',3);
    ctx.restore(); return;
  }
  const bob=Math.sin(p.walk)*2.5;
  /* shadow */
  ctx.beginPath(); ctx.ellipse(p.x,p.y+20,17,6,0,0,TAU); ctx.fillStyle='#0004'; ctx.fill();
  /* jet flame when moving */
  const mv=moveVec();
  if(mv.m>.1){ ctx.beginPath(); ctx.moveTo(p.x-8,p.y+10); ctx.lineTo(p.x,p.y+20+Math.random()*10); ctx.lineTo(p.x+8,p.y+10); ctx.closePath(); inked('#31e6ff',2); }
  /* legs */
  ctx.beginPath(); ctx.rect(p.x-11,p.y+6+bob,8,12); inked('#3a2a6b',3);
  ctx.beginPath(); ctx.rect(p.x+3,p.y+6-bob,8,12); inked('#3a2a6b',3);
  /* body */
  ctx.beginPath(); ctx.roundRect(p.x-14,p.y-10+bob*.4,28,22,8); inked('#ff7a29',4);
  ctx.beginPath(); ctx.rect(p.x-14,p.y-2+bob*.4,28,5); inked('#31e6ff',2);
  /* head */
  circ(p.x,p.y-20+bob*.4,14); inked('#ffd9b0',4);
  ctx.beginPath(); ctx.arc(p.x,p.y-22+bob*.4,14,Math.PI,0); ctx.closePath(); inked('#31e6ff',4);
  ctx.save(); ctx.globalAlpha=.5; ctx.beginPath(); ctx.arc(p.x-4,p.y-26+bob*.4,5,0,TAU); ctx.fillStyle='#fff'; ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.moveTo(p.x+11,p.y-30+bob*.4); ctx.lineTo(p.x+16,p.y-42+bob*.4);
  ctx.lineWidth=3; ctx.strokeStyle=INK; ctx.stroke();
  circ(p.x+16,p.y-44+bob*.4,4); inked('#ff2fa0',2);
  /* eyes peeking under visor */
  const lx=p.x+Math.cos(p.face)*3, ly=p.y-18+Math.sin(p.face)*2+bob*.4;
  circ(lx-4,ly,2.6); ctx.fillStyle=INK; ctx.fill(); circ(lx+4,ly,2.6); ctx.fillStyle=INK; ctx.fill();
  /* weapon arm */
  const wid=currentWeapon(), w=WDEF[wid];
  ctx.save(); ctx.translate(p.x,p.y-2+bob*.4); ctx.rotate(p.face);
  const kick=Math.max(0,A.fireCd/(w.rate||.2))*5;
  ctx.beginPath(); ctx.roundRect(6-kick,-7,26,14,5); inked(w.melee?'#ff5b8a':'#6c5ce7',3);
  ctx.beginPath(); ctx.roundRect(26-kick,-5,12,10,4); inked('#ffd23f',3);
  ctx.save(); ctx.translate(20-kick,0); ctx.rotate(-p.face); drawSym(w.icon,0,0,15); ctx.restore();
  ctx.restore();
  ctx.restore();
}

function drawBullet(b){
  ctx.save(); ctx.translate(b.x,b.y);
  switch(b.kind){
    case 'mallet': {
      ctx.rotate(b.ang+Math.sin(b.life*30)*.35);
      ctx.beginPath(); ctx.roundRect(10,-9,b.r*.55,18,6); inked('#ff5b8a',4);
      ctx.beginPath(); ctx.rect(0,-4,14,8); inked('#8a5a2b',3);
      ctx.globalAlpha=.35; ctx.beginPath(); ctx.arc(0,0,b.r,b.ang-1.1,b.ang+1.1); ctx.lineWidth=12; ctx.strokeStyle='#fff'; ctx.stroke();
      break; }
    case 'chicken': ctx.rotate(b.rot);
      ctx.beginPath(); ctx.ellipse(0,0,b.r,b.r*.75,0,0,TAU); inked('#ffe14d',3);
      ctx.beginPath(); ctx.moveTo(b.r*.6,-b.r*.3); ctx.lineTo(b.r*1.4,0); ctx.lineTo(b.r*.6,b.r*.2); ctx.closePath(); inked('#ff7a29',2);
      circ(b.r*.3,-b.r*.3,3); ctx.fillStyle=INK; ctx.fill(); break;
    case 'bee': ctx.rotate(Math.atan2(b.vy,b.vx));
      ctx.beginPath(); ctx.ellipse(0,0,b.r,b.r*.7,0,0,TAU); inked('#ffd23f',2);
      ctx.beginPath(); ctx.rect(-2,-b.r*.7,3,b.r*1.4); inked(INK,1);
      ctx.globalAlpha=.6; circ(0,-b.r,b.r*.7); inked('#fff',1); break;
    case 'nacho': ctx.rotate(b.rot);
      ctx.beginPath(); ctx.moveTo(0,-b.r); ctx.lineTo(b.r,b.r*.8); ctx.lineTo(-b.r,b.r*.8); ctx.closePath(); inked(b.color,2); break;
    case 'paper': {
      ctx.globalAlpha=.35; ctx.rotate(Math.atan2(b.vy,b.vx));
      ctx.beginPath(); ctx.roundRect(-26,-b.r*.45,30,b.r*.9,3); inked('#fdfaf0',2);
      ctx.globalAlpha=1; ctx.rotate(-Math.atan2(b.vy,b.vx)); ctx.rotate(b.rot*.35);
      ctx.beginPath(); ctx.roundRect(-b.r*.7,-b.r*.9,b.r*1.4,b.r*1.8,2); inked('#fdfaf0',3);
      ctx.strokeStyle='#8a7fb5'; ctx.lineWidth=1.6;
      for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(-b.r*.45,i*b.r*.28); ctx.lineTo(b.r*.45,i*b.r*.28); ctx.stroke(); }
      ctx.beginPath(); ctx.arc(b.r*.3,-b.r*.55,b.r*.22,0,TAU); inked('#ff2fa0',1.5);
      break; }
    case 'disco': ctx.rotate(performance.now()/120);
      circ(0,0,b.r); inked(Math.floor(performance.now()/90+b.strobe)%2?'#a0f6ff':'#ff8ae0',3);
      for(let i=0;i<4;i++){ const a=i*TAU/4; ctx.beginPath(); ctx.rect(Math.cos(a)*b.r*.5-2,Math.sin(a)*b.r*.5-2,5,5); ctx.fillStyle='#fff'; ctx.fill(); }
      break;
    case 'burrito': ctx.rotate(b.rot*.3);
      ctx.globalAlpha=.28; circ(0,0,b.r*4.2); ctx.fillStyle='#4b1e6b'; ctx.fill(); ctx.globalAlpha=1;
      ctx.beginPath(); ctx.roundRect(-b.r,-b.r*.55,b.r*2,b.r*1.1,b.r*.5); inked('#e0b57a',3);
      ctx.beginPath(); ctx.moveTo(-b.r*.5,-b.r*.4); ctx.lineTo(b.r*.5,b.r*.4); ctx.lineWidth=3; ctx.strokeStyle='#b98a4e'; ctx.stroke(); break;
    case 'fist': ctx.rotate(Math.atan2(b.vy,b.vx));
      ctx.beginPath(); ctx.roundRect(-b.r*.8,-b.r*.8,b.r*1.6,b.r*1.6,b.r*.5); inked('#ff6fd1',4);
      circ(b.r*.35,-b.r*.25,4); ctx.fillStyle=INK; ctx.fill();
      circ(b.r*.35,b.r*.25,4); ctx.fillStyle=INK; ctx.fill();
      ctx.globalAlpha=.4; ctx.beginPath(); ctx.moveTo(-b.r,-b.r); ctx.lineTo(-b.r*2.4,0); ctx.lineTo(-b.r,b.r); ctx.closePath(); inked('#fff',1); break;
    case 'toast': ctx.rotate(Math.atan2(b.vy,b.vx));
      ctx.beginPath(); ctx.roundRect(-18,-b.r*.5,36,b.r,3); inked('#ffd88a',2); break;
    default:
      circ(0,0,b.r); inked(b.color,2);
  }
  ctx.restore();
}
function drawArena(){
  const sx=A.shake?rnd(-A.shake,A.shake):0, sy=A.shake?rnd(-A.shake,A.shake):0;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=A.mode==='space'?'#07051c':A.tint; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(-A.cam.x+sx,-A.cam.y+sy);

  if(A.mode==='space'){
    for(const d of A.doodads){ ctx.globalAlpha=.25+d.h*.7;
      ctx.fillStyle='#fff'; ctx.fillRect(d.x,d.y,d.s,d.s); }
    ctx.globalAlpha=.16;
    const g=ctx.createRadialGradient(A.w*.35,A.h*.4,40,A.w*.35,A.h*.4,A.w*.6);
    g.addColorStop(0,'#ff2fa0'); g.addColorStop(1,'#07051c00'); ctx.fillStyle=g;
    ctx.fillRect(0,0,A.w,A.h); ctx.globalAlpha=1;
  } else {
    ctx.fillStyle=A.ground; ctx.fillRect(0,0,A.w,A.h);
    ctx.globalAlpha=.14; ctx.strokeStyle='#000'; ctx.lineWidth=2;
    for(let x=0;x<A.w;x+=90){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,A.h); ctx.stroke(); }
    for(let y=0;y<A.h;y+=90){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(A.w,y); ctx.stroke(); }
    ctx.globalAlpha=1;
    for(const d of A.doodads){
      if(d.x<A.cam.x-120||d.x>A.cam.x+W+120||d.y<A.cam.y-140||d.y>A.cam.y+H+140) continue;
      ctx.save(); ctx.translate(d.x,d.y); ctx.scale(d.s,d.s);
      switch(A.prop){
        case 'goo': ctx.beginPath(); ctx.ellipse(0,0,26,14,0,0,TAU); inked(d.c,3);
          circ(-6,-4,4); inked('#ffffff55',1); break;
        case 'crunch': ctx.beginPath(); ctx.moveTo(-18,12); ctx.lineTo(0,-20); ctx.lineTo(18,12); ctx.closePath(); inked(d.c,3); break;
        case 'dream': ctx.beginPath(); ctx.roundRect(-22,-12,44,24,10); inked(d.c,3);
          ctx.beginPath(); ctx.moveTo(-10,-12); ctx.lineTo(10,12); ctx.lineWidth=2; ctx.strokeStyle='#ffffff44'; ctx.stroke(); break;
        case 'ocean': ctx.beginPath(); ctx.arc(0,0,16,Math.PI,0); ctx.closePath(); inked(d.c,3);
          ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(16,0); ctx.lineWidth=3; ctx.strokeStyle=INK; ctx.stroke(); break;
        case 'disco': ctx.beginPath(); ctx.rect(-16,-16,32,32); inked(d.h>.5?'#ff64c8':'#31e6ff',3); break;
        default: ctx.beginPath(); ctx.moveTo(0,-24); ctx.lineTo(14,14); ctx.lineTo(-14,14); ctx.closePath(); inked(d.c,3);
      }
      ctx.restore();
    }
    ctx.lineWidth=10; ctx.strokeStyle=INK; ctx.strokeRect(0,0,A.w,A.h);
    ctx.lineWidth=4; ctx.strokeStyle='#ffffff22'; ctx.strokeRect(10,10,A.w-20,A.h-20);
  }

  /* drops */
  for(const d of A.drops){
    const bob=Math.sin(d.t*6)*3;
    ctx.save(); ctx.translate(d.x,d.y+bob);
    if(d.kind==='coin'){ ctx.rotate(Math.sin(d.t*4)*.5);
      ctx.beginPath(); ctx.ellipse(0,0,9,10,0,0,TAU); inked('#ffd23f',3);
      ctx.beginPath(); ctx.arc(0,0,4,0,TAU); inked('#b8860b',2); }
    else if(d.kind==='hp'){ ctx.beginPath(); ctx.rect(-4,-11,8,22); inked('#7dff6a',3);
      ctx.beginPath(); ctx.rect(-11,-4,22,8); inked('#7dff6a',3); }
    else { ctx.beginPath(); ctx.roundRect(-10,-8,20,16,4); inked('#31e6ff',3);
      ctx.font='900 11px sans-serif'; ctx.fillStyle=INK; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('AM',0,1); }
    ctx.restore();
  }
  /* pets */
  for(const g of A.pets){
    ctx.save(); ctx.translate(g.x,g.y+Math.sin(g.wob)*4);
    blobPath(0,0,g.r,g.wob,.18); inked('#c86bff',4);
    eyes(0,0,g.r,3,0,.75);
    ctx.restore();
  }
  for(const e of A.enemies) if(!e.boss) drawEnemy(e);
  if(A.boss) drawEnemy(A.boss);
  for(const b of A.bullets) drawBullet(b);
  for(const b of A.ebullets){
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot);
    ctx.beginPath(); ctx.moveTo(0,-b.r*1.2); ctx.lineTo(b.r,0); ctx.lineTo(0,b.r*1.2); ctx.lineTo(-b.r,0); ctx.closePath();
    inked(b.color,3); ctx.restore();
  }
  if(!A.p.dead) drawPlayer();
  /* particles */
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const q of A.parts){
    const k=q.life/q.max;
    ctx.globalAlpha=Math.max(0,k);
    if(q.txt){ ctx.font='900 '+(q.size||14)+'px Impact,"Arial Black",sans-serif';
      ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.strokeText(q.txt,q.x,q.y); ctx.fillStyle=q.c; ctx.fillText(q.txt,q.x,q.y); }
    else { circ(q.x,q.y,q.r*k); ctx.fillStyle=q.c; ctx.fill(); }
  }
  ctx.globalAlpha=1;
  ctx.restore();
  if(A.flash>0){ ctx.fillStyle='rgba(255,255,255,'+(A.flash*.5)+')'; ctx.fillRect(0,0,W,H); }
  /* offscreen enemy arrows */
  ctx.save();
  for(const e of A.enemies){
    const sxx=e.x-A.cam.x, syy=e.y-A.cam.y;
    if(sxx>-30&&sxx<W+30&&syy>-30&&syy<H+30) continue;
    const cx=W/2, cy=H/2, a=Math.atan2(syy-cy,sxx-cx);
    const px=cx+Math.cos(a)*(Math.min(W,H)/2-34), py=cy+Math.sin(a)*(Math.min(W,H)/2-34);
    ctx.save(); ctx.translate(px,py); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(11,0); ctx.lineTo(-7,-7); ctx.lineTo(-7,7); ctx.closePath();
    inked(e.boss?'#ff2fa0':'#ffd23f',2); ctx.restore();
  }
  ctx.restore();
}

/* =========================================================================
   ATTRACT SCREEN — the Greasy Comet flies forever until you press a button
   ========================================================================= */
const Attract={
  t:0, layers:[[],[],[]], worlds:[], rocks:[], foes:[], shots:[], parts:[], cameo:null,
  ship:{y:.74,ty:.74,bank:0,fire:0},
  init(){
    this.layers=[[],[],[]];
    const counts=[80,48,26];
    for(let L=0;L<3;L++) for(let i=0;i<counts[L];i++)
      this.layers[L].push({x:Math.random(),y:Math.random(),s:[1,1.7,2.6][L]});
    this.worlds=[];
    for(let i=0;i<3;i++) this.worlds.push(this.newWorld(rnd(.15,1.5)));
  },
  newWorld(x){ const p=PLANETS[rint(0,PLANETS.length-1)];
    return {x,y:rnd(.06,.40),r:rnd(38,104),c1:p.c1,c2:p.c2,spin:rnd(-.2,.2),rot:0}; },
  boom(x,y,c,n){ for(let i=0;i<n;i++){ const a=rnd(0,TAU),s=rnd(.05,.34);
    this.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s*(W/H),life:rnd(.25,.65),max:.65,c,r:rnd(2,7)}); } },
  update(dt){
    this.t+=dt;
    const sp=[.018,.05,.115];
    for(let L=0;L<3;L++) for(const s of this.layers[L]){ s.x-=sp[L]*dt;
      if(s.x<-.02){ s.x=1.02; s.y=Math.random(); } }
    for(let i=0;i<this.worlds.length;i++){ const w=this.worlds[i];
      w.x-=.014*dt; w.rot+=w.spin*dt;
      if(w.x*W<-w.r*1.5) this.worlds[i]=this.newWorld(1+ (w.r*1.5)/W); }
    /* the ship drifts, banks, and keeps its nose up */
    const sh=this.ship;
    if(Math.random()<dt*.55) sh.ty=rnd(.56,.88);
    const dy=sh.ty-sh.y; sh.y+=dy*dt*1.7; sh.bank=clamp(-dy*9,-.42,.42);
    sh.fire=Math.max(0,sh.fire-dt);
    /* debris */
    if(Math.random()<dt*1.1) this.rocks.push({x:1.08,y:rnd(.42,.98),r:rnd(9,26),rot:0,spin:rnd(-2.4,2.4),v:rnd(.09,.2)});
    for(let i=this.rocks.length-1;i>=0;i--){ const r=this.rocks[i];
      r.x-=r.v*dt; r.rot+=r.spin*dt; if(r.x<-.08) this.rocks.splice(i,1); }
    /* patrol craft wander in to be shot at */
    if(this.foes.length<3&&Math.random()<dt*.5)
      this.foes.push({x:1.12,y:rnd(.5,.92),v:rnd(.13,.22),hp:2,wob:rnd(0,TAU)});
    for(let i=this.foes.length-1;i>=0;i--){ const f=this.foes[i];
      f.x-=f.v*dt; f.wob+=dt*3; f.y+=Math.sin(f.wob)*.0009;
      if(f.x<-.1){ this.foes.splice(i,1); continue; }
      if(f.x>.36&&f.x<1&&Math.abs(f.y-sh.y)<.055&&sh.fire<=0){
        sh.fire=.22;
        this.shots.push({x:.34,y:sh.y-.008,v:.95});
        if(AU.on&&AU.ctx) AU.blip(rnd(640,780),.05,'square',.05,-360);
      }
    }
    for(let i=this.shots.length-1;i>=0;i--){ const b=this.shots[i]; b.x+=b.v*dt;
      let hit=false;
      for(let k=this.foes.length-1;k>=0;k--){ const f=this.foes[k];
        if(Math.abs(f.x-b.x)<.022&&Math.abs(f.y-b.y)<.03){
          f.hp--; hit=true;
          if(f.hp<=0){ this.boom(f.x,f.y,'#ff7a4a',16); this.foes.splice(k,1);
            if(AU.on&&AU.ctx) AU.noise(.16,.09,240); }
          break; }
      }
      if(hit||b.x>1.1) this.shots.splice(i,1);
    }
    for(let i=this.parts.length-1;i>=0;i--){ const q=this.parts[i];
      q.life-=dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=1-1.6*dt; q.vy*=1-1.6*dt;
      if(q.life<=0) this.parts.splice(i,1); }
    /* very occasionally, a Glorb waves as it goes past */
    if(!this.cameo&&Math.random()<dt*.012) this.cameo={x:1.12,y:rnd(.2,.5),wob:0,r:rnd(20,34)};
    if(this.cameo){ this.cameo.x-=.09*dt; this.cameo.wob+=dt*2.2;
      if(this.cameo.x<-.12) this.cameo=null; }
  },
  draw(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#150a33'); g.addColorStop(.5,'#0d0725'); g.addColorStop(1,'#05030f');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.2;
    for(const [cx,cy,cc] of [[.2,.3,'#ff2fa0'],[.78,.6,'#31e6ff'],[.5,.15,'#8dff3a']]){
      const rg=ctx.createRadialGradient(cx*W,cy*H,10,cx*W,cy*H,Math.max(W,H)*.45);
      rg.addColorStop(0,cc); rg.addColorStop(1,'#00000000'); ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
    }
    ctx.globalAlpha=1;
    /* planets drifting past */
    for(const w of this.worlds){
      const x=w.x*W, y=w.y*H;
      ctx.save(); ctx.globalAlpha=.9;
      circ(x,y,w.r); inked(w.c1,5);
      ctx.save(); ctx.beginPath(); ctx.arc(x,y,w.r,0,TAU); ctx.clip();
      ctx.beginPath(); ctx.ellipse(x-w.r*.3,y+w.r*.34,w.r*.75,w.r*.34,-.4+w.rot,0,TAU); ctx.fillStyle=w.c2; ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+w.r*.42,y-w.r*.4,w.r*.5,w.r*.22,.3+w.rot,0,TAU); ctx.fillStyle=w.c2; ctx.fill();
      ctx.globalAlpha=.24; ctx.beginPath(); ctx.arc(x+w.r*.55,y+w.r*.5,w.r,0,TAU); ctx.fillStyle='#000'; ctx.fill();
      ctx.restore(); ctx.restore();
    }
    /* starfield */
    for(let L=0;L<3;L++){ ctx.globalAlpha=[.35,.6,.95][L]; ctx.fillStyle='#fff';
      for(const s of this.layers[L]) ctx.fillRect(s.x*W,s.y*H,s.s,s.s); }
    ctx.globalAlpha=1;
    /* rubble */
    for(const r of this.rocks){
      ctx.save(); ctx.translate(r.x*W,r.y*H); ctx.rotate(r.rot);
      ctx.beginPath();
      for(let i=0;i<7;i++){ const a=i/7*TAU, rr=r.r*(.72+((i*37)%10)/22);
        i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr); }
      ctx.closePath(); inked('#5a4a7a',3);
      circ(-r.r*.2,-r.r*.2,r.r*.22); inked('#463a63',2);
      ctx.restore();
    }
    /* the glorb cameo */
    if(this.cameo){ const c=this.cameo, x=c.x*W, y=c.y*H+Math.sin(c.wob)*10;
      ctx.save(); ctx.translate(x,y);
      blobPath(0,0,c.r,c.wob,.18); inked('#c86bff',4);
      eyes(0,0,c.r,3,Math.PI,.75);
      ctx.restore(); }
    /* patrol craft */
    for(const f of this.foes){
      ctx.save(); ctx.translate(f.x*W,f.y*H); ctx.rotate(-Math.PI/2);
      ctx.beginPath(); ctx.moveTo(0,-24); ctx.lineTo(18,16); ctx.lineTo(0,8); ctx.lineTo(-18,16); ctx.closePath();
      inked('#ff7a4a',4);
      circ(0,-5,7); inked('#8ef0ff',3);
      ctx.beginPath(); ctx.moveTo(-6,10); ctx.lineTo(0,20+Math.random()*8); ctx.lineTo(6,10); ctx.closePath(); inked('#ffd23f',2);
      ctx.restore();
    }
    /* laser bolts */
    for(const b of this.shots){
      ctx.save(); ctx.translate(b.x*W,b.y*H);
      ctx.beginPath(); ctx.roundRect(-14,-3.5,28,7,3.5); inked('#8ef0ff',2);
      ctx.restore();
    }
    /* the Greasy Comet */
    const sh=this.ship, sx=W*.3, sy=sh.y*H, sc=Math.min(2.1,Math.max(1.25,W/620));
    ctx.save(); ctx.translate(sx,sy+Math.sin(this.t*2.4)*4);
    ctx.rotate(Math.PI/2+sh.bank); ctx.scale(sc,sc);
    const fl=16+Math.random()*14;
    ctx.beginPath(); ctx.moveTo(-9,17); ctx.lineTo(0,17+fl); ctx.lineTo(9,17); ctx.closePath(); inked('#ff9a3d',2);
    ctx.beginPath(); ctx.moveTo(-5,17); ctx.lineTo(0,17+fl*.55); ctx.lineTo(5,17); ctx.closePath(); inked('#ffe14d',1.5);
    ctx.beginPath(); ctx.moveTo(0,-20); ctx.quadraticCurveTo(13,2,11,16); ctx.lineTo(-11,16);
    ctx.quadraticCurveTo(-13,2,0,-20); ctx.closePath(); inked('#ffd23f',3);
    ctx.beginPath(); ctx.moveTo(11,8); ctx.lineTo(21,19); ctx.lineTo(10,17); ctx.closePath(); inked('#ff2fa0',2);
    ctx.beginPath(); ctx.moveTo(-11,8); ctx.lineTo(-21,19); ctx.lineTo(-10,17); ctx.closePath(); inked('#ff2fa0',2);
    circ(0,-4,6.5); inked('#8ef0ff',2);
    circ(-2,-6,2); ctx.fillStyle='#fff'; ctx.fill();
    ctx.restore();
    /* exhaust trail */
    if(Math.random()<.6) this.parts.push({x:.3-.02,y:sh.y+.004,vx:-.22,vy:rnd(-.02,.02),
      life:.4,max:.4,c:'#ff9a3d',r:rnd(2,5)});
    for(const q of this.parts){ const k=q.life/q.max;
      ctx.globalAlpha=Math.max(0,k); circ(q.x*W,q.y*H,q.r*k); ctx.fillStyle=q.c; ctx.fill(); }
    ctx.globalAlpha=1;
  }
};

/* =========================================================================
   STAR MAP — open system, clickable planets
   ========================================================================= */
const Starmap={
  stars:[], t:0, ship:{x:.52,y:.44,tx:.52,ty:.44,fly:0}, hover:null, pulse:0,
  init(){ for(let i=0;i<220;i++) this.stars.push({x:Math.random(),y:Math.random(),s:rnd(.4,2.2),tw:rnd(0,TAU)}); },
  enter(){ CG.gameplayStop(); CG.clearContext(); G.scene='starmap'; G.paused=false; MUS.play('map'); UI.mapbar(true); UI.objective(''); UI.bossBar(null);
    $('hud').classList.add('on'); $('btnPause').style.display='none'; UI.hud(); },
  nodes(){ return PLANETS.concat([STATION]); },
  posOf(n){ return {x:n.px*W,y:n.py*H,r:n.rad*Math.min(1.25,Math.max(.62,Math.min(W,H)/720))}; },
  locked(p){ return p.id==='ultradoom' && !PLANETS.slice(0,5).every(q=>G.cleared[q.id]); },
  tap(mx,my){
    if(G.scene!=='starmap'||UI.busy()||UI.modal||UI.talking) return;
    for(const n of this.nodes()){
      const P=this.posOf(n);
      if(Math.hypot(mx-P.x,my-P.y)<P.r+22){
        if(n.id==='station'){ UI.openMarket(); AU.coin(); return; }
        if(this.locked(n)){ toast('LOCKED — CLEAR ALL FIVE BOUNTIES FIRST'); AU.blip(140,.2,'square',.1,-60); return; }
        UI.planetBrief(n); AU.blip(700,.08,'triangle',.09,200); return;
      }
    }
  },
  launch(p){
    if(this.launching) return; this.launching=true;
    G.travelTarget=p; UI.mapbar(false);
    this.ship.tx=p.px; this.ship.ty=p.py; this.ship.fly=1;
    AU.blip(200,.5,'sawtooth',.14,700); MUS.stinger('warp');
    setTimeout(()=>{
      this.launching=false;
      if(G.scene!=='starmap'&&G.scene!=='market') return;   // player moved on while we were in transit
      if(G.cleared[p.id]) Landing.start(p); else startSpace(p);
    },1150);
  },
  update(dt){ this.t+=dt; this.pulse+=dt;
    const s=this.ship;
    if(s.fly>0){ s.x=lerp(s.x,s.tx,dt*3.2); s.y=lerp(s.y,s.ty,dt*3.2); }
  },
  draw(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#160b34'); g.addColorStop(1,'#05030f');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    /* nebula */
    ctx.globalAlpha=.22;
    for(const [cx,cy,cc] of [[.22,.7,'#ff2fa0'],[.75,.25,'#31e6ff'],[.5,.5,'#8dff3a']]){
      const rg=ctx.createRadialGradient(cx*W,cy*H,10,cx*W,cy*H,Math.max(W,H)*.42);
      rg.addColorStop(0,cc); rg.addColorStop(1,'#00000000'); ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
    }
    ctx.globalAlpha=1;
    for(const s of this.stars){ const tw=.4+Math.abs(Math.sin(this.t*1.4+s.tw))*.6;
      ctx.globalAlpha=tw; ctx.fillStyle='#fff'; ctx.fillRect(s.x*W,s.y*H,s.s,s.s); }
    ctx.globalAlpha=1;
    /* sun */
    const sunx=STATION.px*W, suny=STATION.py*H;
    /* orbit rings */
    ctx.strokeStyle='#ffffff18'; ctx.lineWidth=2;
    for(const p of PLANETS){ const P=this.posOf(p);
      ctx.beginPath(); ctx.ellipse(sunx,suny,Math.abs(P.x-sunx)+2,Math.abs(P.y-suny)+2,0,0,TAU); ctx.stroke(); }
    /* station */
    const SP=this.posOf(STATION);
    ctx.save(); ctx.translate(SP.x,SP.y); ctx.rotate(this.t*.4);
    for(let i=0;i<3;i++){ const a=i*TAU/3;
      ctx.beginPath(); ctx.roundRect(Math.cos(a)*SP.r-9,Math.sin(a)*SP.r-9,18,18,5); inked('#31e6ff',3); }
    circ(0,0,SP.r*.7); inked('#ffd23f',4);
    ctx.restore();
    ctx.font='900 12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const stLab='SPROCKET STATION', stW=ctx.measureText(stLab).width;
    ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.strokeText(stLab,SP.x-9,SP.y+SP.r+22);
    ctx.fillStyle='#ffd23f'; ctx.fillText(stLab,SP.x-9,SP.y+SP.r+22);
    drawSym('cart',SP.x+stW/2-1,SP.y+SP.r+22,16);
    /* planets */
    for(const p of PLANETS){
      const P=this.posOf(p), lock=this.locked(p), done=G.cleared[p.id];
      ctx.save(); ctx.translate(P.x,P.y);
      const pulse=1+Math.sin(this.t*2+p.px*9)*.03;
      ctx.scale(pulse,pulse);
      ctx.globalAlpha=lock?.42:1;
      circ(0,0,P.r); inked(p.c1,5);
      ctx.save(); ctx.beginPath(); ctx.arc(0,0,P.r,0,TAU); ctx.clip();
      ctx.beginPath(); ctx.ellipse(-P.r*.3,P.r*.35,P.r*.75,P.r*.35,-.4,0,TAU); ctx.fillStyle=p.c2; ctx.fill();
      ctx.beginPath(); ctx.ellipse(P.r*.45,-P.r*.4,P.r*.5,P.r*.24,.3,0,TAU); ctx.fillStyle=p.c2; ctx.fill();
      ctx.globalAlpha=.22; ctx.beginPath(); ctx.arc(P.r*.5,P.r*.5,P.r,0,TAU); ctx.fillStyle='#000'; ctx.fill();
      ctx.restore();
      if(done) drawSym('check',0,1,P.r*1.15);
      if(lock) drawSym('lock',0,1,P.r*1.05);
      ctx.restore();
      ctx.globalAlpha=1;
      ctx.font='900 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=5; ctx.strokeStyle=INK;
      ctx.strokeText(p.name,P.x,P.y+P.r+20); ctx.fillStyle=done?'#8dff3a':'#fff'; ctx.fillText(p.name,P.x,P.y+P.r+20);
      ctx.font='800 10px sans-serif';
      const sub=lock?'LOCKED':done?'CLEARED':'BOUNTY '+fmt(p.reward);
      const subW=ctx.measureText(sub).width, subX=(lock||done)?P.x:P.x-7;
      ctx.lineWidth=4; ctx.strokeText(sub,subX,P.y+P.r+36); ctx.fillStyle='#c6b8ff'; ctx.fillText(sub,subX,P.y+P.r+36);
      if(!lock&&!done) drawSym('sprocket',subX+subW/2+8,P.y+P.r+36,13);
      if(!lock&&!done){ ctx.globalAlpha=.35+Math.sin(this.t*3+p.py*7)*.25;
        circ(P.x,P.y,P.r+12); ctx.lineWidth=3; ctx.strokeStyle='#ffd23f'; ctx.stroke(); ctx.globalAlpha=1; }
    }
    /* ship */
    const s=this.ship, sxp=s.x*W, syp=s.y*H;
    ctx.save(); ctx.translate(sxp,syp-Math.sin(this.t*2)*4);
    ctx.rotate(Math.atan2(s.ty-s.y,s.tx-s.x)+Math.PI/2);
    ctx.beginPath(); ctx.moveTo(-9,17); ctx.lineTo(0,22+Math.random()*8); ctx.lineTo(9,17); ctx.closePath(); inked('#ff9a3d',2);
    ctx.beginPath(); ctx.moveTo(0,-20); ctx.quadraticCurveTo(13,2,11,16); ctx.lineTo(-11,16); ctx.quadraticCurveTo(-13,2,0,-20); ctx.closePath(); inked('#ffd23f',3);
    circ(0,-4,6); inked('#8ef0ff',2);
    ctx.restore();
    ctx.font='800 10px sans-serif'; ctx.fillStyle='#a99ad8'; ctx.textAlign='center';
    ctx.fillText(IN.touch?'TAP A PLANET TO OPEN THE BOUNTY FILE':'CLICK A PLANET TO OPEN THE BOUNTY FILE',W/2,H-14);
  }
};

/* =========================================================================
   PORTRAITS — every face in the game, drawn once and cached
   ========================================================================= */
const PC={};
function drawBust(kind,x,y,r,t=1){
  if(kind==='rax'){
    ctx.beginPath(); ctx.roundRect(x-r*1.25,y+r*.5,r*2.5,r*1.4,r*.42); inked('#ff7a29',4);
    ctx.beginPath(); ctx.rect(x-r*1.25,y+r*.92,r*2.5,r*.22); inked('#31e6ff',3);
    circ(x,y-r*.05,r*.88); inked('#ffd9b0',4);
    ctx.beginPath(); ctx.arc(x,y-r*.16,r*.88,Math.PI,0); ctx.closePath(); inked('#31e6ff',4);
    ctx.save(); ctx.globalAlpha=.45; circ(x-r*.32,y-r*.46,r*.26); ctx.fillStyle='#fff'; ctx.fill(); ctx.restore();
    circ(x-r*.27,y+r*.14,r*.13); ctx.fillStyle=INK; ctx.fill();
    circ(x+r*.27,y+r*.14,r*.13); ctx.fillStyle=INK; ctx.fill();
    mouthGrin(x,y+r*.16,r*.66);
    ctx.beginPath(); ctx.moveTo(x+r*.66,y-r*.62); ctx.lineTo(x+r*1.0,y-r*1.34);
    ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.stroke();
    circ(x+r*1.03,y-r*1.42,r*.17); inked('#ff2fa0',3);
  } else {
    ctx.save(); ctx.translate(x,y+Math.sin(t*2)*r*.06);
    for(const sd of [-1,1]){ ctx.beginPath(); ctx.moveTo(sd*r*.8,r*.05);
      ctx.lineTo(sd*r*1.45,r*.5); ctx.lineTo(sd*r*.75,r*.66); ctx.closePath(); inked('#ffd23f',3); }
    circ(0,0,r*.92); inked('#cfd6e6',4);
    ctx.beginPath(); ctx.ellipse(0,-r*.02,r*.64,r*.5,0,0,TAU); inked('#31e6ff',3);
    circ(r*.14,-r*.02,r*.23); ctx.fillStyle=INK; ctx.fill();
    circ(r*.05,-r*.13,r*.08); ctx.fillStyle='#fff'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(0,-r*.92); ctx.lineTo(0,-r*1.4); ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.stroke();
    circ(0,-r*1.5,r*.16); inked('#8dff3a',3);
    ctx.restore();
  }
}
function portraitURL(key,px=120){
  const ck=key+'@'+px; if(PC[ck]) return PC[ck];
  const cvs=document.createElement('canvas'); cvs.width=px*2; cvs.height=px*2;
  const g=cvs.getContext('2d'); const old=ctx; ctx=g;
  try{
    g.setTransform(2,0,0,2,0,0);
    const grd=g.createLinearGradient(0,0,0,px); grd.addColorStop(0,'#3d1f7d'); grd.addColorStop(1,'#180c38');
    g.fillStyle=grd; g.fillRect(0,0,px,px);
    g.save(); g.globalAlpha=.13; g.translate(px/2,px*.5);
    for(let i=0;i<12;i++){ g.rotate(TAU/12); g.beginPath(); g.moveTo(0,0);
      g.lineTo(px,-px*.075); g.lineTo(px,px*.075); g.closePath(); g.fillStyle='#fff'; g.fill(); }
    g.restore();
    if(key==='rax'||key==='gary') drawBust(key,px/2,px*.54,px*.26);
    else{
      const bits=key.split(':'), kind=bits[0], id=bits[1];
      let def;
      if(kind==='boss'){ const b=planetById(id).boss; def={name:b.name,c1:b.c1,c2:b.c2,shape:b.shape,eyes:2}; }
      else def=EDEF[id];
      if(def){ drawEnemy({def,x:px/2,y:px*.56,r:px*.25,t:1.3,face:1.9,flash:0,hp:1,max:1,
        boss:true,hop:0,pulse:0,spin2:.6,ai:'chase'}); }
    }
  } catch(err){} finally { ctx=old; }
  PC[ck]=cvs.toDataURL(); return PC[ck];
}

/* =========================================================================
   LANDING — the bit where you actually put the ship on the ground
   ========================================================================= */
const Landing={
  t:0, planet:null, dur:3.6, done:false,
  start(p){ CG.gameplayStop(); this.t=0; this.planet=p; this.done=false; G.scene='landing';
    $('hud').classList.remove('on'); UI.mapbar(false); MUS.stinger('warp'); AU.blip(140,.7,'sawtooth',.1,420); },
  finish(){
    if(this.done||G.scene!=='landing') return; this.done=true;
    const p=this.planet; startArena(p); $('hud').classList.add('on');
    UI.say('SHIP AI "GARY"','Touchdown on '+p.name+'. Local threat: '+p.brief+' Try not to get splorted, Rax.','gary');
    UI.say(p.boss.name,RADIO[p.id],'boss:'+p.id);
  },
  update(dt){
    this.t+=dt;
    for(let i=A.parts.length-1;i>=0;i--){ const q=A.parts[i];
      q.life-=dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=1-2.4*dt; q.vy*=1-2.4*dt;
      if(q.life<=0) A.parts.splice(i,1); }
    if(this.t>=this.dur) this.finish();
  },
  draw(){
    const p=this.planet, k=Math.min(1,this.t/this.dur), e=1-Math.pow(1-k,2.4);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#06040f'); g.addColorStop(.55,p.sky); g.addColorStop(1,p.c2);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=Math.max(0,1-e*1.6); ctx.fillStyle='#fff';
    for(const st of Starmap.stars) ctx.fillRect(st.x*W,st.y*H*.7,st.s,st.s);
    ctx.globalAlpha=1;
    /* the planet rising to meet you */
    const hy=lerp(H*2.4,H*.68,e), rr=Math.max(W,H)*2.1;
    ctx.beginPath(); ctx.arc(W/2,hy+rr,rr,0,TAU); ctx.fillStyle=p.ground; ctx.fill();
    ctx.lineWidth=8; ctx.strokeStyle=INK; ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.arc(W/2,hy+rr,rr,0,TAU); ctx.clip();
    for(let i=0;i<26;i++){
      const dx=((i*173)%W), dy=hy+((i*97)%140)+24, sc=.5+((i*37)%60)/60*1.4;
      ctx.save(); ctx.translate(dx,dy); ctx.scale(sc*(.5+e),sc*(.5+e));
      ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(14,14); ctx.lineTo(-14,14); ctx.closePath();
      inked(i%2?p.c1:p.c2,3); ctx.restore();
    }
    ctx.restore();
    /* the ship coming down */
    const sy=lerp(H*.14,hy-34,e), sc=lerp(1.5,2.6,e), tilt=Math.sin(this.t*3)*(1-e)*.16;
    ctx.save(); ctx.translate(W/2,sy); ctx.rotate(tilt); ctx.scale(sc,sc);
    const fl=(k>.92?rnd(6,14):rnd(14,30))*(1-k*.3);
    ctx.beginPath(); ctx.moveTo(-9,17); ctx.lineTo(0,17+fl); ctx.lineTo(9,17); ctx.closePath(); inked('#ff9a3d',2);
    ctx.beginPath(); ctx.moveTo(0,-20); ctx.quadraticCurveTo(13,2,11,16); ctx.lineTo(-11,16);
    ctx.quadraticCurveTo(-13,2,0,-20); ctx.closePath(); inked('#ffd23f',3);
    ctx.beginPath(); ctx.moveTo(11,8); ctx.lineTo(20,18); ctx.lineTo(10,17); ctx.closePath(); inked('#ff2fa0',2);
    ctx.beginPath(); ctx.moveTo(-11,8); ctx.lineTo(-20,18); ctx.lineTo(-10,17); ctx.closePath(); inked('#ff2fa0',2);
    circ(0,-4,6); inked('#8ef0ff',2);
    ctx.restore();
    /* dust on the way down */
    if(k>.55&&A.parts.length<160&&Math.random()<.7){
      A.parts.push({x:W/2+rnd(-70,70),y:hy+rnd(-6,20),vx:rnd(-150,150),vy:rnd(-70,10),
        life:.6,max:.6,c:p.c1,r:rnd(4,11)});
    }
    for(const q of A.parts){ const k2=Math.max(0,q.life/q.max);
      ctx.globalAlpha=k2; circ(q.x,q.y,q.r*k2); ctx.fillStyle=q.c; ctx.fill(); }
    ctx.globalAlpha=1;
    /* captions */
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const cap=k<.82?'DESCENDING TO '+p.name:'TOUCHDOWN';
    ctx.font='900 '+Math.round(Math.min(46,W*.075))+'px Impact,"Arial Black",sans-serif';
    ctx.lineWidth=8; ctx.strokeStyle=INK; ctx.strokeText(cap,W/2,H*.16);
    ctx.fillStyle=k<.82?'#ffd23f':'#8dff3a'; ctx.fillText(cap,W/2,H*.16);
    ctx.font='800 11px sans-serif'; ctx.lineWidth=4;
    ctx.strokeText('TAP TO SKIP',W/2,H*.16+34); ctx.fillStyle='#c6b8ff'; ctx.fillText('TAP TO SKIP',W/2,H*.16+34);
  }
};

      if(UPGL[id]>=UPG[id].max) return;             // and no over-ranking an upgrade

      G.sprockets-=c; G.stats.spent+=c; checkAchv(); UPGL[id]++; UPG[id].apply(); AU.coin(); toast(UPG[id].name+' → LV'+UPGL[id]);

      const cost=Math.round(160+(G.maxhp-G.hp)*2); if(G.sprockets<cost) return this.poor();
      G.sprockets-=cost; G.hp=G.maxhp; AU.coin(); toast('PATCHED UP');

      G.sprockets-=cost; s.ammo=w.ammoMax; AU.coin(); toast(w.name+' RELOADED');

/* =========================================================================
   PLATFORM LAYER — save/load, iOS audio recovery, CrazyGames SDK.
   Every piece degrades silently: the game runs identically with no SDK,
   no network and no storage (e.g. inside a sandboxed preview or on itch).
   ========================================================================= */

/* SUBMISSION FORM: select "Yes, using the Data Module from the CrazyGames SDK".
   The module stays disabled unless that option is chosen.

   Why the Data module and not plain localStorage: CrazyGames serves uploaded
   bundles inside an iframe, and their Automatic Progress Save does not run for
   iframe games. The Data module is the only route to a real cloud save here.
   It exposes the same API as localStorage, stores guest data locally, and folds
   that data into the account the moment the player signs in.

   localStorage remains the fallback for builds running anywhere else (itch,
   your own host, a plain file), where no SDK exists. On CrazyGames the SDK is
   always present, so the Data module is the only store in play. */
const CG_USE_DATA_MODULE=true;

const SAVE={
  KEY:'cosmicwhomp.save.v1', store:null, ok:false, dirty:false, t:0,
  resolved:false, usingSDK:false,
  /* Called once the SDK has either attached its Data module or failed to appear.
     The title screen may already be up, so refresh it if CONTINUE became valid. */
  resolve(){
    if(this.resolved) return; this.resolved=true;
    if(G.scene==='title'&&UI.titleHadSave!==this.has()) UI.title();
  },
  /* One-time hand-off so a player who already has a local save keeps it. */
  migrate(mod){
    try{
      const remote=mod.getItem(this.KEY); if(remote) return;
      const local=window.localStorage&&window.localStorage.getItem(this.KEY);
      if(local) mod.setItem(this.KEY,local);
    }catch(e){}
  },
  init(){
    try{ const ls=window.localStorage; ls.setItem('__cw','1'); ls.removeItem('__cw');
      this.store=ls; this.ok=true; }
    catch(e){ this.store=null; this.ok=false; }   // sandboxed preview: play on, just don't persist
  },
  attach(mod){
    if(!mod||typeof mod.getItem!=='function'||typeof mod.setItem!=='function') return false;
    this.migrate(mod); this.store=mod; this.ok=true; this.usingSDK=true; return true;
  },
  has(){ try{ return !!(this.store&&this.store.getItem(this.KEY)); }catch(e){ return false; } },
  mark(){ this.dirty=true; },                     // debounced: a burst of buys is one write
  tick(dt){ if(!this.dirty||!this.ok) return; this.t+=dt;
    if(this.t>=1.2){ this.t=0; this.dirty=false; this.write(); } },
  snapshot(){
    const ws={};
    for(const id in WSTATE){ const w=WSTATE[id];
      ws[id]={a:w.ammo===Infinity?-1:Math.round(w.ammo),x:Math.round(w.xp),l:w.lvl}; }
    return {v:1,diff:G.diff,spr:Math.round(G.sprockets),maxhp:G.maxhp,armor:G.armor,magnet:G.magnet,
      ship:{maxhp:G.ship.maxhp,dmg:G.ship.dmg,rate:G.ship.rate,speed:G.ship.speed,wing:G.ship.wing},
      weapons:G.weapons.slice(),cleared:G.cleared,bounty:Math.round(G.bountyTotal),
      sp:G.sp,perk:G.perk,achv:G.achv,stats:G.stats,upgl:UPGL,ws,tips:SEEN,
      unlocked:!!planetById('ultradoom').unlockedShown};
  },
  write(){ if(!this.ok) return false;
    try{ this.store.setItem(this.KEY,JSON.stringify(this.snapshot())); return true; }catch(e){ return false; } },
  load(){
    if(!this.ok) return false;
    let d; try{ const raw=this.store.getItem(this.KEY); if(!raw) return false; d=JSON.parse(raw); }catch(e){ return false; }
    return this.apply(d);
  },
  apply(d){
    if(!d||d.v!==1) return false;
    const N=(x,def)=>(typeof x==='number'&&isFinite(x))?x:def;
    G.diff=DIFFS[d.diff]?d.diff:'hunter';
    G.sprockets=Math.max(0,Math.round(N(d.spr,0)));
    G.maxhp=clamp(N(d.maxhp,100),50,2000); G.hp=G.maxhp;
    G.armor=clamp(N(d.armor,0),0,.6); G.magnet=clamp(N(d.magnet,1),1,6);
    if(d.ship){ G.ship.maxhp=clamp(N(d.ship.maxhp,100),50,4000); G.ship.hp=G.ship.maxhp;
      G.ship.dmg=clamp(N(d.ship.dmg,12),1,400); G.ship.rate=clamp(N(d.ship.rate,.16),.03,2);
      G.ship.speed=clamp(N(d.ship.speed,250),80,1200); G.ship.wing=clamp(Math.round(N(d.ship.wing,0)),0,2); }
    G.weapons=(Array.isArray(d.weapons)?d.weapons:[]).filter(id=>WDEF[id]);
    G.wsel=0;
    G.cleared={}; if(d.cleared) for(const p of PLANETS) if(d.cleared[p.id]) G.cleared[p.id]=true;
    G.bountyTotal=Math.max(0,N(d.bounty,0));
    G.sp=clamp(Math.round(N(d.sp,0)),0,99);
    G.perk={}; if(d.perk) for(const k in PERKS) G.perk[k]=clamp(Math.round(N(d.perk[k],0)),0,PERKS[k].max);
    G.achv={}; if(d.achv) for(const a of ACHV) if(d.achv[a.id]) G.achv[a.id]=true;
    if(d.stats) for(const k in G.stats) G.stats[k]=Math.max(0,N(d.stats[k],0));
    if(d.upgl) for(const k in UPG) UPGL[k]=clamp(Math.round(N(d.upgl[k],0)),0,UPG[k].max);
    if(d.ws) for(const id in d.ws){
      if(!WDEF[id]) continue; const w=d.ws[id]||{}, st=wstate(id);
      st.lvl=clamp(Math.round(N(w.l,1)),1,5); st.xp=Math.max(0,N(w.x,0));
      st.ammo=WDEF[id].ammoMax===Infinity?Infinity:clamp(Math.round(N(w.a,0)),0,WDEF[id].ammoMax);
    }
    if(d.tips) for(const k in d.tips) SEEN[k]=1;
    G.intro=true;
    planetById('ultradoom').unlockedShown=!!d.unlocked;
    validateLoadout();
    return true;
  },
  wipe(){ try{ this.store&&this.store.removeItem(this.KEY); }catch(e){} }
};

/* ---- iOS parks the AudioContext when the app is backgrounded or a call lands.
   Reviving it needs a real user gesture, so we listen for every plausible one. ---- */
function audioRevive(){
  const c=AU.ctx; if(!c) return;
  if(c.state==='suspended'||c.state==='interrupted'){
    try{ const p=c.resume(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
  }
}
['touchend','pointerup','mouseup','click','keydown'].forEach(ev=>
  addEventListener(ev,audioRevive,{passive:true}));
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) audioRevive(); });

/* ---- CrazyGames SDK: optional, never load-bearing ---- */
const CG={
  sdk:null, ready:false, playing:false,
  async init(){
    setTimeout(()=>SAVE.resolve(),3000);   // blocked or missing SDK: stop waiting
    try{
      if(!window.CrazyGames||!window.CrazyGames.SDK){ SAVE.resolve(); return; }
      this.sdk=window.CrazyGames.SDK;
      await this.sdk.init();
      this.ready=true;
      if(CG_USE_DATA_MODULE&&this.sdk.data) SAVE.attach(this.sdk.data);
      SAVE.resolve();
      this.applySettings(this.sdk.game&&this.sdk.game.settings);
      if(this.sdk.game&&this.sdk.game.addSettingsChangeListener)
        this.sdk.game.addSettingsChangeListener(s=>this.applySettings(s));
      if(G.scene==='arena'||G.scene==='space') this.gameplayStart();   // SDK arrived mid-play
      this.progress();
    }catch(e){ SAVE.resolve(); }
  },
  /* the platform mute always wins over the in-game music button */
  applySettings(s){ if(!s) return; AU.muted=!!s.muteAudio; MUS.applyMute(); },
  gameplayStart(){ if(this.ready&&!this.playing){ this.playing=true;
    try{ this.sdk.game.gameplayStart(); }catch(e){} } },
  gameplayStop(){ if(this.ready&&this.playing){ this.playing=false;
    try{ this.sdk.game.gameplayStop(); }catch(e){} } },
  happy(){ if(this.ready) try{ this.sdk.game.happytime(); }catch(e){} },
  progress(){ if(!this.ready) return;
    try{ const done=PLANETS.filter(p=>G.cleared[p.id]).length;
      this.sdk.game.reportGameCompletedPercentage(Math.round(done/PLANETS.length*100)); }catch(e){} },
  context(o){ if(this.ready) try{ this.sdk.game.setGameContext(o); }catch(e){} },
  clearContext(){ if(this.ready) try{ this.sdk.game.clearGameContext(); }catch(e){} }
};

/* =========================================================================
   MAIN LOOP
   ========================================================================= */
SAVE.init(); CG.init();
let last=performance.now();
function frame(t){
  const dt=Math.min(.048,(t-last)/1000); last=t;
  SAVE.tick(dt);
  if(G.scene==='landing'){ if(!UI.talking) Landing.update(dt); Landing.draw(); }
  else if(G.scene==='starmap'){ Starmap.update(dt); Starmap.draw(); }
  else if(G.scene==='arena'||G.scene==='space'){
    if(G.paused&&!$('layerPause').classList.contains('on')){ G.paused=false; UI.modal=null; MUS.duck(1); }
    $('pausedTag').classList.toggle('on',G.paused);
    if(!G.paused&&(!UI.talking||A.done)) updateArena(dt);
    drawArena(); UI.bars(); UI.dock();
    $('btnPause').style.display='block';
  }
  else if(G.scene==='market'){ Starmap.update(dt); Starmap.draw(); }
  else { Attract.update(dt); Attract.draw(); }
  requestAnimationFrame(frame);
}
$('coinIcon').innerHTML=svgSym('sprocket',18);
$('btnPause').innerHTML=svgSym('pause',16);
musIcon();
$('btnMarket').querySelector('.mi').innerHTML=svgSym('cart',17);
$('btnCodex').querySelector('.mi').innerHTML=svgSym('book',17);
UI.title();
requestAnimationFrame(frame);
</script>
