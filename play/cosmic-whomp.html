<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>COSMIC WHOMP — Galactic Bounty Hunter</title>
<!-- Offline build: no external scripts. -->
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0620;touch-action:none;overscroll-behavior:none;
  font-family:"Trebuchet MS","Lucida Grande",Verdana,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}

/* ---------- shared cartoon chrome ---------- */
:root{
  --ink:#100a2c; --void:#170c33; --grape:#2a1660;
  --slime:#8dff3a; --magenta:#ff2fa0; --cyan:#31e6ff; --sun:#ffd23f; --tang:#ff7a29;
}
.sticker{border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink),0 10px 22px #0009}
.btn{font:800 15px/1 "Trebuchet MS",sans-serif;letter-spacing:.06em;text-transform:uppercase;
  padding:12px 18px;border:4px solid var(--ink);border-radius:14px;background:var(--sun);color:var(--ink);
  box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--magenta);color:#fff}
.btn.lime{background:var(--slime)}
.btn.cy{background:var(--cyan)}
.btn.off{background:#6b6a86;color:#2a2840;box-shadow:0 5px 0 #3a3950}
.btn:focus-visible{outline:4px solid #fff;outline-offset:3px}

body{--stickB:74px;--stickS:132px;--knobS:58px;--dockB:2px;--dockH:91px;--btnB:216px;--btnS:60px;--talkB:96px}
body.touch{--dockH:64px;--talkB:214px}
#wrap{position:absolute;inset:0}
#ui{position:absolute;inset:0;pointer-events:none;z-index:5}
.layer{position:absolute;inset:0;display:none;pointer-events:auto;z-index:20}
.layer.on{display:flex}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;display:none;pointer-events:none;z-index:6}
#hud.on{display:block}
.hudTop{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.hpWrap{background:var(--void);border:4px solid var(--ink);border-radius:14px;padding:6px 8px;min-width:170px;box-shadow:0 5px 0 var(--ink)}
.hpLab{font:800 10px/1 sans-serif;letter-spacing:.16em;color:#b39bff;margin-bottom:4px}
.hpBar{height:16px;background:#3a1e5e;border-radius:8px;overflow:hidden;border:2px solid #0006}
.hpFill{height:100%;width:100%;background:linear-gradient(#7dff6a,#25b73f);transition:width .18s}
.hpFill.hurt{background:linear-gradient(#ff7a7a,#c02020)}
.shieldBar{height:9px;margin-top:4px;background:#12324d;border-radius:6px;overflow:hidden;border:2px solid #0006;display:none}
.shieldFill{height:100%;background:linear-gradient(#8ef0ff,#1f9fd0)}
.coin{display:flex;align-items:center;gap:6px;background:var(--sun);color:var(--ink);border:4px solid var(--ink);
  border-radius:14px;padding:7px 12px;font:900 18px/1 sans-serif;box-shadow:0 5px 0 var(--ink)}
.coin small{font:800 9px/1 sans-serif;letter-spacing:.14em;opacity:.75;display:block}
.objective{position:absolute;top:calc(66px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:#0009;border:3px solid var(--ink);border-radius:12px;padding:6px 14px;font:800 12px/1.2 sans-serif;
  letter-spacing:.08em;text-align:center;white-space:nowrap;color:#ffe9a8}
.bossbar{position:absolute;top:calc(96px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(560px,86vw);display:none}
.bossbar.on{display:block}
.bossName{font:900 14px/1 sans-serif;letter-spacing:.1em;text-align:center;margin-bottom:5px;color:#ff9be0;text-shadow:2px 2px 0 var(--ink)}
.bossTrack{height:20px;background:#2b0f3d;border:4px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.bossFill{height:100%;width:100%;background:linear-gradient(#ff5ec4,#8b1acc);transition:width .12s}

/* weapon dock */
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--dockB) + env(safe-area-inset-bottom));
  display:flex;gap:6px;pointer-events:auto;max-width:96vw;overflow-x:auto;padding:4px;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.wchip{flex:0 0 auto;width:66px;background:var(--grape);border:3px solid var(--ink);border-radius:12px;padding:5px 4px;
  text-align:center;box-shadow:0 4px 0 var(--ink);opacity:.62;cursor:pointer}
.wchip.sel{opacity:1;background:var(--magenta);transform:translateY(-4px)}
.wchip .ic{height:22px;display:flex;align-items:center;justify-content:center}
.wchip .nm{font:800 7.5px/1.1 sans-serif;letter-spacing:.03em;margin-top:3px;height:16px;overflow:hidden}
.wchip .am{font:900 10px/1 sans-serif;color:var(--sun);margin-top:2px}
.wchip .lv{font:900 8px/1 sans-serif;color:#9dffb0}
.xpline{height:3px;background:#0006;border-radius:2px;margin-top:3px;overflow:hidden}
.xpline i{display:block;height:100%;background:var(--cyan)}

/* ---------- touch controls ---------- */
#touch{position:absolute;inset:0;display:none;z-index:7}
#touch.on{display:block}
.stick{position:absolute;bottom:calc(var(--stickB) + env(safe-area-inset-bottom));
  width:var(--stickS);height:var(--stickS);border-radius:50%;
  border:4px dashed #ffffff40;pointer-events:auto}
#stickL{left:calc(14px + env(safe-area-inset-left))}
#stickR{right:calc(14px + env(safe-area-inset-right))}
.knob{position:absolute;left:50%;top:50%;width:var(--knobS);height:var(--knobS);
  margin:calc(var(--knobS) / -2) 0 0 calc(var(--knobS) / -2);border-radius:50%;
  background:#ffffff30;border:4px solid #ffffff70}
.stickLab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:900 9px/1.3 sans-serif;
  letter-spacing:.1em;color:#ffffff55;text-align:center;pointer-events:none}
.tbtn{position:absolute;pointer-events:auto;width:var(--btnS);height:var(--btnS);border-radius:50%;background:#ffffff22;
  border:4px solid #ffffff66;display:grid;place-items:center;font:900 10px/1 sans-serif;letter-spacing:.05em}
#btnSwap{right:calc(18px + env(safe-area-inset-right));bottom:calc(var(--btnB) + env(safe-area-inset-bottom))}
#btnBoost{left:calc(18px + env(safe-area-inset-left));bottom:calc(var(--btnB) + env(safe-area-inset-bottom))}

/* ---------- panels ---------- */
.layer{align-items:center;justify-content:center;padding:16px}
.scrim{position:absolute;inset:0;background:radial-gradient(120% 120% at 50% 0%,#3a1370cc,#080418f2)}
.panel{position:relative;background:var(--void);border:5px solid var(--ink);border-radius:22px;
  box-shadow:0 10px 0 var(--ink),0 20px 50px #000b;max-width:920px;width:100%;max-height:92vh;overflow:auto;padding:20px}
h1.big{font:900 clamp(30px,8vw,62px)/0.92 Impact,"Arial Black",sans-serif;letter-spacing:.02em;text-transform:uppercase;
  color:var(--sun);text-shadow:5px 5px 0 var(--magenta),9px 9px 0 var(--ink);text-align:center}
h2.sub{font:900 clamp(13px,3.4vw,19px)/1.25 sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);text-align:center;margin-top:10px}
p.blurb{font:600 14px/1.5 sans-serif;color:#d8cfff;text-align:center;margin:14px auto;max-width:620px}
.rowc{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* market */
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px}
.card{background:var(--grape);border:4px solid var(--ink);border-radius:16px;padding:12px;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;gap:7px}
.card .ct{font:900 13px/1.15 sans-serif;letter-spacing:.03em;color:#fff;display:flex;gap:7px;align-items:center}
.card .ct em{font-style:normal;display:inline-flex;align-items:center;flex:0 0 auto}
.sym{display:block}
.card .cd .sym,.card .stat .sym,.btn .sym{display:inline-block;vertical-align:-3px;margin:0 1px}
.mtitle .sym{display:inline-block;vertical-align:-5px;margin-right:4px}
.coin .sym{display:block;flex:0 0 auto}
.card .cd{font:600 11.5px/1.4 sans-serif;color:#c9b9ff;flex:1}
.card .stat{font:800 10px/1.3 sans-serif;color:#9dffb0;letter-spacing:.05em}
.card .buy{margin-top:2px}
.owned{font:900 11px/1 sans-serif;color:var(--slime);letter-spacing:.1em;padding:10px;text-align:center}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.mtitle{font:900 22px/1 Impact,"Arial Black",sans-serif;letter-spacing:.06em;color:var(--slime);text-shadow:3px 3px 0 var(--ink)}

/* dialogue */
#talk{position:absolute;left:50%;bottom:calc(var(--talkB) + env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(680px,94vw);background:#160b30ee;border:5px solid var(--ink);border-radius:18px;padding:14px 16px;
  box-shadow:0 8px 0 var(--ink);display:none;z-index:25;pointer-events:auto}
#talk.on{display:block}
.por{border:4px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);background:#2a1660;flex:0 0 auto;image-rendering:auto}
#talk .trow{display:flex;gap:14px;align-items:flex-start}
#talk #talkPic{display:none}
#talk.face #talkPic{display:block}
.cast{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.castone{text-align:center;width:clamp(78px,19vw,104px)}
.castone img{width:100%;height:auto}
.castone.hero{width:clamp(88px,22vw,116px)}
.castlab{font:900 10px/1 sans-serif;letter-spacing:.18em;color:#a99ad8;text-align:center;margin-top:16px}
#layerTitle .scrim{background:linear-gradient(180deg,#0a0620d9,#0a062066 38%,#0a0620d9)}
#layerTitle .panel{background:rgba(23,12,51,.88);max-width:840px}
.castone .nm{font:900 10px/1.3 sans-serif;letter-spacing:.06em;color:#ffd23f;margin-top:6px}
.castone .rl{font:700 9px/1.3 sans-serif;color:#a99ad8}
.crew{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.crew .cw{text-align:center;width:56px}
.crew .cw img{border:3px solid var(--ink);border-radius:10px;background:#2a1660}
.crew .cw span{display:block;font:800 7px/1.2 sans-serif;color:#c9b9ff;margin-top:3px}
.pkrow{display:flex;align-items:center;gap:10px}
.pips{display:flex;gap:4px}
.pips i{width:11px;height:11px;border-radius:3px;border:2px solid var(--ink);background:#1b0f3d;display:block}
.pips i.on{background:var(--slime)}
.spBadge{background:var(--slime);color:var(--ink);border:3px solid var(--ink);border-radius:10px;
  padding:3px 8px;font:900 11px/1 sans-serif;box-shadow:0 3px 0 var(--ink)}
#talk .who{font:900 13px/1 sans-serif;letter-spacing:.12em;color:var(--sun);margin-bottom:7px}
#talk .txt{font:600 14px/1.45 sans-serif;color:#efe8ff;min-height:44px}
#talk .hint{font:800 10px/1 sans-serif;letter-spacing:.1em;color:#a08fd8;margin-top:9px;text-align:right}

/* toasts + comic banner */
#pausedTag{position:absolute;top:calc(112px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:26;display:none;pointer-events:none;background:var(--sun);color:var(--ink);
  border:4px solid var(--ink);border-radius:12px;padding:7px 16px;box-shadow:0 5px 0 var(--ink);
  font:900 14px/1 sans-serif;letter-spacing:.18em;animation:blinkTag 1.4s infinite}
#pausedTag.on{display:block}
@keyframes blinkTag{0%,60%{opacity:1}80%,100%{opacity:.45}}
#toast{position:absolute;top:calc(140px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:22;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:var(--slime);color:var(--ink);border:4px solid var(--ink);border-radius:12px;padding:8px 14px;
  font:900 13px/1 sans-serif;letter-spacing:.06em;box-shadow:0 5px 0 var(--ink);animation:pop .3s backwards}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}}
#banner{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);z-index:23;pointer-events:none;
  font:900 clamp(30px,10vw,84px)/1 Impact,"Arial Black",sans-serif;letter-spacing:.02em;text-transform:uppercase;
  color:var(--sun);text-shadow:5px 5px 0 var(--magenta),10px 10px 0 var(--ink);opacity:0;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---- touch + small screens: keep the edges uncluttered ----
   Bands measured from the bottom of the viewport:
     dock  = [dockB, dockB+dockH]   sticks = [stickB, stickB+stickS]
     swap/dash = [btnB, btnB+btnS]  talk  = [talkB, ...]
   The dock must clear the sticks, and the buttons must clear the sticks.
   The talk box may overlap the controls because the controls fade out while
   anyone is speaking (see body.talking below). */
body.touch .wchip{width:54px;padding:5px 3px}
body.touch .wchip .nm,body.touch .wchip .lv{display:none}
body.talking #touch{opacity:.12;pointer-events:none}
#touch{transition:opacity .18s}
@media (max-width:560px){
  body{--stickB:70px;--stickS:112px;--knobS:48px;--btnB:190px;--btnS:52px}
  body.touch{--talkB:188px}
  .hpWrap{min-width:124px;padding:5px 7px}
  .hpBar{height:13px}
  .coin{padding:5px 9px;font-size:15px}
  .coin small{font-size:8px}
  .objective{font-size:10px;max-width:92vw;white-space:normal}
  .corner{top:calc(66px + env(safe-area-inset-top))}
  .mini{padding:7px 9px;font-size:10px}
  #talk{padding:11px 12px;width:96vw}
  #talk .txt{font-size:12.5px;min-height:34px}
  #talk #talkPic{width:58px;height:58px}
  .tbtn{font-size:9px}
  #pausedTag{font-size:12px;padding:6px 12px;top:calc(100px + env(safe-area-inset-top))}
  .panel{padding:14px;border-radius:18px}
  .grid{grid-template-columns:1fr}
}
@media (max-height:560px){
  .castone{width:clamp(58px,12vw,74px)}
  .castone.hero{width:clamp(64px,14vw,84px)}
  .castone .rl{display:none}
  h1.big{font-size:clamp(24px,6vw,42px)}
  p.blurb{font-size:12.5px;margin:8px auto}
  .cast{gap:8px;margin:8px 0}
}
@media (max-height:460px){
  body{--stickB:70px;--stickS:92px;--knobS:40px;--btnB:172px;--btnS:48px}
  body.touch{--talkB:170px}
  .stickLab{display:none}
  #talk .txt{min-height:24px}
  #talk #talkPic{width:52px;height:52px}
  .objective{top:calc(58px + env(safe-area-inset-top))}
  .bossbar{top:calc(80px + env(safe-area-inset-top))}
  .corner{top:calc(60px + env(safe-area-inset-top))}
  #pausedTag{top:calc(58px + env(safe-area-inset-top))}
  .panel{max-height:96vh}
}
.corner{position:absolute;top:calc(74px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:8;pointer-events:auto;display:none;max-width:96vw;flex-wrap:wrap;justify-content:center}
.corner.on{display:flex;gap:8px}
.mini{display:inline-flex;align-items:center;gap:6px;font:900 11px/1 sans-serif;letter-spacing:.08em;padding:9px 13px;border:3px solid var(--ink);border-radius:12px;background:var(--cyan);color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer}
.legend{font:700 11px/1.5 sans-serif;color:#a99ad8;text-align:center;margin-top:12px}
.kbd{display:inline-block;background:#3a2470;border:2px solid var(--ink);border-radius:6px;padding:1px 6px;font:800 10px/1.4 sans-serif;color:#fff}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="hudTop">
      <div class="hpWrap">
        <div class="hpLab" id="hpLab">RAX-O-METER</div>
        <div class="hpBar"><div class="hpFill" id="hpFill"></div></div>
        <div class="shieldBar" id="shBar"><div class="shieldFill" id="shFill"></div></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;pointer-events:auto">
        <button class="mini" id="btnMus" style="padding:9px 10px" title="Music"></button>
        <button class="mini" id="btnPause" style="display:none;padding:9px 10px"></button>
        <div class="coin"><span id="coinIcon"></span><span><small>SPROCKETS</small><span id="coins">0</span></span></div>
      </div>
    </div>
    <div class="objective" id="obj">—</div>
    <div class="bossbar" id="bossbar"><div class="bossName" id="bossName">BOSS</div><div class="bossTrack"><div class="bossFill" id="bossFill"></div></div></div>
    <div id="dock"></div>
  </div>

  <div class="corner" id="mapbar">
    <button class="mini" id="btnMarket"><span class="mi"></span>MARKET</button>
    <button class="mini" id="btnCodex"><span class="mi"></span>BOUNTIES</button>
    <button class="mini" id="btnSkills" style="background:var(--slime)"><span class="mi"></span>SKILLS <span id="spDot"></span></button>
  </div>

  <div id="touch">
    <div class="stick" id="stickL"><div class="knob" id="knobL"></div><div class="stickLab">MOVE</div></div>
    <div class="stick" id="stickR"><div class="knob" id="knobR"></div><div class="stickLab">AIM<br>+ FIRE</div></div>
    <div class="tbtn" id="btnSwap">SWAP</div>
    <div class="tbtn" id="btnBoost">DASH</div>
  </div>

  <div id="pausedTag">PAUSED</div>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="talk"><div class="trow"><img id="talkPic" class="por" width="86" height="86" alt="">
    <div style="flex:1"><div class="who" id="talkWho"></div><div class="txt" id="talkTxt"></div></div></div>
    <div class="trow" style="justify-content:space-between;align-items:center;margin-top:8px">
      <button class="mini" id="talkSkip" style="background:var(--grape);color:#fff;display:none">SKIP ▸▸</button>
      <div class="hint" style="flex:1">TAP / PRESS SPACE TO CONTINUE</div>
    </div></div>

  <div id="ui">
    <div class="layer" id="layerTitle"></div>
    <div class="layer" id="layerMarket"></div>
    <div class="layer" id="layerMsg"></div>
    <div class="layer" id="layerPause"></div>
  </div>
</div>
<script>
"use strict";
/* =========================================================================
   COSMIC WHOMP — core: canvas, math, input, audio
   ========================================================================= */
const cv=document.getElementById('cv'); let ctx=cv.getContext('2d');
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r||0,Math.abs(w)/2,Math.abs(h)/2);
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this; };
}
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();

const TAU=Math.PI*2, rnd=(a,b)=>a+Math.random()*(b-a), rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp=(a,b,t)=>a+(b-a)*t;
const angTo=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
const fmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':''+Math.floor(n);
const $=id=>document.getElementById(id);

/* ---------------- audio: tiny cartoon synth ---------------- */
const AU={ctx:null,on:true,muted:false,
  init(){ if(this.ctx) return;
    try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.on=false; return; }
    if(this.ctx.state==='suspended') this.ctx.resume();
    if(typeof MUS!=='undefined') MUS.boot(); },
  blip(f=440,d=.08,type='square',v=.14,slide=0){
    if(!this.on||this.muted||!this.ctx) return;
    const c=this.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0008,t+d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.02);
  },
  noise(d=.18,v=.16,hp=600){
    if(!this.on||this.muted||!this.ctx) return;
    const c=this.ctx,n=Math.floor(c.sampleRate*d),buf=c.createBuffer(1,n,c.sampleRate),ch=buf.getChannelData(0);

/* touch sticks */
function stick(el,knob,onMove,onEnd){
  let id=null, cx=0, cy=0, R=58;
  const start=e=>{ AU.init(); const t=e.changedTouches[0]; id=t.identifier;
    const r=el.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2; R=r.width/2;
    move(e); e.preventDefault(); };
  const move=e=>{ if(id===null) return;
    for(const t of e.changedTouches){ if(t.identifier!==id) continue;
      let dx=t.clientX-cx, dy=t.clientY-cy; const d=Math.hypot(dx,dy)||1;
      const k=Math.min(1,d/R); dx=dx/d*k; dy=dy/d*k;
      knob.style.transform=`translate(${dx*R*.62}px,${dy*R*.62}px)`;
      onMove(dx,dy,k);
    } e.preventDefault(); };
  const end=e=>{ for(const t of e.changedTouches){ if(t.identifier!==id) continue;
      id=null; knob.style.transform=''; onEnd(); } };
  el.addEventListener('touchstart',start,{passive:false});
  el.addEventListener('touchmove',move,{passive:false});
  el.addEventListener('touchend',end); el.addEventListener('touchcancel',end);
}

const _P2D={};
function svgSym(id,size=18,cls=''){
  const sh=SYM[id]; if(!sh) return '';
  return '<svg class="sym '+cls+'" viewBox="0 0 24 24" width="'+size+'" height="'+size+'" aria-hidden="true">'+
    sh.map(q=>'<path d="'+q.d+'" fill="'+(q.f||'none')+'" stroke="'+(q.s||'#100a2c')+'" stroke-width="'+(q.w||2)+
      '" stroke-linejoin="round" stroke-linecap="round"/>').join('')+'</svg>';
}
function drawSym(id,x,y,size){
  const sh=SYM[id]; if(!sh||typeof Path2D==='undefined') return;
  ctx.save(); ctx.translate(x-size/2,y-size/2); ctx.scale(size/24,size/24);
  ctx.lineJoin='round'; ctx.lineCap='round';
  for(const q of sh){ const path=_P2D[q.d]||(_P2D[q.d]=new Path2D(q.d));
    if(q.f){ ctx.fillStyle=q.f; ctx.fill(path); }
    ctx.strokeStyle=q.s||INK; ctx.lineWidth=q.w||2; ctx.stroke(path); }
  ctx.restore();
}
function stars(n,total=6){ let h=''; for(let i=0;i<total;i++) h+=svgSym(i<n?'star':'starOff',15); return h; }

function shoot(from,ang,spd,dmg,r,color,kind,opt={}){
  const b={x:from.x+Math.cos(ang)*(from.r||16),y:from.y+Math.sin(ang)*(from.r||16),
    vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,r,dmg,color,kind,life:opt.life||1.1,ang,spin:opt.spin||0,rot:0};
  Object.assign(b,opt); A.bullets.push(b); return b;
}
function eshoot(from,ang,spd,dmg,r,color,kind='eshot',opt={}){
  A.ebullets.push(Object.assign({x:from.x,y:from.y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
    r,dmg,color,kind,life:opt.life||3.4,rot:0},opt));
}
function puff(x,y,n,c,spd=170,size=5,life=.5){
  for(let i=0;i<n;i++){ if(A.parts.length>420) return;
    const a=rnd(0,TAU),s=rnd(spd*.25,spd);
    A.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(life*.5,life),max:life,c,r:rnd(size*.5,size)}); }
}
function floatText(x,y,txt,c,size=15){
  if(A.parts.length>440) return;
  A.parts.push({x,y,vx:rnd(-24,24),vy:-70,life:.85,max:.85,c,txt,size});
}
const POWS=['POW!','SPLAT!','BONK!','YEET!','KABLAM!','SQUISH!','ZORP!','WHOMP!','OOF!','SPLORT!','BLAMMO!','THWACK!'];

/* ---------------- arena setup ---------------- */
function startArena(planet){
  const t=planet.tier;
  A.mode='ground'; A.enemies.length=0; A.bullets.length=0; A.ebullets.length=0;
  A.parts.length=0; A.drops.length=0; A.pets.length=0; A.boss=null;
  A.w=2200+t*120; A.h=1650+t*90; A.wave=0; A.waves=planet.waves; A.done=false; A.killed=0;
  A.tint=planet.sky; A.ground=planet.ground; A.prop=planet.prop; A.shake=0;
  A.p={x:A.w/2,y:A.h/2,r:20,face:0,walk:0,inv:1.2};
  A.usedRevive=false; A.hitTaken=false; A.combo=[]; A.resolved=false;
  G.paused=false; UI.modal=null; validateLoadout();
  A.doodads.length=0;
  for(let i=0;i<90;i++) A.doodads.push({x:rnd(40,A.w-40),y:rnd(40,A.h-40),s:rnd(.6,1.9),h:rnd(0,1),c:Math.random()<.5?planet.c1:planet.c2});
  G.planet=planet; G.scene='arena';
  CG.gameplayStart(); CG.context({planet:planet.name,difficulty:DF().name,wave:1});
  MUS.play('ground',planet.id);
  nextWave();
}
function startSpace(target){
  A.mode='space'; A.enemies.length=0; A.bullets.length=0; A.ebullets.length=0;
  A.parts.length=0; A.drops.length=0; A.pets.length=0; A.boss=null; A.shake=0;
  A.w=2600; A.h=2000; A.done=false; A.killed=0; A.goal=5+Math.min(8,target.tier*2); A.hitTaken=false;
  A.p={x:A.w/2,y:A.h/2,r:24,face:0,walk:0};
  A.doodads.length=0;
  for(let i=0;i<160;i++) A.doodads.push({x:rnd(0,A.w),y:rnd(0,A.h),s:rnd(.4,2.2),h:rnd(0,1),c:'#ffffff'});
  G.ship.hp=G.ship.maxhp; A.spawnCd=0; G.scene='space';
  A.resolved=false; G.paused=false; UI.modal=null; validateLoadout();
  CG.gameplayStart(); CG.context({leg:'space route',destination:target.name,difficulty:DF().name});
  MUS.play('space',target.id);
  UI.objective('SHOOT DOWN '+A.goal+' PATROL CRAFT → '+target.name);
}
function nextWave(){
  const pl=G.planet, t=pl.tier;
  A.wave++;
  if(A.wave>A.waves){ spawnBoss(pl); return; }
  const n=3+A.wave+Math.floor(t*.75);
  for(let i=0;i<n;i++) spawnEnemy(pick(pl.crew),t,i*0.42);
  if(A.wave>1){
    const h=G.maxhp*(.1+.1*pk('snack'));
    if(h>0&&G.hp<G.maxhp){ heal(h); floatText(A.p.x,A.p.y-34,'+'+Math.round(h)+' HP','#7dff6a',16); }
  }
  UI.objective('WAVE '+A.wave+' / '+A.waves+' — SPLAT EVERY MINION');
  CG.context({planet:G.planet.name,difficulty:DF().name,wave:A.wave});
  if(A.wave===1) tip('move', IN.touch
    ? 'LEFT STICK MOVES · RIGHT STICK AIMS AND FIRES · DASH DODGES'
    : 'WASD MOVES · MOUSE AIMS · CLICK FIRES · SHIFT DASHES · Q AND E SWAP GUNS');
  if(A.wave===2) tip('wpn','EVERY GUN LEVELS UP BY BEING USED. SWAP OFTEN.');
  bigWord('WAVE '+A.wave,'#31e6ff');
}
function spawnEnemy(type,tier,delay=0){
  const d=EDEF[type]; if(!d) return;
  let x,y,tries=0;
  do{ const s=rint(0,3);
      x = s===0?rnd(0,A.w):s===1?rnd(0,A.w):s===2?rnd(0,120):rnd(A.w-120,A.w);
      y = s===0?rnd(0,120):s===1?rnd(A.h-120,A.h):rnd(0,A.h);
      tries++;
  } while(A.p && Math.hypot(x-A.p.x,y-A.p.y)<380 && tries<24);
  const mul=(1+(tier-1)*.45)*DF().ehp;
  A.enemies.push({id:EID++,type,def:d,x,y,vx:0,vy:0,r:d.r,hp:d.hp*mul,max:d.hp*mul,
    ai:d.ai,cd:rnd(.3,1.6),t:rnd(0,TAU),spawn:.45+delay,flash:0,dmg:d.dmg*(1+(tier-1)*.3),
    spd:d.spd*(1+(tier-1)*.06),drop:Math.round(d.drop*mul),state:0,face:0});
}

  {name:'SPACE MINE',hp:20,r:18,spd:52,dmg:26,ai:'smine',c1:'#ffd23f',c2:'#7a5a10',drop:12},
  {name:'GLOOP DRONE',hp:54,r:24,spd:110,dmg:16,ai:'sdrone',c1:'#8dff3a',c2:'#2c6b18',drop:22,shot:{spd:250,dmg:11,cd:2.1}}
];

    flash:0,dmg:k.dmg*mul,spd:k.spd,drop:Math.round(k.drop*mul),state:0,face:0});

function spawnBoss(pl){
  const b=pl.boss;
  A.boss={id:EID++,type:'boss',boss:true,def:{name:b.name,c1:b.c1,c2:b.c2,shape:b.shape,eyes:2},
    x:A.p.x+rnd(-1,1)*420,y:A.p.y-460,vx:0,vy:0,r:b.r,hp:b.hp*DF().ehp,max:b.hp*DF().ehp,dmg:26,spd:96,
    cd:2,t:0,flash:0,phase:1,atk:null,atkT:0,spawn:.9,attacks:b.attacks,spawnType:b.spawn,face:0};
  A.boss.x=clamp(A.boss.x,120,A.w-120); A.boss.y=clamp(A.boss.y,120,A.h-120);
  A.enemies.push(A.boss);
  UI.objective('BOUNTY TARGET ENGAGED');
  tip('boss','BOSSES WIND UP BEFORE EVERY ATTACK. WATCH THE TELL, THEN DASH.');

  bigWord('BOSS!','#ff2fa0'); AU.boom(); shake(16);
  MUS.play('boss',pl.id); MUS.stinger('boss');
  UI.say(b.name,b.taunt,'boss:'+pl.id);
}

/* ---------------- weapon firing ---------------- */
function currentWeapon(){ return G.weapons[G.wsel]; }
function selectWeaponIndex(i){ if(i>=0&&i<G.weapons.length){ G.wsel=i; UI.dock(); AU.blip(660,.05,'square',.07); } }
function cycleWeapon(d){ G.wsel=(G.wsel+d+G.weapons.length)%G.weapons.length; UI.dock(); AU.blip(660,.05,'square',.07); }
function tryFire(dt,ang){
  A.fireCd-=dt; if(A.fireCd>0) return;
  const id=currentWeapon(), w=WDEF[id], s=wstate(id);
  if(s.ammo<=0){
    /* never leave the player holding a dead trigger: fall back to something loaded */
    const nxt=G.weapons.findIndex((wid,i)=>i!==G.wsel&&wstate(wid).ammo>0);
    if(nxt>=0){
      G.wsel=nxt; UI.dock(); A.fireCd=.22;
      AU.blip(420,.08,'square',.07,180);
      toast('OUT OF AMMO — SWITCHED TO '+WDEF[G.weapons[nxt]].name.split(' ')[0]);
      return;
    }
    AU.blip(150,.09,'square',.08,-60); toast('OUT OF AMMO — RESTOCK AT THE STATION'); A.fireCd=.4; return;
  }
  w.fire(ang,s.lvl,A.p);
  if(s.ammo!==Infinity&&!(pk('weasel')&&Math.random()<.25*pk('weasel'))){ s.ammo--; UI.dock(); }
  A.fireCd=w.rate*(1-Math.min(.3,(s.lvl-1)*.075));
}
function shipFire(dt,ang){
  A.fireCd-=dt; if(A.fireCd>0) return;
  const d=G.ship.dmg;
  shoot(A.p,ang,700,d,7,'#8ef0ff','pellet',{life:1.1});
  if(G.ship.wing>0){ shoot(A.p,ang+.09,700,d*.7,6,'#8ef0ff','pellet',{life:1.1});
                     shoot(A.p,ang-.09,700,d*.7,6,'#8ef0ff','pellet',{life:1.1}); }
  if(G.ship.wing>1){ shoot(A.p,ang+.2,660,d*.55,6,'#8ef0ff','pellet',{life:1});
                     shoot(A.p,ang-.2,660,d*.55,6,'#8ef0ff','pellet',{life:1}); }
  A.fireCd=G.ship.rate; AU.shoot();
}
/* ---------------- input helpers ---------------- */
function moveVec(){
  let x=IN.moveX,y=IN.moveY;
  const C=IN.codes;
  if(C.KeyA||C.ArrowLeft ||IN.keys['arrowleft']) x-=1;
  if(C.KeyD||C.ArrowRight||IN.keys['arrowright'])x+=1;
  if(C.KeyW||C.ArrowUp   ||IN.keys['arrowup'])   y-=1;
  if(C.KeyS||C.ArrowDown ||IN.keys['arrowdown']) y+=1;
  const m=Math.hypot(x,y); if(m>1){x/=m;y/=m;}
  return {x,y,m:Math.min(1,m)};
}
function aimAngle(){
  if(IN.firing) return IN.aimAng;
  const sx=A.p.x-A.cam.x, sy=A.p.y-A.cam.y;
  if(IN.hasAim) return Math.atan2(IN.my-sy,IN.mx-sx);
  return A.p.face;
}
function wantsFire(){ return IN.firing||IN.mdown||IN.codes.KeyJ||(IN.keys[' ']&&!UI.talking); }

/* ---------------- main arena update ---------------- */
function updateArena(dt){
  const p=A.p, space=A.mode==='space';
  /* player */
  const mv=moveVec();
  let spd = space? G.ship.speed : 260;
  if(G.dashT>0){ spd*=2.7; G.dashT-=dt; if(A.parts.length<380)
    A.parts.push({x:p.x,y:p.y,vx:0,vy:0,life:.28,max:.28,c:'#8ef0ff',r:14}); }
  G.dashCd=Math.max(0,G.dashCd-dt);
  if((IN.dashReq||IN.codes.ShiftLeft||IN.codes.ShiftRight)&&G.dashCd<=0&&(mv.m>.15)){ G.dashT=.18; G.dashCd=1.1*(1-.3*pk('boots')); AU.blip(300,.14,'sine',.1,600); }
  IN.dashReq=false;
  p.x=clamp(p.x+mv.x*spd*dt,30,A.w-30);
  p.y=clamp(p.y+mv.y*spd*dt,30,A.h-30);
  p.walk+=Math.hypot(mv.x,mv.y)*dt*10;
  const ang=aimAngle(); p.face=ang;
  if(wantsFire()&&!A.done){ space?shipFire(dt,ang):tryFire(dt,ang); } else A.fireCd=Math.max(0,A.fireCd-dt);
  p.inv=Math.max(0,(p.inv||0)-dt);

  /* camera */
  A.cam.x=clamp(p.x-W/2,0,Math.max(0,A.w-W));
  A.cam.y=clamp(p.y-H/2,0,Math.max(0,A.h-H));
  if(A.w<W) A.cam.x=(A.w-W)/2; if(A.h<H) A.cam.y=(A.h-H)/2;
  A.shake=Math.max(0,A.shake-dt*44);
  A.flash=Math.max(0,A.flash-dt*3);

  /* space wave feeding */
  if(space&&!A.done){
    A.spawnCd-=dt;
    if(A.spawnCd<=0&&A.enemies.length<9&&A.killed+A.enemies.length<A.goal){
      spawnSpaceEnemy(G.travelTarget?G.travelTarget.tier:1); A.spawnCd=rnd(.7,1.5);
    }
    if(A.killed>=A.goal){ A.done=true;
      if(!A.hitTaken){ G.stats.cleanSpace++; checkAchv(); }
      setTimeout(arriveAtPlanet,900); bigWord('SKIES CLEAR!','#8dff3a'); }
  }

  /* enemies */
  for(let i=A.enemies.length-1;i>=0;i--){
    const e=A.enemies[i];
    if(e.spawn>0){ e.spawn-=dt; continue; }
    e.flash=Math.max(0,e.flash-dt*6); e.t+=dt;
    e.boss?updateBoss(e,dt):updateEnemyAI(e,dt);
    e.x=clamp(e.x,20,A.w-20); e.y=clamp(e.y,20,A.h-20);
    if(e.hp<=0){ killEnemy(e,i); continue; }   // a corpse cannot land a contact hit
    /* touch damage: one clean hit, then both parties bounce apart */
    e.hitCd=Math.max(0,(e.hitCd||0)-dt);
    if(dist(e,p)<e.r+p.r-4){
      const a=angTo(p,e);
      if(e.hitCd<=0&&p.inv<=0){
        hurtPlayer(e.dmg); e.hitCd=.85;
        p.x=clamp(p.x-Math.cos(a)*34,30,A.w-30); p.y=clamp(p.y-Math.sin(a)*34,30,A.h-30);
        e.x+=Math.cos(a)*40; e.y+=Math.sin(a)*40;
        puff((p.x+e.x)/2,(p.y+e.y)/2,7,'#ff5b8a',180,5,.34);
      }
      e.x+=Math.cos(a)*120*dt; e.y+=Math.sin(a)*120*dt;
    }
  }

  /* pets */
  for(let i=A.pets.length-1;i>=0;i--){ const g=A.pets[i];
    g.life-=dt; g.wob+=dt*3; g.cd-=dt;
    let tg=null,bd=1e9;
    for(const e of A.enemies){ const d=dist(g,e); if(d<bd){bd=d;tg=e;} }
    if(tg&&bd<520){ const a=angTo(g,tg); g.x+=Math.cos(a)*230*dt; g.y+=Math.sin(a)*230*dt;
      if(bd<tg.r+g.r+6&&g.cd<=0){ damageEnemy(tg,g.dmg,'glorb'); g.cd=.35; puff(tg.x,tg.y,4,'#c86bff',120,4,.3); } }
    else { const a=angTo(g,p); g.x+=Math.cos(a)*160*dt; g.y+=Math.sin(a)*160*dt; }
    if(g.life<=0){ puff(g.x,g.y,14,'#c86bff'); A.pets.splice(i,1); }
  }

  /* player bullets */
  for(let i=A.bullets.length-1;i>=0;i--){
    const b=A.bullets[i]; b.life-=dt; b.rot+=(b.spin||0)*dt;
    if(b.follow){ b.x=p.x; b.y=p.y; b.ang=p.face; }
    else if(b.orbit){ b.orbit.ang+=b.orbit.spd*dt; b.x=p.x+Math.cos(b.orbit.ang)*b.orbit.rad; b.y=p.y+Math.sin(b.orbit.ang)*b.orbit.rad; }
    else{
      if(b.homing){ let tg=null,bd=1e9;
        for(const e of A.enemies){ const d=dist(b,e); if(d<bd&&d<520){bd=d;tg=e;} }
        if(tg){ const a=angTo(b,tg), ca=Math.atan2(b.vy,b.vx);
          let da=((a-ca+Math.PI*3)%TAU)-Math.PI; const na=ca+clamp(da,-3.2*dt,3.2*dt);
          const s=Math.hypot(b.vx,b.vy); b.vx=Math.cos(na)*s; b.vy=Math.sin(na)*s; } }
      if(b.wig!==undefined){ b.wig+=dt*22; const s=Math.hypot(b.vx,b.vy),a=Math.atan2(b.vy,b.vx)+Math.sin(b.wig)*.09;
        b.vx=Math.cos(a)*s; b.vy=Math.sin(a)*s; }
      if(b.drag){ b.vx*=1-b.drag*dt; b.vy*=1-b.drag*dt; }
      b.x+=b.vx*dt; b.y+=b.vy*dt;
      if(b.bounce){ if(b.x<10||b.x>A.w-10){ b.vx*=-1; b.bounce--; AU.boing(); } if(b.y<10||b.y>A.h-10){ b.vy*=-1; b.bounce--; AU.boing(); } }
      else if(b.x<-40||b.x>A.w+40||b.y<-40||b.y>A.h+40){ A.bullets.splice(i,1); continue; }
    }
    if(b.pull){ for(const e of A.enemies){ if(e.boss) continue; const d=dist(b,e);
      if(d<180){ const a=angTo(e,b); e.x+=Math.cos(a)*b.pull*dt*(1-d/180); e.y+=Math.sin(a)*b.pull*dt*(1-d/180); } } }
    if(b.hit&&(b.orbit||b.pull||b.follow)){ b.hitTick=(b.hitTick||0)+dt; if(b.hitTick>.3){ b.hit.clear(); b.hitTick=0; } }
    /* hit test */
    for(const e of A.enemies){
      if(e.spawn>0) continue;
      if(b.hit&&b.hit.has(e.id)) continue;
      const reach=b.follow? b.r : b.r+e.r;
      if(b.follow){ const a2=angTo(p,e), da=Math.abs(((a2-b.ang+Math.PI*3)%TAU)-Math.PI);
        if(dist(p,e)>b.r+e.r||da>1.1) continue; }
      else if(dist(b,e)>reach) continue;
      damageEnemy(e,b.dmg,currentWeapon(),b);
      if(b.knock){ const a=angTo(p,e); e.x+=Math.cos(a)*b.knock*.06; e.y+=Math.sin(a)*b.knock*.06; }
      if(b.audit&&e.hp>0&&e.hp<e.max*.34&&!e.boss){ e.hp=0; e.audited=true; }
      if(b.hit) b.hit.add(e.id);
      if(!b.pierce){ if(b.explode) explode(b); A.bullets.splice(i,1); break; }
      else if(b.pierce!==99){ b.pierce--; if(b.pierce<=0){ if(b.explode) explode(b); A.bullets.splice(i,1); break; } }
    }
    if(b.life<=0){ if(b.explode) explode(b); const k=A.bullets.indexOf(b); if(k>=0) A.bullets.splice(k,1); }
  }

  /* enemy bullets */
  for(let i=A.ebullets.length-1;i>=0;i--){
    const b=A.ebullets[i]; b.life-=dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=dt*4;
    if(b.life<=0||b.x<-60||b.x>A.w+60||b.y<-60||b.y>A.h+60){ A.ebullets.splice(i,1); continue; }
    if(dist(b,p)<b.r+p.r-3){ hurtPlayer(b.dmg); puff(b.x,b.y,7,b.color,150,4,.35); A.ebullets.splice(i,1); }
  }

  /* drops */
  for(let i=A.drops.length-1;i>=0;i--){
    const d=A.drops[i]; d.life-=dt; d.t+=dt;
    const dd=dist(d,p);
    if(dd<150*G.magnet){ const a=angTo(d,p); const s=lerp(120,620,1-dd/(150*G.magnet)); d.x+=Math.cos(a)*s*dt; d.y+=Math.sin(a)*s*dt; }
    else { d.x+=d.vx*dt; d.y+=d.vy*dt; d.vx*=1-1.9*dt; d.vy*=1-1.9*dt; }
    if(dd<p.r+14){
      if(d.kind==='coin'){ const v=Math.round(d.val*(1+.2*pk('greed'))); G.sprockets+=v;
        G.stats.peak=Math.max(G.stats.peak,G.sprockets); AU.coin(); floatText(d.x,d.y,'+'+v,'#ffd23f',13);
        if(G.sprockets>=250) tip('shop','SPROCKETS BUY GUNS AT SPROCKET STATION, THE HUB IN THE MIDDLE OF THE STAR MAP');
        checkAchv(); }
      else if(d.kind==='hp'){ heal(24); AU.coin(); floatText(d.x,d.y,'+24 HP','#7dff6a',14); }
      else if(d.kind==='ammo'){ refillSome(); AU.coin(); floatText(d.x,d.y,'AMMO!','#31e6ff',14); }
      A.drops.splice(i,1); UI.hud();
    } else if(d.life<=0) A.drops.splice(i,1);
  }

  /* particles */
  for(let i=A.parts.length-1;i>=0;i--){ const q=A.parts[i]; q.life-=dt;
    q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=1-2.4*dt; q.vy*=1-2.4*dt;
    if(q.txt) q.vy-=40*dt;
    if(q.life<=0) A.parts.splice(i,1); }

  /* ground wave progression */
  if(!space&&!A.done&&!A.boss&&A.enemies.length===0) nextWave();
  if(A.boss){ UI.bossFill(Math.max(0,A.boss.hp/A.boss.max)); }
  if(G.hp<=0&&!A.done) playerDown();
}

function resolveArena(){        // exactly one of win / lose / abandon may ever fire
  if(A.resolved) return false;
  A.resolved=true; A.done=true; CG.gameplayStop(); return true;
}
function validateLoadout(){     // ownership and ammo can never drift apart
  const seen={};
  G.weapons=G.weapons.filter(id=>WDEF[id]&&!seen[id]&&(seen[id]=1));
  if(!G.weapons.length) G.weapons=['popgun','mallet'];
  G.wsel=clamp(G.wsel,0,G.weapons.length-1);
  for(const id of G.weapons){ const w=WDEF[id], st=wstate(id);
    st.ammo = w.ammoMax===Infinity ? Infinity : clamp(st.ammo,0,w.ammoMax);
    st.lvl = clamp(st.lvl,1,5); }
  G.sprockets=Math.max(0,Math.round(G.sprockets));
}
function explode(b){
  const R=b.explode||70;
  puff(b.x,b.y,22,'#ffb43d',260,8,.6); puff(b.x,b.y,10,'#fff',200,5,.4);
  AU.boom(); shake(9);
  for(const e of A.enemies) if(dist(b,e)<R+e.r) damageEnemy(e,b.dmg*1.2,currentWeapon());
}
function damageEnemy(e,dmg,wid,b){
  if(e.spawn>0) return;
  dmg*=1+.12*pk('dmg');
  if(e.hp>0&&e.hp-dmg<=0){ e.killedBy=wid; }
  e.hp-=dmg; e.flash=1;
  if(wid&&WDEF[wid]) addWXP(wid,dmg);
  if(Math.random()<.5) floatText(e.x+rnd(-8,8),e.y-e.r,Math.round(dmg),'#fff',13);
  puff(e.x,e.y,3,e.def.c1,130,4,.28);
  if(!e.boss&&b&&b.kind==='fist'){ shake(3); }
}
function killEnemy(e,i){
  const isBoss=e.boss;
  puff(e.x,e.y,isBoss?46:16,e.audited?'#fdfaf0':e.def.c1,isBoss?380:230,isBoss?12:7,isBoss?1:.6);
  puff(e.x,e.y,isBoss?26:8,e.def.c2,200,6,.5);
  floatText(e.x,e.y-e.r,e.audited?'AUDITED!':pick(POWS),'#ffd23f',isBoss?26:17);
  AU.thump(); if(isBoss){ AU.boom(); shake(22); A.flash=1; }
  const n=e.boss?0:1+Math.floor(e.drop/12);
  for(let k=0;k<n;k++){ const a=rnd(0,TAU);
    A.drops.push({x:e.x,y:e.y,vx:Math.cos(a)*rnd(60,200),vy:Math.sin(a)*rnd(60,200),
      kind:'coin',val:Math.max(1,Math.round(e.drop/n)),life:16,t:0}); }
  if(!e.boss&&Math.random()<.15) A.drops.push({x:e.x,y:e.y,vx:0,vy:0,kind:'hp',life:16,t:0});
  if(!e.boss&&Math.random()<.13) A.drops.push({x:e.x,y:e.y,vx:0,vy:0,kind:'ammo',life:16,t:0});
  const idx=A.enemies.indexOf(e); if(idx>=0) A.enemies.splice(idx,1);
  A.killed++;
  G.stats.kills++;
  if(e.killedBy==='mallet') G.stats.mallet++;
  A.combo=(A.combo||[]).filter(x=>performance.now()-x<2000); A.combo.push(performance.now());
  G.stats.combo=Math.max(G.stats.combo,A.combo.length);
  if(A.mode==='space'){
    G.ship.hp=Math.min(G.ship.maxhp,G.ship.hp+6);
    UI.objective('PATROL CRAFT DOWNED: '+A.killed+' / '+A.goal);
  }
  checkAchv();
  if(isBoss){ A.boss=null; UI.bossBar(null); onBossDefeated(); }
}
function hurtPlayer(d){
  if(A.p.inv>0||A.done) return;
  const red=A.mode==='space'?0:G.armor;
  const dmg=d*(1-red)*DF().edmg;
  A.hitTaken=true;
  if(A.mode==='space'){ G.ship.hp-=dmg; if(G.ship.hp<=0){ G.ship.hp=0; playerDown(); } }
  else{
    G.hp-=dmg;
    if(G.hp<=0&&pk('gerald')&&!A.usedRevive){
      A.usedRevive=true; G.hp=G.maxhp*.4; A.p.inv=2.2;
      bigWord('GERALD SAVES YOU!','#ff6fd1'); toast('THE SOCK PUPPET OWED YOU ONE');
      puff(A.p.x,A.p.y,34,'#ff6fd1',300,9,.8); AU.level(); shake(12);
    } else if(G.hp<=0){
      G.hp=0; playerDown();      // resolve at the moment of the fatal hit, not a frame later
    }
  }
  if(d>2.5){ A.p.inv=.45+.25*pk('rubber'); AU.hurt(); shake(6); A.flash=Math.min(.5,A.flash+.28); }
  if(A.mode!=='space'&&G.hp>0&&G.hp<G.maxhp*.35)
    tip('low','LOW HEALTH — GREEN CROSSES HEAL, AND EACH NEW WAVE PATCHES YOU UP');
  UI.hud();
}
function heal(v){ G.hp=Math.min(G.maxhp,G.hp+v); UI.hud(); }
function refillSome(){
  for(const id of G.weapons){ const w=WDEF[id],s=wstate(id);
    if(w.ammoMax!==Infinity) s.ammo=Math.min(w.ammoMax,s.ammo+Math.ceil(w.ammoMax*.22)); }
