<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060a">
<title>LEVIATHAN HOUR</title>
<meta name="description" content="A first person survival horror game. Six blocks. Five civilians. Eight minutes.">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #05060a; overflow: hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    /* a phone must not scroll, zoom, or pop a selection while you play */
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
    background:
      radial-gradient(120% 90% at 50% 120%, #17110c 0%, #06070a 55%, #030407 100%);
  }
  #view {
    display: block; cursor: crosshair; background: #000;
    box-shadow: 0 0 0 1px rgba(214,178,118,.10), 0 40px 120px rgba(0,0,0,.9);
    touch-action: none;
  }
  /* the hint is desktop guidance; on a phone the controls are on screen */
  @media (pointer: coarse) { #hint { display: none; } }
  #hint {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    font-size: 13px; letter-spacing: .14em; color: rgba(230,198,142,.62);
    text-transform: uppercase; pointer-events: none; white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }
  @media (max-width: 720px) { #hint { font-size: 11px; letter-spacing: .10em; } }
  @media (prefers-reduced-motion: reduce) { #view { box-shadow: none; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="view" width="960" height="540"></canvas></div>
<div id="hint">Headphones recommended &nbsp;&middot;&nbsp; Click the frame to capture the mouse &nbsp;&middot;&nbsp; Esc releases it</div>
<script>
(function(){
"use strict";
/* ============================================================
   LEVIATHAN HOUR  —  core constants, math, noise
   ============================================================ */

const RES_W = 384, RES_H = 216;
const FOV = 74 * Math.PI / 180;
const PLANE_LEN = Math.tan(FOV / 2);
const PROJ = (RES_W / 2) / PLANE_LEN;
const MAXDIST = 30;

const EYE_STAND = 0.62, EYE_CROUCH = 0.34;
const PITCH_MAX = 1.25;   // ~51 degrees. Enough to find the body overhead.
const H_TALL = 7.0;      // exterior building shell
const H_ROOM = 1.35;     // interior partition
const H_RUBBLE = 1.15;   // you can see over these
const H_CAR = 0.95;
const CEIL_H = 1.35;

/* ---- tuning knobs (tweak these to rebalance) ---- */
const TUNE = {
  RUN_TIME: 480,          // seconds until the last helicopter lifts
  WALK: 2.15, SPRINT: 4.25, CROUCH: 1.5,
  MAX_CHASERS: 2,          // they take turns rather than dogpiling
  EARLY: 120,              // for the first two minutes only one commits at a time
  STAM_DRAIN: 15, STAM_REGEN: 19,
  BATT_DRAIN: 0.58,       // percent per second, torch on
  RESERVE_CELL: 30,       // one guaranteed comeback when the lamp first dies
  GRACE: 25,              // seconds of quiet after you land, to get your bearings
  BLEED_RATE: 1.15,        // hp per second while bleeding
  PARA_DMG: 9,
  PARA_SPEED: 3.55,
  PARA_HP: 1,          // one solid swing puts one down
  IFRAME: 1.2,
  FLARE_BURN: 26,         // seconds
  QUAKE_MIN: 42, QUAKE_MAX: 64,
  SURVIVORS: 5
};

/* ---- tiles ---- */
const T_VOID = 0, T_STREET = 1, T_FLOOR = 2, T_GLASSF = 3;   // walkable
const T_BRICK = 4, T_CONC = 5, T_DRY = 6, T_RUBBLE = 7, T_CAR = 8, T_SHOP = 9, T_BOARD = 10;

const SOLID = new Uint8Array(16);
[T_BRICK, T_CONC, T_DRY, T_RUBBLE, T_CAR, T_SHOP, T_BOARD].forEach(t => SOLID[t] = 1);

const TILE_H = new Float32Array(16);
TILE_H[T_BRICK] = H_TALL; TILE_H[T_CONC] = H_TALL; TILE_H[T_SHOP] = H_TALL;
TILE_H[T_DRY] = H_ROOM; TILE_H[T_BOARD] = H_ROOM;
TILE_H[T_RUBBLE] = H_RUBBLE; TILE_H[T_CAR] = H_CAR;

// which texture each solid tile uses
const TILE_TEX = new Uint8Array(16);
TILE_TEX[T_BRICK] = 0; TILE_TEX[T_CONC] = 1; TILE_TEX[T_DRY] = 2;
TILE_TEX[T_RUBBLE] = 3; TILE_TEX[T_CAR] = 4; TILE_TEX[T_SHOP] = 5; TILE_TEX[T_BOARD] = 6;

const MAP_W = 48, MAP_H = 48;

/* ---- math ---- */
let REDUCED_MOTION = false;

/* Two ways in. The first is for learning the block; the second is the
   run as designed. Everything else about the night is identical. */
const DIFFS = {
  recruit: { key: 'recruit', label: 'FIRST NIGHT', lines: ['3 TO FIND \u00b7 10 MINUTES', 'THE WAY IS MARKED'],
             dmg: 6, chasers: 1, alwaysEarly: true, grace: 35, flares: 4, bands: 3, batt: 0.42, guide: true,
             survivors: 3, runTime: 600 },
  veteran: { key: 'veteran', label: 'VETERAN', lines: ['5 TO FIND \u00b7 8 MINUTES', 'NO MARKS. NO MERCY.'],
             dmg: 9, chasers: 2, alwaysEarly: false, grace: 25, flares: 2, bands: 2, batt: 0.58, guide: false,
             survivors: 5, runTime: 480 }
};
let DIF = DIFFS.recruit;

/* One dial for every motion effect, so turning it down turns everything
   down together: camera shake, head bob, torch flicker, falling ash, and
   the blinking of urgent HUD elements. */
const motion = () => REDUCED_MOTION ? 0.20 : 1;

/* A pulse that settles to a steady mid value when motion is reduced,
   instead of flashing. */
function pulse(periodMs, lo, hi) {
  if (REDUCED_MOTION) return (lo + hi) / 2;
  return lo + (hi - lo) * (0.5 + 0.5 * Math.sin(performance.now() / periodMs));
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let RND = mulberry32(Date.now() & 0xffffff);
const rf = (a = 1, b = 0) => b + (a - b) * RND();
const ri = (a, b) => Math.floor(b + (a - b + 1) * RND()) ;

/* value noise on a 256 grid, seeded */
function makeNoise(seed) {
  const r = mulberry32(seed);
  const g = new Float32Array(256 * 256);
  for (let i = 0; i < g.length; i++) g[i] = r();
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = smooth(xf), v = smooth(yf);
    const a = g[((yi & 255) << 8) | (xi & 255)];
    const b = g[((yi & 255) << 8) | ((xi + 1) & 255)];
    const c = g[(((yi + 1) & 255) << 8) | (xi & 255)];
    const d = g[(((yi + 1) & 255) << 8) | ((xi + 1) & 255)];
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  };
}
function fbm(n, x, y, oct, gain) {
  let s = 0, amp = 1, tot = 0, f = 1;
  for (let i = 0; i < oct; i++) { s += n(x * f, y * f) * amp; tot += amp; amp *= gain; f *= 2; }
  return s / tot;
}


/* ============================================================
   Procedural textures. Everything is generated at load so the
   game stays a single file with no external assets.
   ============================================================ */

const TEX = 64;
const N1 = makeNoise(1337), N2 = makeNoise(9001), N3 = makeNoise(4242);

function newTex() { return new Uint32Array(TEX * TEX); }
function put(t, x, y, r, g, b) {
  t[(y & 63) * TEX + (x & 63)] = 0xff000000 | (clamp(b | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(r | 0, 0, 255);
}

/* --- 0: soot-stained brick facade --- */
function texBrick() {
  const t = newTex();
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const row = Math.floor(y / 8);
    const off = (row & 1) ? 8 : 0;
    const bx = (x + off) % 16, by = y % 8;
    let r, g, b;
    if (bx < 1 || by < 1) { r = 38; g = 35; b = 33; }            // mortar
    else {
      const seed = fbm(N2, (Math.floor((x + off) / 16)) * 7.1, row * 3.7, 2, .5);
      const base = 62 + seed * 46;
      const grain = fbm(N1, x * .55, y * .55, 3, .55);
      r = base * (.75 + grain * .5);
      g = base * (.46 + grain * .34);
      b = base * (.36 + grain * .28);
    }
    // soot wash, heavier toward the top
    const soot = fbm(N3, x * .09, y * .05, 3, .6);
    const k = clamp(soot * 1.5 - (y / TEX) * .45, 0, 1);
    r = lerp(r, 16, k * .72); g = lerp(g, 15, k * .72); b = lerp(b, 15, k * .72);
    // cracks
    const c = Math.abs(fbm(N1, x * .07 + 3, y * .12, 4, .5) - .5);
    if (c < .022) { r *= .35; g *= .35; b *= .35; }
    put(t, x, y, r, g, b);
  }
  return t;
}

/* --- 1: poured concrete, water-streaked --- */
function texConcrete() {
  const t = newTex();
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const grain = fbm(N1, x * .8, y * .8, 4, .5);
    const blotch = fbm(N2, x * .06, y * .04, 3, .6);
    let v = 52 + grain * 30 + blotch * 26;
    // vertical rust streaks under the joints
    const st = fbm(N3, x * .5, y * .015, 2, .5);
    if (st > .62) { v *= .62; }
    let r = v * 1.02, g = v * .99, b = v * .95;
    if (st > .72) { r *= 1.12; g *= .86; b *= .68; }   // rust
    // form-tie holes
    if ((x % 32 === 6) && (y % 24 === 5)) { r *= .3; g *= .3; b *= .3; }
    // spall / exposed aggregate
    const sp = fbm(N2, x * .18 + 9, y * .18, 3, .55);
    if (sp > .70) { const d = (sp - .70) * 3; r = lerp(r, 34, d); g = lerp(g, 32, d); b = lerp(b, 30, d); }
    put(t, x, y, r, g, b);
  }
  return t;
}

/* --- 2: interior drywall, torn open, studs showing --- */
function texDrywall() {
  const t = newTex();
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const grain = fbm(N1, x * .9, y * .9, 3, .5);
    let r = 74 + grain * 18, g = 70 + grain * 17, b = 62 + grain * 15;
    // grime creeping up from the floor
    const gr = clamp((y - 40) / 24, 0, 1) * fbm(N2, x * .1, y * .1, 2, .6);
    r = lerp(r, 26, gr); g = lerp(g, 24, gr); b = lerp(b, 21, gr);
    // torn hole revealing framing
    const hole = fbm(N3, x * .09 + 11, y * .09 + 4, 3, .55);
    if (hole > .655) {
      const dark = clamp((hole - .655) * 9, 0, 1);
      if (x % 16 < 3) { r = lerp(r, 58, dark); g = lerp(g, 44, dark); b = lerp(b, 30, dark); }  // stud
      else { r = lerp(r, 7, dark); g = lerp(g, 7, dark); b = lerp(b, 8, dark); }                 // cavity
    }
    // dried spatter
    const sp = fbm(N2, x * .3 + 40, y * .3 + 20, 3, .5);
    if (sp > .76 && y > 12 && y < 52) { const d = (sp - .76) * 4; r = lerp(r, 58, d); g = lerp(g, 12, d); b = lerp(b, 10, d); }
    put(t, x, y, r, g, b);
  }
  return t;
}

/* --- 3: collapse rubble, rebar --- */
function texRubble() {
  const t = newTex();
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const chunk = fbm(N2, x * .22, y * .22, 4, .55);
    const edge = Math.abs(chunk - .5);
    let v = 30 + chunk * 46;
    if (edge < .04) v *= .45;                       // gaps between slabs
    const dust = fbm(N1, x * .7, y * .7, 3, .5);
    v = v * (.8 + dust * .4);
    let r = v * 1.0, g = v * .96, b = v * .9;
    // bent rebar
    const rb = Math.abs(fbm(N3, x * .13 + 5, y * .05, 3, .5) - .5);
    if (rb < .018) { r = 74; g = 48; b = 30; }
    put(t, x, y, r, g, b);
  }
  return t;
}

/* --- 4: burned-out car body --- */
function texCar() {
  const t = newTex();
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    let r, g, b;
    if (y < 20) { // glass line, mostly gone
      const sh = fbm(N1, x * .4, y * .4, 3, .5);
      r = 16 + sh * 18; g = 18 + sh * 20; b = 20 + sh * 22;
    } else {
      const panel = fbm(N2, x * .12, y * .12, 3, .5);
      let v = 34 + panel * 24;
      const rust = fbm(N3, x * .25, y * .25, 4, .55);
      r = v; g = v * .95; b = v * .95;
      if (rust > .55) { const d = (rust - .55) * 2.2; r = lerp(r, 88, d); g = lerp(g, 44, d); b = lerp(b, 22, d); }
      if (y > 52) { r *= .5; g *= .5; b *= .5; }   // shadow under sill
    }
    put(t, x, y, r, g, b);
  }
  return t;
}

/* --- 5: shopfront, blown-out glazing in an aluminium frame --- */
function texShop() {
  const t = newTex();
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    let r, g, b;
    const frame = (x % 32 < 3) || (y % 56 < 3) || y > 58;
    if (frame) { const n = fbm(N1, x * .6, y * .6, 2, .5); r = 44 + n * 16; g = 46 + n * 16; b = 48 + n * 16; }
    else {
      // dark interior seen through the opening, shards clinging at the edges
      const d = fbm(N2, x * .15, y * .15, 3, .55);
      r = 9 + d * 10; g = 10 + d * 11; b = 12 + d * 13;
      const shard = fbm(N3, x * .35, y * .12, 3, .5);
      const near = Math.min(x % 32, 31 - (x % 32)) / 16;
      if (shard > .72 - near * .3) { r += 40; g += 46; b += 52; }
    }
    put(t, x, y, r, g, b);
  }
  return t;
}

/* --- 6: plywood barricade --- */
function texBoard() {
  const t = newTex();
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const plank = Math.floor(y / 11);
    const gap = (y % 11) < 1;
    const grain = fbm(N1, x * .25, plank * 9 + y * 1.6, 3, .5);
    let v = 46 + grain * 28 + (plank & 1 ? 6 : 0);
    let r = v * 1.05, g = v * .82, b = v * .58;
    if (gap) { r *= .22; g *= .22; b *= .22; }
    if ((x % 27 === 4 || x % 27 === 21) && (y % 11 === 5)) { r = 70; g = 66; b = 60; } // nail heads
    put(t, x, y, r, g, b);
  }
  return t;
}

/* --- floors --- */
function texAsphalt() {
  const t = newTex();
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const grain = fbm(N1, x * 1.1, y * 1.1, 4, .5);
    const patch = fbm(N2, x * .05, y * .05, 3, .6);
    let v = 22 + grain * 20 + patch * 12;
    let r = v, g = v * 1.0, b = v * 1.04;
    const crack = Math.abs(fbm(N3, x * .09, y * .09, 4, .5) - .5);
    if (crack < .02) { r *= .5; g *= .5; b *= .5; }
    // scattered debris flecks
    const fl = fbm(N2, x * 1.7 + 60, y * 1.7, 2, .5);
    if (fl > .82) { r += 26; g += 25; b += 24; }
    put(t, x, y, r, g, b);
  }
  return t;
}
function texInterior() {
  const t = newTex();
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const tile = ((x >> 5) + (y >> 5)) & 1;
    const grout = (x % 32 < 1) || (y % 32 < 1);
    const grain = fbm(N1, x * .9, y * .9, 3, .5);
    let v = (tile ? 48 : 40) + grain * 14;
    let r = v * 1.0, g = v * .97, b = v * .9;
    if (grout) { r *= .55; g *= .55; b *= .55; }
    const dust = fbm(N2, x * .08, y * .08, 3, .6);
    r = lerp(r, 30, dust * .5); g = lerp(g, 29, dust * .5); b = lerp(b, 27, dust * .5);
    put(t, x, y, r, g, b);
  }
  return t;
}
function texGlassFloor() {
  const t = newTex();
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const grain = fbm(N1, x * 1.3, y * 1.3, 3, .5);
    let v = 18 + grain * 14;
    let r = v, g = v * 1.02, b = v * 1.1;
    const sh = fbm(N3, x * 2.1, y * 2.1, 2, .5);
    if (sh > .74) { const d = (sh - .74) * 3.4; r += 60 * d; g += 68 * d; b += 78 * d; }
    put(t, x, y, r, g, b);
  }
  return t;
}
function texCeiling() {
  const t = newTex();
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const grid = (x % 32 < 1) || (y % 32 < 1);
    const grain = fbm(N1, x * .8, y * .8, 3, .5);
    const stain = fbm(N2, x * .06, y * .06, 3, .6);
    let v = 40 + grain * 12;
    let r = v, g = v * .98, b = v * .93;
    if (stain > .58) { const d = (stain - .58) * 2.2; r = lerp(r, 46, d); g = lerp(g, 34, d); b = lerp(b, 20, d); }
    if (stain > .78) { r *= .18; g *= .18; b *= .2; }   // panel fallen out
    if (grid) { r *= .6; g *= .6; b *= .6; }
    put(t, x, y, r, g, b);
  }
  return t;
}

const WALL_TEX = [texBrick(), texConcrete(), texDrywall(), texRubble(), texCar(), texShop(), texBoard()];
const FLOOR_TEX = [texAsphalt(), texInterior(), texGlassFloor()];
const CEIL_TEX = texCeiling();

/* ============================================================
   The animal. Drawn once into an offscreen buffer, then blitted
   into the sky with a depth test so buildings occlude it.
   ============================================================ */
const KJ_W = 300, KJ_H = 420;
let KAIJU_PX = null;
let KJ_LEG = null, KJ_TORSO = null;

function buildKaiju() {
  const c = document.createElement('canvas');
  c.width = KJ_W; c.height = KJ_H;
  const g = c.getContext('2d');
  g.clearRect(0, 0, KJ_W, KJ_H);

  const body = '#080a0c';
  g.fillStyle = body;

  // hind legs, planted wide
  g.beginPath();
  g.moveTo(120, 420); g.lineTo(108, 300); g.lineTo(126, 236); g.lineTo(164, 244);
  g.lineTo(160, 320); g.lineTo(154, 420); g.closePath(); g.fill();
  g.beginPath();
  g.moveTo(196, 420); g.lineTo(186, 316); g.lineTo(176, 246); g.lineTo(214, 238);
  g.lineTo(232, 306); g.lineTo(228, 420); g.closePath(); g.fill();

  // torso, hunched
  g.beginPath();
  g.moveTo(112, 250); g.quadraticCurveTo(96, 176, 132, 128);
  g.quadraticCurveTo(170, 88, 214, 122);
  g.quadraticCurveTo(246, 158, 234, 252);
  g.quadraticCurveTo(174, 274, 112, 250); g.closePath(); g.fill();

  // shoulder blades / dorsal ridge
  g.beginPath();
  g.moveTo(126, 132); g.lineTo(146, 78); g.lineTo(158, 126); g.closePath(); g.fill();
  g.beginPath();
  g.moveTo(166, 118); g.lineTo(186, 62); g.lineTo(200, 116); g.closePath(); g.fill();

  // long forelimbs hanging past the knee
  g.beginPath();
  g.moveTo(112, 150); g.lineTo(74, 214); g.lineTo(52, 306); g.lineTo(40, 372);
  g.lineTo(62, 376); g.lineTo(78, 300); g.lineTo(100, 216); g.lineTo(130, 168); g.closePath(); g.fill();
  g.beginPath();
  g.moveTo(226, 146); g.lineTo(262, 208); g.lineTo(276, 300); g.lineTo(286, 366);
  g.lineTo(264, 372); g.lineTo(250, 298); g.lineTo(230, 212); g.lineTo(206, 164); g.closePath(); g.fill();

  // splayed hands
  g.lineWidth = 5; g.strokeStyle = body; g.lineCap = 'round';
  for (const [hx, hy, dir] of [[48, 372, -1], [278, 366, 1]]) {
    for (let i = 0; i < 4; i++) {
      g.beginPath(); g.moveTo(hx, hy);
      g.lineTo(hx + dir * (6 + i * 9), hy + 26 + i * 5);
      g.stroke();
    }
  }

  // small head, low and forward
  g.beginPath();
  g.moveTo(150, 96); g.quadraticCurveTo(168, 58, 196, 74);
  g.quadraticCurveTo(212, 88, 198, 108);
  g.quadraticCurveTo(174, 120, 150, 96); g.closePath(); g.fill();
  // jaw, hanging open
  g.beginPath();
  g.moveTo(178, 104); g.lineTo(214, 126); g.lineTo(178, 118); g.closePath(); g.fill();

  // rim light from the fires behind it
  g.globalCompositeOperation = 'source-atop';
  const rim = g.createLinearGradient(30, 0, 300, 0);
  rim.addColorStop(0, 'rgba(196,104,44,0.42)');
  rim.addColorStop(.22, 'rgba(58,34,22,0.10)');

}

/* ============================================================
   Six blocks of a city that stopped existing forty minutes ago.
   ============================================================ */

let map = new Uint8Array(MAP_W * MAP_H);
let inside = new Uint8Array(MAP_W * MAP_H);   // 1 = under a roof
let blocks = [];                               // {x,y,w,h,kind}

const at = (x, y) => (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) ? T_CONC : map[y * MAP_W + x];
const setT = (x, y, v) => { if (x >= 0 && y >= 0 && x < MAP_W && y < MAP_H) map[y * MAP_W + x] = v; };
const isSolid = (x, y) => SOLID[at(x | 0, y | 0)] === 1;
const isInside = (x, y) => inside[((y | 0) * MAP_W + (x | 0)) | 0] === 1;

const BLOCK = 8, STREET = 3;
const gridPos = i => 1 + i * (BLOCK + STREET) + STREET;   // 4,15,26,37

function genCity(seed) {
  RND = mulberry32(seed);
  map.fill(T_STREET);
  inside.fill(0);
  blocks = [];

  // sealed perimeter: the cordon, jackknifed rigs, a wall of debris
  for (let x = 0; x < MAP_W; x++) { for (let d = 0; d < 2; d++) { setT(x, d, T_RUBBLE); setT(x, MAP_H - 1 - d, T_RUBBLE); } }
  for (let y = 0; y < MAP_H; y++) { for (let d = 0; d < 2; d++) { setT(d, y, T_RUBBLE); setT(MAP_W - 1 - d, y, T_RUBBLE); } }

  const kinds = ['office', 'office', 'shop', 'shop', 'apartment', 'apartment', 'lot', 'flat', 'office', 'shop', 'apartment', 'lot', 'shop', 'office', 'apartment', 'flat'];
  // shuffle
  for (let i = kinds.length - 1; i > 0; i--) { const j = ri(i, 0); const t = kinds[i]; kinds[i] = kinds[j]; kinds[j] = t; }

  let k = 0;
  for (let by = 0; by < 4; by++) for (let bx = 0; bx < 4; bx++) {
    const x0 = gridPos(bx), y0 = gridPos(by);
    const kind = kinds[k++];
    blocks.push({ x: x0, y: y0, w: BLOCK, h: BLOCK, kind, cx: x0 + BLOCK / 2, cy: y0 + BLOCK / 2 });
    if (kind === 'lot') buildLot(x0, y0);
    else if (kind === 'flat') buildFlattened(x0, y0);
    else buildStructure(x0, y0, kind);
  }

  scatterStreets();
  return blocks;
}

function buildLot(x0, y0) {
  for (let y = 0; y < BLOCK; y++) for (let x = 0; x < BLOCK; x++) {
    const n = RND();
    if (n > .88) setT(x0 + x, y0 + y, T_CAR);
    else if (n > .82) setT(x0 + x, y0 + y, T_RUBBLE);
  }
}

function buildFlattened(x0, y0) {
  for (let y = 0; y < BLOCK; y++) for (let x = 0; x < BLOCK; x++) {
    const d = Math.hypot(x - 3.5, y - 3.5);
    if (RND() < .78 - d * .07) setT(x0 + x, y0 + y, T_RUBBLE);
  }
}

function buildStructure(x0, y0, kind) {
  const shell = kind === 'shop' ? T_BRICK : (kind === 'office' ? T_CONC : T_BRICK);
  // outer shell
  for (let y = 0; y < BLOCK; y++) for (let x = 0; x < BLOCK; x++) {
    const edge = (x === 0 || y === 0 || x === BLOCK - 1 || y === BLOCK - 1);
    setT(x0 + x, y0 + y, edge ? shell : T_FLOOR);
    if (!edge) inside[(y0 + y) * MAP_W + (x0 + x)] = 1;
  }

  // shopfronts along one face
  if (kind === 'shop') {
    const face = ri(3, 0);
    for (let i = 1; i < BLOCK - 1; i++) {
      let x, y;
      if (face === 0) { x = x0 + i; y = y0; } else if (face === 1) { x = x0 + i; y = y0 + BLOCK - 1; }
      else if (face === 2) { x = x0; y = y0 + i; } else { x = x0 + BLOCK - 1; y = y0 + i; }
      setT(x, y, RND() < .45 ? T_GLASSF : T_SHOP);
      if (at(x, y) === T_GLASSF) inside[y * MAP_W + x] = 1;
    }
  }

  // interior partitions
  const parts = kind === 'office' ? 3 : 2;
  for (let p = 0; p < parts; p++) {
    const horiz = RND() < .5;
    const pos = ri(BLOCK - 3, 2);
    for (let i = 1; i < BLOCK - 1; i++) {
      const x = horiz ? x0 + i : x0 + pos;
      const y = horiz ? y0 + pos : y0 + i;
      setT(x, y, RND() < .12 ? T_RUBBLE : T_DRY);
      inside[y * MAP_W + x] = 0;
    }
    // knock a doorway or two through it
    const holes = 1 + (RND() < .5 ? 1 : 0);
    for (let h = 0; h < holes; h++) {
      const i = ri(BLOCK - 2, 1);
      const x = horiz ? x0 + i : x0 + pos;
      const y = horiz ? y0 + pos : y0 + i;
      setT(x, y, T_FLOOR); inside[y * MAP_W + x] = 1;
    }
  }

  // doors punched through the shell, at least two
  for (let d = 0; d < 3; d++) {
    const face = ri(3, 0), i = ri(BLOCK - 2, 1);
    let x, y;
    if (face === 0) { x = x0 + i; y = y0; } else if (face === 1) { x = x0 + i; y = y0 + BLOCK - 1; }
    else if (face === 2) { x = x0; y = y0 + i; } else { x = x0 + BLOCK - 1; y = y0 + i; }
    setT(x, y, RND() < .3 ? T_GLASSF : T_FLOOR);
    inside[y * MAP_W + x] = 1;
  }

  // collapse damage: part of the floor plate is gone
  if (RND() < .55) {
    const cx = x0 + ri(BLOCK - 2, 1), cy = y0 + ri(BLOCK - 2, 1), rad = rf(2.6, 1.4);
    for (let y = 0; y < BLOCK; y++) for (let x = 0; x < BLOCK; x++) {
      if (Math.hypot(x0 + x - cx, y0 + y - cy) < rad && RND() < .8) {
        setT(x0 + x, y0 + y, T_RUBBLE);
      }
    }
  }
  // broken glass drifts inside the shopfronts
  for (let y = 1; y < BLOCK - 1; y++) for (let x = 1; x < BLOCK - 1; x++) {
    if (at(x0 + x, y0 + y) === T_FLOOR && RND() < .1) setT(x0 + x, y0 + y, T_GLASSF);
  }
}

function scatterStreets() {
  for (let y = 3; y < MAP_H - 3; y++) for (let x = 3; x < MAP_W - 3; x++) {
    if (at(x, y) !== T_STREET) continue;
    const n = RND();
    if (n > .955) setT(x, y, T_CAR);
    else if (n > .925) setT(x, y, T_RUBBLE);
    else if (n > .89) setT(x, y, T_GLASSF);
  }
}

/* --- connectivity --- */
function floodFrom(sx, sy) {
  const seen = new Uint8Array(MAP_W * MAP_H);
  const q = [sy * MAP_W + sx];
  seen[sy * MAP_W + sx] = 1;
  while (q.length) {
    const i = q.pop(), x = i % MAP_W, y = (i / MAP_W) | 0;
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (const [dx, dy] of nb) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;
      const j = ny * MAP_W + nx;
      if (seen[j] || SOLID[map[j]]) continue;
      seen[j] = 1; q.push(j);
    }
  }
  return seen;
}

/* Carve until every open tile is reachable from the start. Anything
   we cannot reach gets sealed so no pickup ever spawns in a pocket. */
function sealUnreachable(sx, sy) {
  const seen = floodFrom(sx, sy);
  let open = 0;
  for (let i = 0; i < map.length; i++) {
    if (!SOLID[map[i]] && !seen[i]) { map[i] = T_RUBBLE; }
    else if (!SOLID[map[i]]) open++;
  }
  return open;
}

function freeTiles(pred) {
  const out = [];
  for (let y = 2; y < MAP_H - 2; y++) for (let x = 2; x < MAP_W - 2; x++) {
    const t = at(x, y);
    if (SOLID[t]) continue;
    if (pred && !pred(x, y, t)) continue;
    out.push([x + .5, y + .5]);
  }
  return out;
}

/* A leg comes down through a block. Returns true if the collapse
   was applied; refuses any collapse that would strand the player. */
function collapseBlock(b, keepX, keepY) {
  const backup = map.slice();
  const cx = b.cx + rf(1.5, -1.5), cy = b.cy + rf(1.5, -1.5);
  const rad = rf(6.5, 4.5);
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const d = Math.hypot(x + .5 - cx, y + .5 - cy);
    if (d < rad && RND() < 1 - d / rad * .75) {
      if (x > 2 && y > 2 && x < MAP_W - 3 && y < MAP_H - 3) {
        setT(x, y, T_RUBBLE);
        inside[y * MAP_W + x] = 0;
      }
    }
  }
  if (SOLID[at(keepX | 0, keepY | 0)]) { map.set(backup); return false; }
  const seen = floodFrom(keepX | 0, keepY | 0);
  // require the checkpoint to still be reachable
  if (!seen[(CHECK.y | 0) * MAP_W + (CHECK.x | 0)]) { map.set(backup); return false; }
  return true;
}


/* ============================================================
   Every sound is synthesised. No files, no loading.
   ============================================================ */

let AC = null, MASTER = null, ambGain = null, rumbleGain = null;
let audioReady = false;

function noiseBuffer(sec) {
  const n = AC.sampleRate * sec;
  const b = AC.createBuffer(1, n, AC.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
let NB = null;

function initAudio() {
  if (audioReady) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  AC = new Ctx();
  MASTER = AC.createGain(); MASTER.gain.value = 0.9; MASTER.connect(AC.destination);
  NB = noiseBuffer(2);

  // wind through broken glazing
  const wind = AC.createBufferSource(); wind.buffer = NB; wind.loop = true;
  const wf = AC.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 420; wf.Q.value = .7;
  ambGain = AC.createGain(); ambGain.gain.value = .05;
  wind.connect(wf); wf.connect(ambGain); ambGain.connect(MASTER); wind.start();

  // the standing rumble of a city coming apart somewhere else
  const rum = AC.createBufferSource(); rum.buffer = NB; rum.loop = true;
  const rf2 = AC.createBiquadFilter(); rf2.type = 'lowpass'; rf2.frequency.value = 90; rf2.Q.value = 3;
  rumbleGain = AC.createGain(); rumbleGain.gain.value = .06;
  rum.connect(rf2); rf2.connect(rumbleGain); rumbleGain.connect(MASTER); rum.start();

  audioReady = true;
}

function env(node, peak, atk, dec, t0) {
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(peak, .0002), t0 + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + atk + dec);
  node.connect(g); g.connect(MASTER);
  return g;
}

function sfxStep(surface, vol) {
  if (!audioReady) return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = NB;
  s.playbackRate.value = 0.7 + Math.random() * .5;
  const f = AC.createBiquadFilter();
  if (surface === 'glass') { f.type = 'highpass'; f.frequency.value = 2600; }
  else if (surface === 'floor') { f.type = 'bandpass'; f.frequency.value = 520; f.Q.value = 1.2; }
  else { f.type = 'lowpass'; f.frequency.value = 900; }
  s.connect(f);
  env(f, vol * (surface === 'glass' ? .3 : .17), .004, surface === 'glass' ? .22 : .09, t);
  s.start(t); s.stop(t + .3);
}

function sfxSwing() {
  if (!audioReady) return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = NB;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2;
  f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(1800, t + .16);
  s.connect(f); env(f, .16, .01, .17, t);
  s.start(t); s.stop(t + .3);
}

function sfxHit() {
  if (!audioReady) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'square';
  o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(46, t + .12);
  env(o, .18, .004, .14, t); o.start(t); o.stop(t + .2);
  const s = AC.createBufferSource(); s.buffer = NB;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
  s.connect(f); env(f, .2, .003, .12, t); s.start(t); s.stop(t + .2);
}

function sfxScreech(dist) {
  if (!audioReady) return;
  const t = AC.currentTime, v = clamp(1 - dist / 22, 0, 1);
  if (v <= 0) return;
  const o = AC.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(880 + Math.random() * 500, t);
  o.frequency.exponentialRampToValueAtTime(180, t + .34);
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 4; f.frequency.value = 1400;
  o.connect(f); env(f, .12 * v, .012, .36, t); o.start(t); o.stop(t + .45);
  const s = AC.createBufferSource(); s.buffer = NB; s.playbackRate.value = 1.6;
  const f2 = AC.createBiquadFilter(); f2.type = 'highpass'; f2.frequency.value = 1800;
  s.connect(f2); env(f2, .07 * v, .01, .3, t); s.start(t); s.stop(t + .4);
}

function sfxHurt() {
  if (!audioReady) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'triangle';
  o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(70, t + .3);
  env(o, .2, .006, .32, t); o.start(t); o.stop(t + .4);
}

function sfxPickup() {
  if (!audioReady) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(520, t); o.frequency.linearRampToValueAtTime(760, t + .09);
  env(o, .09, .008, .12, t); o.start(t); o.stop(t + .25);
}

function sfxFlare() {
  if (!audioReady) return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = NB;
  const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2200;
  s.connect(f); env(f, .16, .02, .8, t); s.start(t); s.stop(t + 1);
}

/* the animal, close */
function sfxRoar(near) {
  if (!audioReady) return;
  const t = AC.currentTime, dur = 3.4;
  const o = AC.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(58, t);
  o.frequency.exponentialRampToValueAtTime(31, t + dur * .45);
  o.frequency.exponentialRampToValueAtTime(44, t + dur * .8);
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 240; f.Q.value = 6;
  const lfo = AC.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 5.5;
  const lg = AC.createGain(); lg.gain.value = 26;
  lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + dur);
  o.connect(f);
  const g = AC.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.34 * near, t + .5);
  g.gain.setValueAtTime(.34 * near, t + dur * .6);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  f.connect(g); g.connect(MASTER);
  o.start(t); o.stop(t + dur);

  // torn metal riding on top
  const s = AC.createBufferSource(); s.buffer = NB; s.playbackRate.value = .4;
  const f2 = AC.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 700; f2.Q.value = .8;
  s.connect(f2); env(f2, .1 * near, .4, dur * .8, t); s.start(t); s.stop(t + dur);
}

/* a foot lands */
function sfxImpact(near) {
  if (!audioReady) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(74, t); o.frequency.exponentialRampToValueAtTime(19, t + 1.1);
  env(o, .5 * near, .01, 1.3, t); o.start(t); o.stop(t + 1.5);
  const s = AC.createBufferSource(); s.buffer = NB; s.playbackRate.value = .5;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 300;
  s.connect(f); env(f, .3 * near, .02, 1.0, t); s.start(t); s.stop(t + 1.3);
}

function sfxRubble() {
  if (!audioReady) return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = NB; s.playbackRate.value = .8;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = .6;
  s.connect(f); env(f, .14, .05, 1.6, t); s.start(t); s.stop(t + 2);
}

function sfxHeart(v) {
  if (!audioReady) return;
  const t = AC.currentTime;
  for (const [d, a] of [[0, 1], [.19, .62]]) {
    const o = AC.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(64, t + d); o.frequency.exponentialRampToValueAtTime(34, t + d + .13);
    env(o, .22 * v * a, .01, .16, t + d); o.start(t + d); o.stop(t + d + .3);
  }
}

/* A human voice. Two formants over a buzzing source, which is enough
   to read as a person calling out without ever sounding like a word. */
function sfxVoice(kind, dist, pitch) {
  if (!audioReady) return;
  const v = clamp(1 - dist / 26, 0, 1);
  if (v <= 0.02) return;
  const t = AC.currentTime;
  const base = (kind === 'whimper' ? 168 : 196) * (pitch || 1);
  const dur = kind === 'call' ? .55 : kind === 'wait' ? .42 : .8;

  const o = AC.createOscillator();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(base, t);
  if (kind === 'call') {
    o.frequency.linearRampToValueAtTime(base * 1.22, t + dur * .35);
    o.frequency.linearRampToValueAtTime(base * .88, t + dur);
  } else if (kind === 'wait') {
    o.frequency.linearRampToValueAtTime(base * 1.4, t + dur * .5);
    o.frequency.linearRampToValueAtTime(base * 1.1, t + dur);
  } else {
    o.frequency.linearRampToValueAtTime(base * .78, t + dur);
  }

  // vowel formants
  const f1 = AC.createBiquadFilter(); f1.type = 'bandpass'; f1.Q.value = 7;
  f1.frequency.setValueAtTime(kind === 'whimper' ? 420 : 640, t);
  const f2 = AC.createBiquadFilter(); f2.type = 'bandpass'; f2.Q.value = 9;
  f2.frequency.setValueAtTime(kind === 'whimper' ? 1180 : 1520, t);

  const g1 = AC.createGain(), g2 = AC.createGain();
  g1.gain.value = 1; g2.gain.value = .55;
  o.connect(f1); f1.connect(g1);
  o.connect(f2); f2.connect(g2);

  const out = AC.createGain();
  out.gain.setValueAtTime(.0001, t);
  out.gain.exponentialRampToValueAtTime(.10 * v, t + .05);
  out.gain.setValueAtTime(.10 * v, t + dur * .6);
  out.gain.exponentialRampToValueAtTime(.0001, t + dur);
  g1.connect(out); g2.connect(out); out.connect(MASTER);

  // a little breath under it
  const n = AC.createBufferSource(); n.buffer = NB; n.playbackRate.value = 1.4;
  const nf = AC.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 2200; nf.Q.value = .8;
  n.connect(nf); env(nf, .022 * v, .04, dur, t);
  n.start(t); n.stop(t + dur + .1);

  o.start(t); o.stop(t + dur + .05);
}

/* a civilian being taken */
function sfxScream() {
  if (!audioReady) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(420, t);
  o.frequency.linearRampToValueAtTime(760, t + .18);
  o.frequency.exponentialRampToValueAtTime(240, t + .9);
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3.2; f.frequency.value = 900;
  const lfo = AC.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 11;
  const lg = AC.createGain(); lg.gain.value = 34;
  lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + 1);
  o.connect(f); env(f, .17, .02, .95, t); o.start(t); o.stop(t + 1.1);
}

function sfxAward() {
  if (!audioReady) return;
  const t = AC.currentTime;
  [523.25, 783.99].forEach((f, i) => {
    const o = AC.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(f, t + i * .09);
    const g = AC.createGain();
    g.gain.setValueAtTime(.0001, t + i * .09);
    g.gain.exponentialRampToValueAtTime(.05, t + i * .09 + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + i * .09 + .5);
    o.connect(g); g.connect(MASTER);
    o.start(t + i * .09); o.stop(t + i * .09 + .6);

}

let rotorNode = null;
function startRotors() {
  if (!audioReady || rotorNode) return;

      g.lineTo(bx + 14 - s, 48);

    g.closePath(); g.fill();

/* --- BFS flow field so they move like they know the block --- */
let flow = new Int16Array(MAP_W * MAP_H);
let flowGuide = new Int16Array(MAP_W * MAP_H);
let guideTiles = new Uint8Array(MAP_W * MAP_H);
let guideTarget = null;
let flowFlare = new Int16Array(MAP_W * MAP_H);
const bfsQ = new Int32Array(MAP_W * MAP_H);

function buildFlow(field, sx, sy) {
  field.fill(-1);
  sx |= 0; sy |= 0;
  if (sx < 0 || sy < 0 || sx >= MAP_W || sy >= MAP_H) return;
  // a collapse can drop rubble on the tile we are seeding from; fall back to
  // the nearest open neighbour so nothing freezes mid-pursuit
  if (SOLID[map[sy * MAP_W + sx]]) {
    let found = false;
    for (let r = 1; r <= 3 && !found; r++) {
      for (let dy = -r; dy <= r && !found; dy++) for (let dx = -r; dx <= r && !found; dx++) {
        const nx = sx + dx, ny = sy + dy;
        if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;
        if (SOLID[map[ny * MAP_W + nx]]) continue;
        sx = nx; sy = ny; found = true;
      }
    }
    if (!found) return;
  }
  let head = 0, tail = 0;
  bfsQ[tail++] = sy * MAP_W + sx;
  field[sy * MAP_W + sx] = 0;
  while (head < tail) {
    const i = bfsQ[head++], x = i % MAP_W, y = (i / MAP_W) | 0, d = field[i];
    for (let k = 0; k < 4; k++) {
      const nx = x + (k === 0 ? 1 : k === 1 ? -1 : 0);
      const ny = y + (k === 2 ? 1 : k === 3 ? -1 : 0);
      if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;
      const j = ny * MAP_W + nx;
      if (field[j] !== -1 || SOLID[map[j]]) continue;
      field[j] = d + 1; bfsQ[tail++] = j;
    }
  }
}

/* step downhill on a flow field, with a straight-line shortcut when
   the target is in the open */
function flowStep(e, field, speed, dt) {
  const cx = e.x | 0, cy = e.y | 0;
  let best = -1, bx = 0, by = 0;
  const here = field[cy * MAP_W + cx];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = cx + dx, ny = cy + dy;
    if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;
    if (dx && dy && (SOLID[map[cy * MAP_W + nx]] || SOLID[map[ny * MAP_W + cx]])) continue;
    const v = field[ny * MAP_W + nx];
    if (v < 0) continue;
    if (best < 0 || v < best) { best = v; bx = nx; by = ny; }
  }
  if (here === 0) return false;                       // already standing on the target
  if (best < 0 || (here > 0 && best >= here)) return false;
  const tx = bx + .5, ty = by + .5;
  let dx = tx - e.x, dy = ty - e.y;
  const l = Math.hypot(dx, dy) || 1;
  moveEnt(e, (dx / l) * speed * dt, (dy / l) * speed * dt, .28);
  return true;
}

function moveEnt(e, dx, dy, rad) {
  if (!isSolid(e.x + dx + Math.sign(dx) * rad, e.y)) e.x += dx;
  if (!isSolid(e.x, e.y + dy + Math.sign(dy) * rad)) e.y += dy;
}


/* ============================================================
   Renderer. Multi-hit DDA with a per-pixel depth buffer, so a
   rubble pile can hide your legs and not the tower behind it.
   ============================================================ */

let low, lowCtx, imgData, buf32, depth;
let view, vctx;

const SKY_W = 1024, SKY_H = 160;
let SKY = null;
const SKY_U = new Int32Array(RES_W);
let kaijuPixels = 0;

function buildSky() {
  SKY = new Uint32Array(SKY_W * SKY_H);
  const n = makeNoise(777), n2 = makeNoise(31);
  for (let y = 0; y < SKY_H; y++) {
    const t = y / SKY_H;                       // 0 = zenith, 1 = horizon
    for (let x = 0; x < SKY_W; x++) {
      const a = x / SKY_W * Math.PI * 2;
      // two fire fronts burning below the skyline
      let glow = 0;
      glow += Math.max(0, Math.cos(a - 0.9)) ** 7 * 1.0;
      glow += Math.max(0, Math.cos(a - 3.7)) ** 9 * 0.72;
      const hz = Math.pow(t, 2.6);
      const smoke = fbm(n, x * .012, y * .05, 4, .55);
      const smoke2 = fbm(n2, x * .04 + 5, y * .09, 3, .5);

      let r = 10 + hz * 30 + glow * hz * 190 + smoke * 16;
      let g = 11 + hz * 24 + glow * hz * 84 + smoke * 15;
      let b = 16 + hz * 26 + glow * hz * 28 + smoke * 20;
      // cloud deck lit from beneath
      const deck = clamp((smoke2 - .45) * 3, 0, 1) * (1 - t * .3);
      r = lerp(r, 30 + glow * 86, deck * .6);
      g = lerp(g, 26 + glow * 38, deck * .6);
      b = lerp(b, 33 + glow * 14, deck * .6);
      // embers
      if (fbm(n2, x * 1.9, y * 1.9, 2, .5) > .93 && t > .25) { r += 90; g += 44; b += 12; }
      SKY[y * SKY_W + x] = 0xff000000 | (clamp(b, 0, 255) << 16) | (clamp(g, 0, 255) << 8) | clamp(r, 0, 255);
    }
  }
}

function initRender(canvas) {
  view = canvas; vctx = view.getContext('2d');
  low = document.createElement('canvas'); low.width = RES_W; low.height = RES_H;
  lowCtx = low.getContext('2d');
  imgData = lowCtx.createImageData(RES_W, RES_H);
  buf32 = new Uint32Array(imgData.data.buffer);
  depth = new Float32Array(RES_W * RES_H);
  buildSky();
}

/* --- light gathering --- */
const LIGHTS = [];
function gatherLights(px, py) {
  LIGHTS.length = 0;
  const cand = [];
  for (const f of fires) { f._d2 = (f.x - px) ** 2 + (f.y - py) ** 2; if (f._d2 < 380) cand.push(f); }
  for (const f of flares) { if (f.t <= 0) continue; f._d2 = (f.x - px) ** 2 + (f.y - py) ** 2; if (f._d2 < 380) cand.push(f); }
  for (const f of windows) { f._d2 = (f.x - px) ** 2 + (f.y - py) ** 2; if (f._d2 < 380) cand.push(f); }
  cand.sort((a, b) => a._d2 - b._d2);
  for (let i = 0; i < Math.min(4, cand.length); i++) {
    const f = cand[i];
    if (f._d2 > 380) break;
    LIGHTS.push(f);
  }
}

/* warm point-light term at a world position */
function pointLight(wx, wy) {
  let s = 0;
  for (let i = 0; i < LIGHTS.length; i++) {
    const L = LIGHTS[i];
    const d2 = (L.x - wx) ** 2 + (L.y - wy) ** 2;
    s += L.power / (1 + d2 * .42);
  }
  return s;
}

const FOG_R = 15, FOG_G = 14, FOG_B = 18;
const AMBIENT = .44;
/* Surfaces open to the sky pick up the burning skyline overhead. Interiors
   do not, which is what keeps the buildings worth being afraid of. */
const SKY_BOUNCE = .40;

function renderWorld(cam) {
  kaijuPixels = 0;
  const { px, py, dirX, dirY, planeX, planeY, eye, horizon, torch } = cam;
  gatherLights(px, py);

  const camAng = Math.atan2(dirY, dirX);
  const skyBase = ((camAng / (Math.PI * 2)) % 1 + 1) % 1;

  /* ---------- sky ---------- */
  const hz = clamp(Math.floor(horizon), 0, RES_H);
  for (let x = 0; x < RES_W; x++) {
    const camXn = (2 * x / RES_W - 1);
    const ang = Math.atan2(dirY + planeY * camXn, dirX + planeX * camXn);
    SKY_U[x] = (((ang / (Math.PI * 2)) % 1 + 1) % 1 * SKY_W) | 0;
  }
  for (let y = 0; y < hz; y++) {
    const sv = clamp(Math.floor(SKY_H - 1 - (hz - y) * (SKY_H / (RES_H * .95))), 0, SKY_H - 1);
    const row = sv * SKY_W, o = y * RES_W;
    for (let x = 0; x < RES_W; x++) { buf32[o + x] = SKY[row + SKY_U[x]]; depth[o + x] = 1e9; }
  }
  for (let y = hz; y < RES_H; y++) { const o = y * RES_W; for (let x = 0; x < RES_W; x++) { buf32[o + x] = 0xff000000; depth[o + x] = 1e9; } }

  /* ---------- floor and ceiling ---------- */
  const rdx0 = dirX - planeX, rdy0 = dirY - planeY;
  const rdx1 = dirX + planeX, rdy1 = dirY + planeY;
  const fTex = FLOOR_TEX, cTex = CEIL_TEX;

  for (let y = 0; y < RES_H; y++) {
    const below = y > horizon;
    const p = below ? (y - horizon) : (horizon - y);
    if (p < 0.6) continue;
    const rowDist = below ? (PROJ * eye / p) : (PROJ * (CEIL_H - eye) / p);
    if (rowDist > MAXDIST) continue;
    const stepX = rowDist * (rdx1 - rdx0) / RES_W;
    const stepY = rowDist * (rdy1 - rdy0) / RES_W;
    let wx = px + rowDist * rdx0, wy = py + rowDist * rdy0;
    const o = y * RES_W;
    const fogT = 1 - Math.exp(-rowDist * 0.085);
    const torchD = torch / (1 + rowDist * rowDist * .045);
    const dy = (y - horizon) / RES_H;

    for (let x = 0; x < RES_W; x++, wx += stepX, wy += stepY) {
      const mx = wx | 0, my = wy | 0;
      if (mx < 0 || my < 0 || mx >= MAP_W || my >= MAP_H) continue;
      const tile = map[my * MAP_W + mx];
      let src, tint = 1;
      if (below) {
        if (SOLID[tile]) { src = fTex[0]; tint = .7; }
        else if (tile === T_FLOOR) src = fTex[1];
        else if (tile === T_GLASSF) src = fTex[2];
        else src = fTex[0];
      } else {
        if (inside[my * MAP_W + mx] !== 1) continue;      // open to the sky
        src = cTex;
      }
      const tx = ((wx - mx) * TEX) | 0, ty = ((wy - my) * TEX) | 0;
      const c = src[(ty << 6) + tx];
      let r = c & 255, g = (c >> 8) & 255, b = (c >> 16) & 255;

      const dxs = (x - RES_W * .5) / RES_W;
      const cone = clamp(1 - (dxs * dxs * 4.6 + dy * dy * 5.6), 0, 1);
      const T = torchD * cone * cone;
      const W = pointLight(wx, wy);
      const A = AMBIENT;
      const S = (below && inside[my * MAP_W + mx] !== 1) ? SKY_BOUNCE : 0;
      let R = r * (A * .78 + S * 1.0 + T + W * 1.18) * tint;
      let G = g * (A * .88 + S * .74 + T * .98 + W * .60) * tint;
      let B = b * (A * 1.0 + S * .58 + T * .92 + W * .26) * tint;
      // painted route marks, flowing toward the objective
      if (below && guideTiles[my * MAP_W + mx]) {
        const order = guideTiles[my * MAP_W + mx];
        const fx2 = wx - mx - .5, fy2 = wy - my - .5;
        const rr = fx2 * fx2 + fy2 * fy2;
        if (rr < .10) {
          // a travelling wave so the marks read as pointing somewhere
          const wave = .45 + .55 * Math.sin(order * .9 - performance.now() / 260);
          const fade = clamp(1 - order / 20, .25, 1);
          const k = wave * fade * (1 - rr / .10);
          R += 190 * k; G += 118 * k; B += 44 * k;
        }
      }

      if (below && stomps.length) {
        for (let si = 0; si < stomps.length; si++) {
          const st = stomps[si];
          const dd2 = (wx - st.x) * (wx - st.x) + (wy - st.y) * (wy - st.y);
          if (dd2 > st.r * st.r) continue;
          const dd = Math.sqrt(dd2), k = 1 - dd / st.r;
          const pulse = .5 + .5 * Math.sin(st.age * 16);
          const dark = k * .82 * (.4 + .6 * st.prog);
          R *= (1 - dark); G *= (1 - dark); B *= (1 - dark);
          if (dd > st.r * .84) { R += 130 * pulse * st.prog; G += 34 * pulse * st.prog; B += 8 * pulse * st.prog; }
        }
      }
      R = R + (FOG_R - R) * fogT; G = G + (FOG_G - G) * fogT; B = B + (FOG_B - B) * fogT;
      buf32[o + x] = 0xff000000 | (clamp(B, 0, 255) << 16) | (clamp(G, 0, 255) << 8) | clamp(R, 0, 255);
      depth[o + x] = rowDist;
    }
  }

  /* ---------- the animal ---------- */
  drawKaiju(cam);

  /* ---------- walls ---------- */
  const hits = [];
  for (let x = 0; x < RES_W; x++) {
    const camXn = 2 * x / RES_W - 1;
    const rdx = dirX + planeX * camXn, rdy = dirY + planeY * camXn;
    let mx = px | 0, my = py | 0;
    const ddx = Math.abs(1 / (rdx || 1e-9)), ddy = Math.abs(1 / (rdy || 1e-9));
    const sx = rdx < 0 ? -1 : 1, sy = rdy < 0 ? -1 : 1;
    let sdx = rdx < 0 ? (px - mx) * ddx : (mx + 1 - px) * ddx;
    let sdy = rdy < 0 ? (py - my) * ddy : (my + 1 - py) * ddy;
    let side = 0, dist = 0;
    hits.length = 0;

    for (let steps = 0; steps < 96; steps++) {
      if (sdx < sdy) { dist = sdx; sdx += ddx; mx += sx; side = 0; }
      else { dist = sdy; sdy += ddy; my += sy; side = 1; }
      if (dist > MAXDIST) break;
      if (mx < 0 || my < 0 || mx >= MAP_W || my >= MAP_H) break;
      const tile = map[my * MAP_W + mx];
      if (!SOLID[tile]) continue;
      const wall = side === 0 ? py + dist * rdy : px + dist * rdx;
      hits.push({ d: dist, tile, side, wall: wall - Math.floor(wall), mx, my });
      if (TILE_H[tile] >= H_TALL - .01) break;
      if (hits.length >= 6) break;
    }

    for (let i = hits.length - 1; i >= 0; i--) {
      const h = hits[i];
      const H = TILE_H[h.tile];
      const yTop = horizon + PROJ * (eye - H) / h.d;
      const yBot = horizon + PROJ * eye / h.d;
      let y0 = Math.max(0, Math.ceil(yTop)), y1 = Math.min(RES_H, Math.ceil(yBot));
      if (y1 <= y0) continue;
      const tex = WALL_TEX[TILE_TEX[h.tile]];
      let tx = (h.wall * TEX) | 0;
      if ((h.side === 0 && rdx > 0) || (h.side === 1 && rdy < 0)) tx = TEX - tx - 1;
      const reps = Math.max(1, Math.round(H / 2));
      const span = yBot - yTop;
      const vStep = (TEX * reps) / span;
      let vPos = (y0 - yTop) * vStep;

      const fogT = 1 - Math.exp(-h.d * 0.085);
      const shade = h.side === 1 ? .74 : 1.0;
      const W = pointLight(h.mx + .5, h.my + .5) * .9;
      const fx = h.side === 0 ? h.mx - sx : h.mx, fy = h.side === 1 ? h.my - sy : h.my;
      const openFace = (fx >= 0 && fy >= 0 && fx < MAP_W && fy < MAP_H && inside[fy * MAP_W + fx] !== 1);
      const S = openFace ? SKY_BOUNCE * (h.tile === T_DRY || h.tile === T_BOARD ? .5 : 1) : 0;
      const torchD = torch / (1 + h.d * h.d * .045);
      const dxs = (x - RES_W * .5) / RES_W;
      const coneX = dxs * dxs * 4.6;

      for (let y = y0; y < y1; y++, vPos += vStep) {
        const o = y * RES_W + x;
        const ty = ((vPos | 0) % TEX + TEX) % TEX;
        const c = tex[(ty << 6) + tx];
        let r = (c & 255) * shade, g = ((c >> 8) & 255) * shade, b = ((c >> 16) & 255) * shade;
        const dy = (y - horizon) / RES_H;
        const cone = clamp(1 - (coneX + dy * dy * 5.6), 0, 1);
        const T = torchD * cone * cone;
        const A = AMBIENT;
        let R = r * (A * .78 + S * 1.0 + T + W * 1.18);
        let G = g * (A * .88 + S * .74 + T * .98 + W * .60);
        let B = b * (A * 1.0 + S * .58 + T * .92 + W * .26);
        R = R + (FOG_R - R) * fogT; G = G + (FOG_G - G) * fogT; B = B + (FOG_B - B) * fogT;
        buf32[o] = 0xff000000 | (clamp(B, 0, 255) << 16) | (clamp(G, 0, 255) << 8) | clamp(R, 0, 255);
        depth[o] = h.d;
      }
    }
  }

  drawSprites(cam);
}

/* ---------- kaiju compositing ---------- */
function drawKaiju(cam) {
  const K = kaiju;
  if (!K.visible) return;
  const { px, py, dirX, dirY, planeX, planeY, eye, horizon } = cam;
  const rx = K.x - px, ry = K.y - py;
  const inv = 1 / (planeX * dirY - dirX * planeY);
  const tX = inv * (dirY * rx - dirX * ry);
  const tY = inv * (-planeY * rx + planeX * ry);
  if (tY < 2) return;
  const scrX = (RES_W / 2) * (1 + tX / tY);
  const hPx = PROJ * K.height / tY;
  const wPx = hPx * (KJ_W / KJ_H);
  const baseY = horizon + PROJ * eye / tY;
  const topY = baseY - hPx;
  let x0 = Math.max(0, Math.ceil(scrX - wPx / 2)), x1 = Math.min(RES_W, Math.ceil(scrX + wPx / 2));
  let y0 = Math.max(0, Math.ceil(topY)), y1 = Math.min(RES_H, Math.ceil(baseY));
  if (x1 <= x0 || y1 <= y0) return;
  const haze = clamp(1 - Math.exp(-tY * .012), 0, .82);

  for (let x = x0; x < x1; x++) {
    const sxp = (((x - (scrX - wPx / 2)) / wPx) * KJ_W) | 0;
    if (sxp < 0 || sxp >= KJ_W) continue;
    for (let y = y0; y < y1; y++) {
      const o = y * RES_W + x;
      if (depth[o] < tY) continue;
      const syp = (((y - topY) / hPx) * KJ_H) | 0;
      if (syp < 0 || syp >= KJ_H) continue;
      const c = KAIJU_PX[syp * KJ_W + sxp];
      const a = (c >>> 24) / 255;
      if (a < .04) continue;
      const dst = buf32[o];
      let r = c & 255, g = (c >> 8) & 255, b = (c >> 16) & 255;
      const dr = dst & 255, dg = (dst >> 8) & 255, db = (dst >> 16) & 255;
      // haze the silhouette back toward the sky behind it
      r = lerp(r, dr, haze); g = lerp(g, dg, haze); b = lerp(b, db, haze);
      const A = a;
      buf32[o] = 0xff000000 |
        (clamp(lerp(db, b, A), 0, 255) << 16) |
        (clamp(lerp(dg, g, A), 0, 255) << 8) |
        clamp(lerp(dr, r, A), 0, 255);
      depth[o] = tY;
      kaijuPixels++;
    }
  }
}

/* ---------- sprites ---------- */
const sprList = [];
function drawSprites(cam) {
  const { px, py, dirX, dirY, planeX, planeY, eye, horizon, torch } = cam;
  sprList.length = 0;

  for (const p of parasites) if (!p.dead) sprList.push({
    x: p.x, y: p.y, img: SPR.para[(p.state === 'lunge' || p.state === 'recoil') ? 2 : ((p.anim | 0) & 1)],
    h: .62, z: 0, glow: 0, hurt: p.hurt
  });
  for (const s of survivors) if (s.alive && s.state !== 'safe' && s.state !== 'dead') sprList.push({
    x: s.x, y: s.y, img: SPR.surv[(s.variant ? 3 : 0) + ((s.state === 'waiting' || s.cower > .5) ? 0 : 1 + ((s.anim | 0) & 1))],
    h: (s.state === 'waiting' || s.cower > .5) ? 1.05 : 1.42, z: 0, glow: 0, hurt: 0
  });
  for (const c of corpses) sprList.push({ x: c.x, y: c.y, img: SPR.body, h: .3, z: 0, glow: 0, hurt: 0 });
  for (const k of pickups) if (!k.taken) sprList.push({
    x: k.x, y: k.y, img: k.kind === 'batt' ? SPR.batt : k.kind === 'band' ? SPR.band : SPR.flare,
    h: .34, z: .04, glow: .18, hurt: 0
  });
  for (const f of flares) if (f.t > 0) sprList.push({ x: f.x, y: f.y, img: SPR.flareLit, h: .4, z: 0, glow: 1, hurt: 0 });
  for (const f of fires) sprList.push({ x: f.x, y: f.y, img: SPR.fire[(f.anim | 0) & 3], h: 1.5, z: 0, glow: 1, hurt: 0 });
  for (const w of windows) sprList.push({ x: w.x, y: w.y, img: SPR.window, h: .78, z: .72, glow: 1, hurt: 0 });
  for (const d of drops) sprList.push({ x: d.x, y: d.y, img: SPR.para[2], h: .62, z: d.z, glow: 0, hurt: 0 });
  if (walker.active) {
    for (const L of walker.legs) sprList.push({
      x: L.x, y: L.y, img: KJ_LEG, h: LEG_H, wWorld: LEG_W, z: L.lift,
      glow: 0, hurt: 0, silhouette: true
    });
    sprList.push({
      x: walker.bx, y: walker.by, img: KJ_TORSO, h: TORSO_H, wWorld: TORSO_W,
      z: LEG_H - 4, glow: 0, hurt: 0, silhouette: true
    });
  }

  for (const s of sprList) { s.d = (s.x - px) ** 2 + (s.y - py) ** 2; }
  sprList.sort((a, b) => b.d - a.d);

  const inv = 1 / (planeX * dirY - dirX * planeY);
  for (const s of sprList) {
    const rx = s.x - px, ry = s.y - py;
    const tX = inv * (dirY * rx - dirX * ry);
    const tY = inv * (-planeY * rx + planeX * ry);
    if (tY < .18) continue;
    const scrX = (RES_W / 2) * (1 + tX / tY);
    const hPx = PROJ * s.h / tY;
    const wPx = s.wWorld ? PROJ * s.wWorld / tY : hPx * (s.img.w / s.img.h);
    const baseY = horizon + PROJ * (eye - s.z) / tY;
    const topY = baseY - hPx;
    const x0 = Math.max(0, Math.ceil(scrX - wPx / 2)), x1 = Math.min(RES_W, Math.ceil(scrX + wPx / 2));
    const y0 = Math.max(0, Math.ceil(topY)), y1 = Math.min(RES_H, Math.ceil(baseY));
    if (x1 <= x0 || y1 <= y0) continue;

    const fogT = 1 - Math.exp(-tY * 0.085);
    const torchD = torch / (1 + tY * tY * .045);
    const W = pointLight(s.x, s.y);

    for (let x = x0; x < x1; x++) {
      const sxp = (((x - (scrX - wPx / 2)) / wPx) * s.img.w) | 0;
      if (sxp < 0 || sxp >= s.img.w) continue;
      const dxs = (x - RES_W * .5) / RES_W;
      const coneX = dxs * dxs * 4.6;
      for (let y = y0; y < y1; y++) {
        const o = y * RES_W + x;
        if (depth[o] < tY) continue;
        const syp = (((y - topY) / hPx) * s.img.h) | 0;
        if (syp < 0 || syp >= s.img.h) continue;
        const c = s.img.px[syp * s.img.w + sxp];
        const a = (c >>> 24) / 255;
        if (a < .08) continue;
        let r = c & 255, g = (c >> 8) & 255, b = (c >> 16) & 255;
        if (s.silhouette) {
          // reads against the sky, not lit by anything you are carrying
          const haze = clamp(1 - Math.exp(-tY * .011), 0, .80);
          const dst0 = buf32[o];
          r = lerp(r, dst0 & 255, haze);
          g = lerp(g, (dst0 >> 8) & 255, haze);
          b = lerp(b, (dst0 >> 16) & 255, haze);
        } else if (s.glow < 1) {
          const dy = (y - horizon) / RES_H;
          const cone = clamp(1 - (coneX + dy * dy * 5.6), 0, 1);
          const T = torchD * cone * cone;
          const A = AMBIENT;
          const S = (inside[((s.y | 0) * MAP_W + (s.x | 0))] !== 1) ? SKY_BOUNCE * .8 : 0;
          let R = r * (A * .78 + S + T + W * 1.18 + s.glow);
          let G = g * (A * .88 + S * .74 + T * .98 + W * .60 + s.glow);
          let B = b * (A * 1.0 + S * .58 + T * .92 + W * .26 + s.glow);
          if (s.hurt > 0) { R += 90 * s.hurt; G += 10 * s.hurt; }
          r = R + (FOG_R - R) * fogT; g = G + (FOG_G - G) * fogT; b = B + (FOG_B - B) * fogT;
        } else {
          const f2 = fogT * .5;
          r = r + (FOG_R - r) * f2; g = g + (FOG_G - g) * f2; b = b + (FOG_B - b) * f2;
        }
        const dst = buf32[o];
        const dr = dst & 255, dg = (dst >> 8) & 255, db = (dst >> 16) & 255;
        buf32[o] = 0xff000000 |
          (clamp(lerp(db, b, a), 0, 255) << 16) |
          (clamp(lerp(dg, g, a), 0, 255) << 8) |
          clamp(lerp(dr, r, a), 0, 255);
        if (a > .5) depth[o] = tY;
        if (s.silhouette && a > .5) kaijuPixels++;
      }
    }
  }
}

function present() {
  lowCtx.putImageData(imgData, 0, 0);
  vctx.imageSmoothingEnabled = true;
  vctx.drawImage(low, 0, 0, view.width, view.height);
}


/* ============================================================
   The hour itself.
   ============================================================ */

const P = {
  x: 0, y: 0, ang: 0, pitch: 0,
  hp: 100, bleed: 0, stam: 100,
  batt: 100, torch: true,
  flares: 2, bands: 1,
  crouch: false, sprint: false,
  bob: 0, step: 0, swing: -1, swingT: 0,
  hurtFlash: 0, dead: false
};

let CHECK = { x: 24.5, y: 24.5 };
let kaiju = { x: 0, y: 0, height: 170, visible: true, ang: 0, dist: 200, state: 'far', t: 0 };

/* --- the walkthrough: legs you can actually be standing under --- */
const LEG_H = 62, LEG_W = 9.5, TORSO_H = 108, TORSO_W = 48;
const STANCE = 8.5, STEP_PERIOD = 2.6, TELEGRAPH = 1.9;
const FOOT_KILL = 3.0, FOOT_HURT = 6.0, FOOT_BLOCK = 3.4;
let walker = { active: false, bx: 0, by: 0, dx: 1, dy: 0, speed: 5.6, legs: [], which: 0, stepT: 0, dropT: 0 };
const DROP_EVERY = 5.0, DROP_STUN = 1.3;
let stomps = [];

let clock = TUNE.RUN_TIME;
let saved = 0, met = 0, lost = 0;
let grace = TUNE.GRACE;
let cause = '';
let paused = false;
let quakeT = 26, quakeLevel = 0, shake = 0, dust = 0;
let birdDown = false, boarded = false, ending = null;
let birdETA = 0;
let prompt = '', promptT = 0;
let msg = '', msgT = 0;
let flowT = 0;
let started = false;

const keys = {};

/* ---------- setup ---------- */
function newRun() {
  // the chosen run decides how many people and how long
  TUNE.SURVIVORS = DIF.survivors;
  TUNE.RUN_TIME = DIF.runTime;
  let street = [], indoor = [];

  // Regenerate until the district is one connected space with room to work in.
  for (let attempt = 0; attempt < 12; attempt++) {
    genCity((Math.random() * 1e9) | 0);

    // staging point on a street intersection near the middle
    const gx = gridPos(1) + BLOCK, gy = gridPos(1) + BLOCK;
    CHECK = { x: gx + 1.5, y: gy + 1.5 };
    for (let y = -2; y <= 3; y++) for (let x = -2; x <= 3; x++) {
      const cx = (gx + x) | 0, cy = (gy + y) | 0;
      if (cx < 3 || cy < 3 || cx > MAP_W - 4 || cy > MAP_H - 4) continue;
      setT(cx, cy, T_STREET);
      inside[cy * MAP_W + cx] = 0;
    }

    // everything not reachable from the pad gets sealed, so nothing spawns in a pocket
    sealUnreachable(CHECK.x | 0, CHECK.y | 0);
    street = freeTiles((x, y) => inside[y * MAP_W + x] !== 1);
    indoor = freeTiles((x, y) => inside[y * MAP_W + x] === 1);
    if (street.length > 300 && indoor.length > 110) break;
  }

  // start on the far side of the district, on a street, in that same space
  let start = street[0], far = -1;
  for (const t of street) {
    const d = Math.hypot(t[0] - CHECK.x, t[1] - CHECK.y) + rf(3);
    if (d > far) { far = d; start = t; }
  }
  P.x = start[0]; P.y = start[1];
  P.ang = Math.atan2(CHECK.y - P.y, CHECK.x - P.x);
  P.pitch = 0; P.hp = 100; P.bleed = 0; P.stam = 100;
  P.batt = 100; P.torch = true; P.flares = DIF.flares; P.bands = DIF.bands; P.dead = false; P.swing = -1; P.iframe = 0; P.radio = 0; P.radioLock = null; P.radioWarn = 0;
  P.reserve = true; P.firstBlood = true; P.firstChase = true;
  P.usedRadio = false; P.usedFlare = false; P.usedCrouch = false; P.escortHint = 0;

  parasites = []; survivors = []; pickups = []; fires = []; flares = []; corpses = [];
  saved = 0; met = 0; lost = 0; grace = DIF.grace; cause = '';
  clock = TUNE.RUN_TIME; quakeT = 26; quakeLevel = 0; shake = 0;
  birdDown = false; boarded = false; ending = null; birdETA = 0;
  walker.active = false; stomps = []; windows = []; drops = [];

  shuffle(indoor); shuffle(street);

  // survivors, indoors, spread out
  let placed = 0;
  for (const t of indoor) {
    if (placed >= TUNE.SURVIVORS) break;
    if (Math.hypot(t[0] - P.x, t[1] - P.y) < 9) continue;
    if (Math.hypot(t[0] - CHECK.x, t[1] - CHECK.y) < 8) continue;
    if (survivors.some(s => Math.hypot(s.x - t[0], s.y - t[1]) < 11)) continue;
    const s = {
      x: t[0], y: t[1], state: 'waiting', anim: 0, panic: 0, voice: rf(4),
      alive: true, variant: placed & 1,
      // everyone holds up differently
      nerve: rf(1.0, 0.25),          // 0 bolts at everything, 1 stays put
      pace: rf(1.12, 0.86),          // how fast they can actually move
      pitch: rf(1.35, 0.78),         // voice
      hesitate: 0, cower: 0, limp: 0, lastInside: -1, callT: rf(5, 2)
    };
    s.win = findWindow(t[0], t[1]);
    survivors.push(s); placed++;
  }

  // supplies
  const kinds = ['batt', 'batt', 'band', 'band', 'band', 'flare', 'flare', 'flare', 'batt', 'band', 'flare', 'batt'];
  let ki = 0;
  for (const t of indoor) {
    if (ki >= kinds.length) break;
    if (pickups.some(k => Math.hypot(k.x - t[0], k.y - t[1]) < 6)) continue;
    if (survivors.some(s2 => Math.hypot(s2.x - t[0], s2.y - t[1]) < 3)) continue;
    pickups.push({ x: t[0], y: t[1], kind: kinds[ki++], taken: false });
  }
  let sp = 0;
  for (const t of street) {
    if (sp >= 4) break;
    if (Math.hypot(t[0] - CHECK.x, t[1] - CHECK.y) < 5) continue;
    if (pickups.some(k => Math.hypot(k.x - t[0], k.y - t[1]) < 6)) continue;
    pickups.push({ x: t[0], y: t[1], kind: sp & 1 ? 'flare' : 'band', taken: false });
    sp++;
  }

  // burning wreckage, and the staging point's oil drums
  for (let i = 0; i < 10; i++) {
    const t = street[(i * 13 + 5) % street.length];
    if (Math.hypot(t[0] - CHECK.x, t[1] - CHECK.y) < 5) continue;
    fires.push({ x: t[0], y: t[1], anim: rf(4), power: rf(1.0, .5) });
  }
  for (const d of [[-1.6, -1.6], [1.9, -1.6], [-1.6, 1.9], [1.9, 1.9]])
    fires.push({ x: CHECK.x + d[0], y: CHECK.y + d[1], anim: rf(4), power: 1.15 });

  // the small ones, already in the walls
  const placeNests = (pool, count, minFromPlayer) => {
    let n = 0;
    for (const t of pool) {
      if (n >= count) break;
      if (Math.hypot(t[0] - P.x, t[1] - P.y) < minFromPlayer) continue;
      if (Math.hypot(t[0] - CHECK.x, t[1] - CHECK.y) < 7) continue;
      if (parasites.some(q => Math.hypot(q.x - t[0], q.y - t[1]) < 9)) continue;
      spawnParasite(t[0], t[1]); n++;
    }
  };
  placeNests(indoor, 5, 18);
  placeNests(street, 2, 20);

  for (let i = 0; i < 5; i++) {
    const t = street[(i * 31 + 3) % street.length];
    corpses.push({ x: t[0], y: t[1] });
  }

  kaiju.dist = 200; kaiju.ang = rf(Math.PI * 2); kaiju.state = 'far'; kaiju.t = 0;
  updateKaijuPos();
  buildFlow(flow, P.x, P.y);
  buildGuide();
  resetStats();
  say('FIVE PEOPLE ARE STILL IN THESE BLOCKS. BRING THEM TO THE PAD.', 6, 'obj');
  // hand them the nearest voice for free, so the run opens with a direction
  {
    let best = null, bd = 1e9;
    for (const s2 of survivors) {
      const d2 = Math.hypot(s2.x - P.x, s2.y - P.y);
      if (d2 < bd) { bd = d2; best = s2; }
    }
    if (best) P.radioLock = { x: best.x, y: best.y, t: 30 };
  }
}

/* Find a spot just outside a street-facing wall of the building this
   person is sheltering in. That is where their lamp shows. */
function findWindow(sx, sy) {
  let best = null, bestD = 1e9;
  for (let r = 1; r <= 7; r++) {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      const wx = (sx + dx) | 0, wy = (sy + dy) | 0;
      if (wx < 2 || wy < 2 || wx >= MAP_W - 2 || wy >= MAP_H - 2) continue;
      const t = at(wx, wy);
      if (t !== T_BRICK && t !== T_CONC && t !== T_SHOP) continue;
      // the tile on the far side has to be open street, not another room
      for (const [ox, oy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const ax = wx + ox, ay = wy + oy;
        if (SOLID[at(ax, ay)]) continue;
        if (inside[ay * MAP_W + ax] === 1) continue;
        const d = Math.hypot(ax + .5 - sx, ay + .5 - sy);
        if (d < bestD) { bestD = d; best = { x: wx + .5 + ox * .60, y: wy + .5 + oy * .60 }; }
      }
    }
    if (best) break;
  }
  return best;
}

function refreshWindows(dt) {
  windows.length = 0;
  for (const s of survivors) {
    if (!s.alive || s.state !== 'waiting' || !s.win) continue;
    s.winT = (s.winT || rf(6)) + dt;
    // a slow breath, with the occasional guttering
    const breath = .78 + .22 * Math.sin(s.winT * 1.5);
    const gutter = (Math.sin(s.winT * 7.3) > .93) ? .45 : 1;
    windows.push({ x: s.win.x, y: s.win.y, power: 1.05 * breath * gutter });
  }
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = ri(i, 0); const t = a[i]; a[i] = a[j]; a[j] = t; } }
let msgs = [];
function say(t, d, kind) {
  msgs.unshift({ text: t, t: d || 3, dur: d || 3, kind: kind || 'obj' });
  if (msgs.length > 3) msgs.length = 3;
  msg = t; msgT = d || 3;
}

/* ---------- noise ---------- */
function emitNoise(x, y, radius) {
  if (grace > 0) radius *= .25;
  for (const p of parasites) {
    if (p.dead) continue;
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < radius) { p.alert = 1; p.tx = x; p.ty = y; if (p.state === 'dormant') { p.state = 'hunt'; p.t = 0; if (d < 12) sfxScreech(d); } }
  }
}

function los(ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const n = Math.ceil(Math.hypot(dx, dy) * 3);
  for (let i = 1; i < n; i++) {
    const t = i / n;
    if (isSolid(ax + dx * t, ay + dy * t)) return false;
  }
  return true;
}

/* ---------- kaiju ---------- */
function updateKaijuPos() {
  kaiju.x = MAP_W / 2 + Math.cos(kaiju.ang) * kaiju.dist;
  kaiju.y = MAP_H / 2 + Math.sin(kaiju.ang) * kaiju.dist;
}

function updateKaiju(dt) {
  const K = kaiju;
  K.t += dt;
  if (K.state === 'far') {
    K.ang += dt * 0.035;
    K.dist = 200 + Math.sin(K.t * .13) * 35;
    quakeLevel = Math.max(0, quakeLevel - dt * .5);
    quakeT -= dt;
    if (quakeT <= 0) { K.state = 'warn'; K.t = 0; sfxRoar(.55); say('IT IS COMING BACK THROUGH. GET UNDER SOMETHING.', 6, 'danger'); }
  } else if (K.state === 'warn') {
    // walk it around toward the player so the approach happens where they can see it
    const want = Math.atan2(P.y - MAP_H / 2, P.x - MAP_W / 2);
    let da = ((want - K.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    K.ang += clamp(da, -dt * .30, dt * .30);
    K.dist = lerp(K.dist, 105, dt * .35);
    quakeLevel = clamp(K.t / 9, 0, 1) * .5;
    shake = Math.max(shake, quakeLevel * .35);
    dust = clamp(K.t / 9, 0, 1);
    if (K.t > 9) { K.state = 'pass'; K.t = 0; K.stepT = 0; K.steps = 0; startWalk(); startPass(); }
  } else if (K.state === 'pass') {
    quakeLevel = .58 + Math.sin(K.t * 3) * .12;
    updateWalk(dt);
    // masonry keeps coming off the facades the whole time you are outside
    K.stepT -= dt;
    if (K.stepT <= 0) {
      K.stepT = 1.9;
      if (!isInside(P.x, P.y)) {
        const cover = P.crouch ? .35 : 1;
        if (RND() < .40 * cover) { damage(7 + rf(8), 'debris'); say('FALLING MASONRY. FIND A DOORWAY.', 3, 'danger'); }
      }
      emitNoise(P.x + rf(6, -6), P.y + rf(6, -6), 14);
    }
    if (!walker.active || K.t > 22) { K.state = 'recede'; K.t = 0; walker.active = false; stomps = []; sfxRoar(.9); }
  } else {
    K.dist = lerp(K.dist, 200, dt * .12);
    quakeLevel = Math.max(0, quakeLevel - dt * .3);
    dust = Math.max(0, dust - dt * .25);
    if (K.t > 8) { K.state = 'far'; K.t = 0; quakeT = rf(TUNE.QUAKE_MAX, TUNE.QUAKE_MIN); }
  }
  if (K.state !== 'pass') updateKaijuPos();
  K.visible = (K.state !== 'pass');
  setAmb(quakeLevel, clamp(1 - P.hp / 100, 0, 1));
}

function startWalk() {
  // aim the walk so it crosses the district somewhere near the player,
  // but never straight through the pad
  const ang = Math.atan2(P.y - MAP_H / 2, P.x - MAP_W / 2) + rf(1.1, -1.1) + Math.PI;
  walker.dx = Math.cos(ang); walker.dy = Math.sin(ang);
  const px2 = -walker.dy, py2 = walker.dx;
  const off = rf(9, -9);
  const cx = MAP_W / 2 + px2 * off, cy = MAP_H / 2 + py2 * off;
  walker.bx = cx - walker.dx * 44;
  walker.by = cy - walker.dy * 44;
  walker.active = true;
  walker.which = 0;
  walker.stepT = 0.35;
  walker.dropT = 1.6;
  drops = [];
  walker.legs = [-1, 1].map(side => ({
    side, lift: 0, swing: -1,
    // start each leg at the phase it would be in mid-stride: the one that
    // steps first is trailing, the other is still out front
    x: walker.bx + px2 * side * STANCE + walker.dx * (side < 0 ? -7.7 : 6.8),
    y: walker.by + py2 * side * STANCE + walker.dy * (side < 0 ? -7.7 : 6.8),
    fromX: 0, fromY: 0, toX: 0, toY: 0, planted: true
  }));
  stomps = [];
}

function updateWalk(dt) {
  if (!walker.active) return;
  const W = walker;
  W.bx += W.dx * W.speed * dt;
  W.by += W.dy * W.speed * dt;
  const px2 = -W.dy, py2 = W.dx;

  for (const st of stomps) { st.age += dt; st.prog = clamp(st.age / TELEGRAPH, 0, 1); }

  for (const L of W.legs) {
    if (L.swing < 0) continue;
    L.swing += dt / TELEGRAPH;
    const t = clamp(L.swing, 0, 1);
    const e = t * t * (3 - 2 * t);
    L.x = lerp(L.fromX, L.toX, e);
    L.y = lerp(L.fromY, L.toY, e);
    L.lift = Math.sin(t * Math.PI) * 15;
    if (L.swing >= 1) {
      L.swing = -1; L.lift = 0; L.planted = true;
      footfall(L.x, L.y);
      stomps = stomps.filter(st => st.leg !== L);
    }
  }

  W.stepT -= dt;
  if (W.stepT <= 0) {
    W.stepT = STEP_PERIOD;
    const L = W.legs[W.which];
    W.which = 1 - W.which;
    L.fromX = L.x; L.fromY = L.y;
    // Each leg steps once per two step-periods, so the stride has to cover
    // everything the body travels in that time or the feet fall behind it.
    // Plant half a plant-phase ahead, and add the ground the body covers
    // while the leg is still in the air.
    const cycle = 2 * STEP_PERIOD;
    const plantTravel = W.speed * (cycle - TELEGRAPH);
    const stride = plantTravel / 2 + W.speed * TELEGRAPH;
    L.toX = W.bx + W.dx * stride + px2 * L.side * STANCE;
    L.toY = W.by + W.dy * stride + py2 * L.side * STANCE;
    L.swing = 0; L.planted = false;
    stomps.push({ x: L.toX, y: L.toY, r: FOOT_KILL, age: 0, prog: 0, leg: L });
    sfxRubble();
  }

  // it sheds them as it goes, and they land in front of it
  W.dropT -= dt;
  if (W.dropT <= 0) {
    W.dropT = DROP_EVERY;
    for (let a = 0; a < 24; a++) {
      const lead = rf(26, 13);
      const lat = rf(9, -9);
      const dx2 = W.bx + W.dx * lead + px2 * lat;
      const dy2 = W.by + W.dy * lead + py2 * lat;
      if (dx2 < 3 || dy2 < 3 || dx2 > MAP_W - 4 || dy2 > MAP_H - 4) continue;
      if (isSolid(dx2, dy2)) continue;
      if (Math.hypot(dx2 - P.x, dy2 - P.y) < 5) continue;
      if (parasites.some(q => !q.dead && Math.hypot(q.x - dx2, q.y - dy2) < 6)) continue;
      drops.push({ x: dx2, y: dy2, z: 46 + rf(14), vz: 0 });
      break;
    }
  }
  for (const d of drops) {
    d.vz -= 34 * dt;
    d.z += d.vz * dt;
    if (d.z <= 0) {
      d.z = 0; d.landed = true;
      spawnParasite(d.x, d.y, 'stunned');
      sfxScreech(Math.hypot(d.x - P.x, d.y - P.y));
      sfxRubble();
      shake = Math.max(shake, .35);
    }
  }
  drops = drops.filter(d => !d.landed);

  // walked clear of the district
  if (Math.hypot(W.bx - MAP_W / 2, W.by - MAP_H / 2) > 52 &&
    (W.bx - MAP_W / 2) * W.dx + (W.by - MAP_H / 2) * W.dy > 0) {
    walker.active = false; stomps = []; drops = [];
  }
}

/* a foot lands */
function footfall(fx, fy) {
  sfxImpact(1);
  shake = 1.0;
  const d = Math.hypot(P.x - fx, P.y - fy);
  if (d < FOOT_KILL) {
    P.hp = 0; P.dead = true; ending = 'crushed'; cause = 'Caught under a foot in the open street.';
  } else if (d < FOOT_HURT) {
    if (d < FOOT_KILL + 2 && runStats) runStats.threaded = true;
    damage(26 + rf(14), 'debris');
    say('IT CAME DOWN BESIDE YOU. MOVE.', 3, 'danger');
  }

  // flatten what it landed on
  const backup = map.slice();
  for (let y = (fy - FOOT_KILL - 1) | 0; y <= (fy + FOOT_KILL + 1) | 0; y++) {
    for (let x = (fx - FOOT_KILL - 1) | 0; x <= (fx + FOOT_KILL + 1) | 0; x++) {
      if (x < 3 || y < 3 || x > MAP_W - 4 || y > MAP_H - 4) continue;
      if (Math.hypot(x + .5 - fx, y + .5 - fy) > FOOT_KILL) continue;
      setT(x, y, T_RUBBLE);
      inside[y * MAP_W + x] = 0;
    }
  }
  // never let a footprint seal the player away from the pad
  if (SOLID[at(P.x | 0, P.y | 0)] || !floodFrom(P.x | 0, P.y | 0)[(CHECK.y | 0) * MAP_W + (CHECK.x | 0)]) {
    map.set(backup);
  } else {
    buildFlow(flow, P.x, P.y);
  }

  for (const s2 of survivors) {
    if (!s2.alive || s2.state === 'safe') continue;
    if (Math.hypot(s2.x - fx, s2.y - fy) < FOOT_KILL) { s2.alive = false; lost++; corpses.push({ x: s2.x, y: s2.y }); say('WE LOST ONE.', 4, 'loss'); }
  }
  for (const p of parasites) if (Math.hypot(p.x - fx, p.y - fy) < FOOT_KILL) p.dead = true;
  if (RND() < .7) fires.push({ x: fx + rf(3, -3), y: fy + rf(3, -3), anim: rf(4), power: rf(1.1, .6) });
}

/* a planted foot is a wall that was not there a second ago */
function legBlocks(x, y) {
  if (!walker.active) return false;
  for (const L of walker.legs) {
    if (!L.planted) continue;
    if (Math.hypot(L.x - x, L.y - y) < FOOT_BLOCK) return true;
  }
  return false;
}

function startPass() {
  // a leg comes down through a block, and whatever was nesting in it comes out
  const cand = blocks.filter(b => Math.hypot(b.cx - P.x, b.cy - P.y) > 9 && Math.hypot(b.cx - CHECK.x, b.cy - CHECK.y) > 9);
  if (!cand.length) return;
  const b = cand[ri(cand.length - 1, 0)];
  if (collapseBlock(b, P.x, P.y)) {
    sfxRubble();
    for (let i = 0; i < 3; i++) fires.push({ x: b.cx + rf(3, -3), y: b.cy + rf(3, -3), anim: rf(4), power: rf(1.1, .6) });
    let n = 0;
    for (let i = 0; i < 30 && n < 3; i++) {
      const x = b.cx + rf(6, -6), y = b.cy + rf(6, -6);
      if (x < 2 || y < 2 || x > MAP_W - 2 || y > MAP_H - 2) continue;
      if (isSolid(x, y)) continue;
      spawnParasite(x, y); n++;
    }
    // anyone still in that building is gone
    for (const s of survivors) if (s.state === 'waiting' && Math.hypot(s.x - b.cx, s.y - b.cy) < 5.5) { s.alive = false; lost++; }
  }
}

/* The first time one of them commits to you, say plainly why, so the
   first loss reads as cause and effect rather than bad luck. */
function onFirstChase() {
  if (!P.firstChase) return;
  P.firstChase = false;
  const why = P.sprint ? 'IT HEARD YOU RUNNING.'
    : P.torch ? 'IT SAW YOUR LAMP.'
      : 'IT HEARD YOU.';
  say(why + ' CROUCH TO GO QUIET, OR SWING.', 5.5, 'warn');
}

/* You can bring the bird in whenever you like. Doing it early means
   leaving whoever is still out there, which is the whole decision. */
function signalBird(auto) {
  if (birdDown || birdETA > 0) return;
  if (!auto && Math.hypot(CHECK.x - P.x, CHECK.y - P.y) > 3.4) {
    say('YOU HAVE TO BE ON THE PAD TO SIGNAL.', 3, 'warn');
    return;
  }
  birdETA = 18;
  startRotors();
  if (auto) say('EVERYONE IS ACCOUNTED FOR. THE BIRD IS TURNING IN.', 6, 'obj');
  else say('FLARE UP. THE BIRD IS TURNING IN. HOLD THE PAD.', 6, 'obj');
}

/* ---------- damage ---------- */
function damage(amt, src) {
  if (P.dead) return;
  if (src === 'bite') {
    if (P.iframe > 0) return;
    P.iframe = TUNE.IFRAME;
    if (P.firstBlood) {
      P.firstBlood = false;
      amt *= .45;
      say('IT BIT YOU. BACK OFF AND SWING, OR DROP A FLARE.', 5, 'warn');
    }
  }
  P.hp -= amt;
  P.hurtFlash = 1;
  sfxHurt();
  if (src === 'bite' && RND() < .6) P.bleed = 1;
  if (P.hp <= 0) { P.hp = 0; P.dead = true; ending = 'dead'; cause = src === 'bite' ? 'Bled out under one of the small ones.' : 'Killed by falling structure.'; }
}

/* ---------- entity updates ---------- */
function updateParasites(dt) {
  // Only so many commit at once. The rest hang back and circle, which
  // keeps a bad moment from becoming an unwinnable one.
  let committed = 0;
  for (const p of parasites) if (!p.dead && (p.state === 'chase' || p.state === 'lunge' || p.state === 'recoil')) committed++;

  for (const p of parasites) {
    if (p.dead) continue;
    p.anim += dt * (p.state === 'chase' ? 14 : 6);
    p.hurt = Math.max(0, p.hurt - dt * 3);
    p.cd = Math.max(0, p.cd - dt);
    p.t += dt;

    // a foot on the way down clears the street of everything, including them
    let flee = null;
    for (const st of stomps) {
      if (Math.hypot(st.x - p.x, st.y - p.y) < st.r + 3.5) { flee = st; break; }
    }
    if (flee) {
      const a = Math.atan2(p.y - flee.y, p.x - flee.x);
      moveEnt(p, Math.cos(a) * TUNE.PARA_SPEED * 1.15 * dt, Math.sin(a) * TUNE.PARA_SPEED * 1.15 * dt, .28);
      if (p.state === 'chase' || p.state === 'lunge') { p.state = 'hunt'; p.t = 0; }
      p.anim += dt * 16;
      continue;
    }

    const d = Math.hypot(P.x - p.x, P.y - p.y);
    const seen = d < (P.torch ? 13 : 7.5) && los(p.x, p.y, P.x, P.y);

    // a lit flare pulls them off you
    let bait = null, bd = 1e9;
    for (const f of flares) if (f.t > 0) { const fd = Math.hypot(f.x - p.x, f.y - p.y); if (fd < 13 && fd < bd) { bd = fd; bait = f; } }

    if (bait && p.state !== 'attack') {
      if (bd > 1.4) flowStep(p, flowFlare, TUNE.PARA_SPEED * .8, dt);
      else { p.x += rf(.4, -.4) * dt; p.y += rf(.4, -.4) * dt; }
      p.state = 'hunt';
      continue;
    }

    // nothing commits to you while you are still getting your bearings
    if (grace > 0 && p.state !== 'stunned') { p.state = 'dormant'; p.t = 0; continue; }

    const settling = clock > TUNE.RUN_TIME - 25;
    const early = DIF.alwaysEarly || clock > TUNE.RUN_TIME - TUNE.EARLY;
    const budget = early ? 1 : DIF.chasers;
    if (p.state === 'stunned') {
      // it picks itself up where it landed. It does not know where you are
      // yet, which is what makes them a hazard on the route rather than a chase.
      if (p.t > DROP_STUN) { p.state = 'dormant'; p.t = 0; sfxScreech(d); }
      continue;
    }
    if (p.state === 'dormant') {
      if (seen && d < (settling ? 4 : 9) && committed < budget) { p.state = 'chase'; committed++; sfxScreech(d); onFirstChase(); }
    } else if (p.state === 'hunt') {
      flowStep(p, flow, TUNE.PARA_SPEED * .55, dt);
      if (seen && !(settling && d > 5) && committed < budget) { p.state = 'chase'; committed++; p.t = 0; sfxScreech(d); onFirstChase(); }
      else if (p.t > 8) { p.state = 'dormant'; p.t = 0; }
    } else if (p.state === 'chase') {
      if (d > 1.25) { flowStep(p, flow, TUNE.PARA_SPEED, dt); p.t = 0; }
      else if (p.cd <= 0) { p.state = 'lunge'; p.t = 0; p.cd = 3.4; }
      if (!seen && p.t > 5.5) { p.state = 'hunt'; p.t = 0; }
    } else if (p.state === 'lunge') {
      if (p.t > .22) {
        if (d < 1.7) damage(DIF.dmg + rf(5), 'bite');
        p.state = 'recoil'; p.t = 0;
      }
    } else if (p.state === 'recoil') {
