      // it darts back out of reach before coming again
      const a = Math.atan2(p.y - P.y, p.x - P.x);
      moveEnt(p, Math.cos(a) * 3.4 * dt, Math.sin(a) * 3.4 * dt, .28);
      if (p.t > 1.25) { p.state = 'chase'; p.t = 0; }
    }
  }
  parasites = parasites.filter(p => !p.dead || p.hurt > 0);
}

function updateSurvivors(dt) {
  for (const s of survivors) {
    if (!s.alive || s.state === 'safe') continue;
    s.voice -= dt;
    s.callT -= dt;
    s.hesitate = Math.max(0, s.hesitate - dt);
    const d = Math.hypot(P.x - s.x, P.y - s.y);

    let near = 1e9, nearP = null;
    for (const p of parasites) {
      if (p.dead) continue;
      const pd = Math.hypot(p.x - s.x, p.y - s.y);
      if (pd < near) { near = pd; nearP = p; }
    }

    if (s.state === 'waiting') {
      s.anim += dt * 2;
      // they call out when they think someone is close enough to hear
      if (s.voice <= 0 && d < 16) {
        s.voice = rf(7, 3.5);
        sfxVoice('call', d, s.pitch);
        emitNoise(s.x, s.y, 5);
      }
      continue;
    }

    /* ---------- following ---------- */

    // fear scales with nerve: the steady ones hold, the frightened bolt
    const spooked = near < 4 + (1 - s.nerve) * 5;
    s.panic = spooked ? 1 : Math.max(0, s.panic - dt * .5);

    // during a walkthrough they stop and get low unless you are right there
    const overhead = kaiju.state === 'pass' || kaiju.state === 'warn';
    s.cower = (overhead && d > 3.5) ? Math.min(1, s.cower + dt * 2) : Math.max(0, s.cower - dt * 2);
    if (s.cower > .5 && s.voice <= 0) { s.voice = rf(4, 2); sfxVoice('whimper', d, s.pitch); }

    const dc = Math.hypot(CHECK.x - s.x, CHECK.y - s.y);
    if (dc < 3.2) {
      s.state = 'safe'; saved++;
      sfxVoice('call', 2, s.pitch);
      say('ONE MORE THROUGH THE LINE. ' + saved + ' OF ' + TUNE.SURVIVORS + '.', 4, 'obj');
      sfxPickup();
      continue;
    }

    // they will not walk out of cover into an open street without a beat
    // to think about it, and the more frightened they are the longer it takes
    const inNow = isInside(s.x, s.y) ? 1 : 0;
    if (s.lastInside === 1 && inNow === 0 && s.hesitate <= 0 && !s.stepped) {
      s.hesitate = (1 - s.nerve) * rf(.9, .3);
      s.stepped = true;
    }
    if (inNow === 1) s.stepped = false;
    s.lastInside = inNow;

    // how quickly they are willing to move right now
    const follow = 2.3;                       // the gap they try to hold
    let sp = 0;
    if (s.cower > .5) sp = 0;
    else if (s.hesitate > 0) sp = 0;
    else if (s.panic > 0) sp = 3.5 * s.pace;
    else if (P.crouch) sp = 1.45 * s.pace;    // they match you: low and slow
    else if (d > follow + 2.5) sp = 3.1 * s.pace;
    else if (d > follow) sp = 2.35 * s.pace;
    if (s.limp > 0) sp *= .62;

    // a frightened one with nothing left will break away from the threat
    // instead of toward you, which is how people actually get lost
    if (s.panic > 0 && s.nerve < .45 && nearP && near < 2.4) {
      const a = Math.atan2(s.y - nearP.y, s.x - nearP.x);
      moveEnt(s, Math.cos(a) * 3.4 * s.pace * dt, Math.sin(a) * 3.4 * s.pace * dt, .28);
      if (RND() < dt * 3) { emitNoise(s.x, s.y, 12); sfxVoice('whimper', d, s.pitch); }
    } else if (sp > 0) {
      flowStep(s, flow, sp, dt);
      if (s.panic > 0 && RND() < dt * 1.6) emitNoise(s.x, s.y, 10);
    }

    // walking animation only while they are actually walking
    s.anim += dt * (sp > 0 ? 5 + sp * 1.6 : 0);
    s.moving = sp > 0;

    // and they get out of your way rather than being walked through
    if (d < 1.15 && s.cower <= .5) {
      const a = Math.atan2(s.y - P.y, s.x - P.x);
      moveEnt(s, Math.cos(a) * 1.7 * dt, Math.sin(a) * 1.7 * dt, .28);
    }

    // don't let them stack into one another
    for (const o of survivors) {
      if (o === s || !o.alive || o.state !== 'following') continue;
      const od = Math.hypot(o.x - s.x, o.y - s.y);
      if (od > .001 && od < 1.1) {
        const a = Math.atan2(s.y - o.y, s.x - o.x);
        moveEnt(s, Math.cos(a) * .9 * dt, Math.sin(a) * .9 * dt, .28);
      }
    }

    // left behind: they call after you
    if (d > 8 && s.callT <= 0) {
      s.callT = rf(4.5, 2.5);
      sfxVoice('wait', d, s.pitch);
      if (d > 12) say('SOMEONE IS CALLING BEHIND YOU.', 3, 'warn');
    }

    // A civilian is only taken when you have left them behind.
    const exposed = d > 4.5;
    if (exposed && near < .95) {
      s.exposure = (s.exposure || 0) + dt;
      if (!s.screamed) {
        s.screamed = true;
        sfxScream();
        say('THEY HAVE ONE. GET BACK THERE NOW.', 4, 'danger');
      }
      if (s.exposure > 3.4) {
        s.alive = false; s.state = 'dead'; lost++;
        corpses.push({ x: s.x, y: s.y });
        say('WE LOST ONE.', 4, 'loss'); sfxHurt();
      }
    } else {
      if (s.screamed && s.alive) {
        say('THEY ARE CLEAR. KEEP THEM CLOSE.', 3, 'obj');
        s.screamed = false;
        s.limp = 22;                       // they do not walk it off
        sfxVoice('whimper', d, s.pitch);
      }
      s.exposure = Math.max(0, (s.exposure || 0) - dt * .6);
    }
    s.limp = Math.max(0, s.limp - dt);
    s.warn = Math.max(0, (s.warn || 0) - dt);
  }
}

function updateFlares(dt) {
  let any = null;
  for (const f of flares) {
    if (f.t > 0) { f.t -= dt; f.power = clamp(f.t / 3, 0, 1) * 1.7; if (!any) any = f; }
  }
  flares = flares.filter(f => f.t > 0);
  if (any) buildFlow(flowFlare, any.x, any.y);
}

/* ---------- player ---------- */
function updatePlayer(dt) {
  if (P.dead) return;
  let mx = 0, my = 0;
  if (keys['w']) my += 1;
  if (keys['s']) my -= 1;
  if (keys['a']) mx -= 1;
  if (keys['d']) mx += 1;
  // the thumb stick is analogue, so it overrides rather than adds
  let analog = 0;
  if (touchMove.x || touchMove.y) {
    mx = touchMove.x; my = touchMove.y;
    analog = Math.min(1, Math.hypot(mx, my));
  }
  const moving = mx || my;

  P.crouch = !!keys['control'] || !!keys['c'] || touchCrouch;
  if (P.crouch) P.usedCrouch = true;
  const wantRun = !!keys['shift'] || (touchSprint && analog > .55);
  P.sprint = wantRun && !P.crouch && P.stam > 2 && (my > 0 || analog > .55);

  let sp = P.crouch ? TUNE.CROUCH : P.sprint ? TUNE.SPRINT : TUNE.WALK;
  if (P.hp < 35) sp *= .82;
  if (analog > 0) sp *= clamp(analog / .85, .34, 1);

  if (P.sprint && moving) P.stam = Math.max(0, P.stam - TUNE.STAM_DRAIN * dt);
  else P.stam = Math.min(100, P.stam + TUNE.STAM_REGEN * dt * (P.crouch ? 1.5 : 1));

  // keyboard look, so the camera turns with or without a captured mouse
  const TURN = 2.0, PITCH = 1.15;
  if (keys['arrowleft']) P.ang -= TURN * dt;
  if (keys['arrowright']) P.ang += TURN * dt;
  if (keys['arrowup']) P.pitch = clamp(P.pitch + PITCH * dt, -PITCH_MAX, PITCH_MAX);
  if (keys['arrowdown']) P.pitch = clamp(P.pitch - PITCH * dt, -PITCH_MAX, PITCH_MAX);

  const c = Math.cos(P.ang), s = Math.sin(P.ang);
  let dx = (c * my - s * mx), dy = (s * my + c * mx);
  const l = Math.hypot(dx, dy);
  if (l > 0) { dx /= l; dy /= l; }
  const step = sp * dt;
  const rad = .26;
  const blocked = (nx, ny) => isSolid(nx, ny) || legBlocks(nx, ny);
  if (!blocked(P.x + dx * step + Math.sign(dx) * rad, P.y)) P.x += dx * step;
  if (!blocked(P.x, P.y + dy * step + Math.sign(dy) * rad)) P.y += dy * step;

  // footsteps and the noise they make
  if (moving && l > 0) {
    P.bob += dt * sp * 2.5;
    P.step += dt * sp;
    const cadence = P.crouch ? 1.5 : P.sprint ? .72 : 1.0;
    if (P.step > cadence) {
      P.step = 0;
      const tile = at(P.x | 0, P.y | 0);
      const surf = tile === T_GLASSF ? 'glass' : tile === T_FLOOR ? 'floor' : 'street';
      const vol = P.crouch ? .35 : P.sprint ? 1.25 : .8;
      sfxStep(surf, vol);
      let rad2 = P.crouch ? 3.5 : P.sprint ? 15 : 8.5;
      if (surf === 'glass') rad2 += 6;
      emitNoise(P.x, P.y, rad2);
    }
  }

  // radio direction finding. Holding still is the price.
  if ((keys['t'] || keys['v'] || radioHeld) && !P.dead) {
    if (moving) { P.radio = 0; if (!P.radioWarn) { P.radioWarn = 1; say('HOLD STILL TO GET A BEARING.', 2, 'radio'); } }
    else {
      P.radioWarn = 0;
      P.radio = (P.radio || 0) + dt / 1.3;
      if (P.radio >= 1) {
        P.radio = 0;
        let best = null, bd = 1e9;
        for (const s2 of survivors) {
          if (!s2.alive || s2.state !== 'waiting') continue;
          const d2 = Math.hypot(s2.x - P.x, s2.y - P.y);
          if (d2 < bd) { bd = d2; best = s2; }
        }
        if (best) { P.radioLock = { x: best.x, y: best.y, t: 9 }; P.usedRadio = true; say('GOT A VOICE. BEARING MARKED.', 3, 'radio'); sfxPickup(); }
        else say('NOBODY ELSE IS ANSWERING.', 3, 'radio');
      }
    }
  } else { P.radio = 0; P.radioWarn = 0; }
  if (P.radioLock) { P.radioLock.t -= dt; if (P.radioLock.t <= 0) P.radioLock = null; }

  // torch
  if (P.torch) {
    P.batt = Math.max(0, P.batt - DIF.batt * dt);
    if (P.batt <= 0) {
      P.torch = false;
      if (P.reserve) {
        P.reserve = false;
        P.batt = TUNE.RESERVE_CELL;
        say('LAST CELL FROM YOUR POCKET. MAKE IT COUNT.', 5, 'item');
      } else say('THE LAMP IS DEAD. FIND CELLS.', 4, 'warn');
    }
  }

  // bleeding
  if (P.bleed > 0) {
    P.hp -= TUNE.BLEED_RATE * dt;
    if (P.hp <= 0) { P.hp = 0; P.dead = true; ending = 'dead'; }
  }
  P.hurtFlash = Math.max(0, P.hurtFlash - dt * 1.6);
  P.iframe = Math.max(0, (P.iframe || 0) - dt);

  // swing
  if (P.swing >= 0) {
    P.swing += dt / .42;
    if (P.swing > .42 && !P.swingHit) {
      P.swingHit = true;
      for (const p of parasites) {
        if (p.dead) continue;
        const d = Math.hypot(p.x - P.x, p.y - P.y);
        if (d > 1.75) continue;
        const a = Math.atan2(p.y - P.y, p.x - P.x);
        let da = Math.abs(((a - P.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
        if (da > .7) continue;
        p.hp--; p.hurt = 1; sfxHit();
        p.x += Math.cos(a) * .35; p.y += Math.sin(a) * .35;
        if (p.hp <= 0) { p.dead = true; if (runStats) runStats.kills++; corpses.push({ x: p.x, y: p.y }); }
        else { p.state = 'chase'; p.cd = .8; }
        break;
      }
    }
    if (P.swing >= 1) { P.swing = -1; P.swingHit = false; }
  }

  // heartbeat
  P.beat = (P.beat || 0) - dt;
  if (P.hp < 45 && P.beat <= 0) { P.beat = P.hp < 25 ? .62 : .95; sfxHeart(clamp((45 - P.hp) / 45, 0, 1)); }
}

function interact() {
  // the pad outranks everything else you could be doing there, but E only
  // ever boards: calling the bird in early is a separate, deliberate key
  if (birdDown && Math.hypot(CHECK.x - P.x, CHECK.y - P.y) < 3.4) {
    boarded = true; ending = 'out'; settleAwards();
    return;
  }
  // people next, always
  for (const s of survivors) {
    if (!s.alive || s.state !== 'waiting') continue;
    if (Math.hypot(s.x - P.x, s.y - P.y) > 2.0) continue;
    s.state = 'following'; met++;
    s.lastInside = isInside(s.x, s.y) ? 1 : 0;
    sfxVoice('call', 1.5, s.pitch);
    say('STAY ON MY SHOULDER. DO NOT RUN.', 3.5, 'obj');
    if (met === 1) {
      // close the loop out loud the first time, so the shape of the run lands
      P.escortHint = 14;
      say('NOW WALK THEM TO THE PAD. THE MARKER ON THE TAPE IS THE WAY.', 6, 'obj');
    }
    return;
  }
  // supplies
  for (const k of pickups) {
    if (k.taken) continue;
    if (Math.hypot(k.x - P.x, k.y - P.y) > 1.3) continue;
    k.taken = true; sfxPickup();
    if (k.kind === 'batt') { P.batt = Math.min(100, P.batt + 55); say('SPARE CELLS.', 2.5, 'item'); }
    else if (k.kind === 'band') { P.bands++; say('FIELD DRESSING.', 2.5, 'item'); }
    else { P.flares++; say('ROAD FLARE.', 2.5, 'item'); }
    return;
  }
}

function useFlare() {
  if (P.flares <= 0) { say('NO FLARES.', 2, 'item'); return; }
  P.flares--; P.usedFlare = true; if (runStats) runStats.flaresUsed++;
  const fx = P.x + Math.cos(P.ang) * 2.4, fy = P.y + Math.sin(P.ang) * 2.4;
  const ok = !isSolid(fx, fy);
  flares.push({ x: ok ? fx : P.x, y: ok ? fy : P.y, t: TUNE.FLARE_BURN, power: 1.7, anim: 0 });
  sfxFlare();
  buildFlow(flowFlare, ok ? fx : P.x, ok ? fy : P.y);
  say('THEY GO TO THE LIGHT. MOVE.', 3, 'item');
}

function useBandage() {
  if (P.bands <= 0) { say('NOTHING LEFT TO WRAP IT WITH.', 2, 'item'); return; }
  if (P.hp >= 100 && P.bleed <= 0) return;
  P.bands--; P.bleed = 0; P.hp = Math.min(100, P.hp + 20);
  if (runStats) runStats.bandsUsed++;
  sfxPickup(); say('BLEEDING STOPPED.', 2.5, 'item');
}

/* ---------- main step ---------- */
function step(dt) {
  if (ending || paused) return;
  if (grace > 0) {
    const before = grace;
    grace -= dt;
    if (before > 10 && grace <= 10) say('LOOK FOR A LIT WINDOW. SOMEONE IS IN THAT BUILDING.', 5, 'obj');
    if (before > 5 && grace <= 5) say('HOLD T TO WORK THE RADIO. STAND STILL FOR IT.', 5, 'obj');
    if (before > 0 && grace <= 0) say('THAT IS ALL THE QUIET YOU GET. MOVE.', 4, 'warn');
  }
  clock -= dt;
  // nobody left to find? then there is no reason to keep you standing here
  if (!birdDown && birdETA <= 0 && (saved + lost) >= TUNE.SURVIVORS) signalBird(true);

  if (birdETA > 0) {
    birdETA -= dt;
    if (birdETA <= 0) {
      birdETA = 0; birdDown = true;
      say('THE BIRD IS DOWN ON THE PAD. GET ON IT.', 6, 'danger');
    }
  }
  if (!birdDown && birdETA <= 0 && clock <= 90) { birdDown = true; startRotors(); say('LAST BIRD IS ON THE GROUND. NINETY SECONDS.', 6, 'danger'); }
  if (clock <= 0) { ending = 'left'; cause = 'Still in the grid when the last bird lifted.'; return; }

  updatePlayer(dt);
  updateKaiju(dt);
  updateParasites(dt);
  updateSurvivors(dt);
  updateFlares(dt);

  for (const f of fires) f.anim += dt * 11;
  refreshWindows(dt);

  flowT -= dt;
  if (flowT <= 0) { flowT = .3; buildFlow(flow, P.x, P.y); buildGuide(); }

  shake = Math.max(0, shake - dt * 1.6);
  tickAwards(dt);
  msgT = Math.max(0, msgT - dt);
  if (P.escortHint > 0) P.escortHint -= dt;
  for (const m of msgs) m.t -= dt;
  msgs = msgs.filter(m => m.t > 0);

  // combat coaching: only while something is genuinely closing on you
  P.threat = null;
  for (const p of parasites) {
    if (p.dead) continue;
    if (p.state !== 'chase' && p.state !== 'lunge' && p.state !== 'recoil') continue;
    const d = Math.hypot(p.x - P.x, p.y - P.y);
    if (d < 7 && (!P.threat || d < P.threat)) P.threat = d;
  }

  // interaction prompt
  prompt = '';
  for (const k of pickups) if (!k.taken && Math.hypot(k.x - P.x, k.y - P.y) < 1.3)
    prompt = k.kind === 'batt' ? 'E  TAKE CELLS' : k.kind === 'band' ? 'E  TAKE DRESSING' : 'E  TAKE FLARE';
  for (const s of survivors) if (s.alive && s.state === 'waiting' && Math.hypot(s.x - P.x, s.y - P.y) < 2.0)
    prompt = 'E  BRING THEM WITH YOU';
  if (Math.hypot(CHECK.x - P.x, CHECK.y - P.y) < 3.4) {
    const still = TUNE.SURVIVORS - saved - lost;
    if (birdDown) prompt = 'E  BOARD';
    else if (birdETA > 0) prompt = 'BIRD ON APPROACH  ' + Math.ceil(birdETA) + 'S';
    else if (still > 0) prompt = 'B  CALL THE BIRD IN  (LEAVES ' + still + ' OUT THERE)';
    else prompt = 'B  CALL THE BIRD IN';
  }
}

/* On a first night the route is painted on the street: a run of marks
   that flows toward whatever you should be walking to right now. */
function buildGuide() {
  guideTiles.fill(0);
  guideTarget = null;
  if (!DIF.guide || ending) return;

  // escorting anyone at all means the pad; otherwise the nearest voice
  let tgt = null;
  if (survivors.some(s => s.alive && s.state === 'following')) tgt = { x: CHECK.x, y: CHECK.y, kind: 'pad' };
  else {
    let bd = 1e9;
    for (const s of survivors) {
      if (!s.alive || s.state !== 'waiting') continue;
      const d = Math.hypot(s.x - P.x, s.y - P.y);
      if (d < bd) { bd = d; tgt = { x: s.x, y: s.y, kind: 'voice' }; }
    }
    if (!tgt) tgt = { x: CHECK.x, y: CHECK.y, kind: 'pad' };
  }
  guideTarget = tgt;

  buildFlow(flowGuide, tgt.x, tgt.y);
  // walk downhill from where you stand and mark the next stretch
  let cx = P.x | 0, cy = P.y | 0;
  for (let step = 1; step <= 18; step++) {
    let best = -1, bx = cx, by = cy;
    const here = flowGuide[cy * MAP_W + cx];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;
      if (dx && dy && (SOLID[map[cy * MAP_W + nx]] || SOLID[map[ny * MAP_W + cx]])) continue;
      const v = flowGuide[ny * MAP_W + nx];
      if (v < 0) continue;
      if (best < 0 || v < best) { best = v; bx = nx; by = ny; }
    }
    if (best < 0 || (here >= 0 && best >= here)) break;
    guideTiles[by * MAP_W + bx] = Math.min(255, step);
    cx = bx; cy = by;
    if (best === 0) break;
  }
}

/* ---------- camera ---------- */
function camera() {
  const eyeH = lerp(EYE_STAND, EYE_CROUCH, P.crouch ? 1 : 0);
  const mo = motion();
  const bobY = Math.sin(P.bob * 2) * (P.sprint ? 3.4 : 1.9) * mo;
  const bobX = Math.cos(P.bob) * (P.sprint ? 2.2 : 1.1) * mo;
  const sh = shake * shake * mo;
  const shx = (Math.random() - .5) * sh * 22, shy = (Math.random() - .5) * sh * 22;
  const ang = P.ang + (Math.random() - .5) * sh * .05;
  const dirX = Math.cos(ang), dirY = Math.sin(ang);
  const planeX = -dirY * PLANE_LEN, planeY = dirX * PLANE_LEN;
  // positive pitch means the head is tipped back, so the horizon drops down the frame
  const horizon = RES_H / 2 + P.pitch * PROJ + bobY + shy;
  const flick = REDUCED_MOTION ? 1 : (0.94 + Math.random() * .06);
  const torchPow = P.torch ? (2.35 * clamp(P.batt / 100 * 1.6 + .18, 0, 1)) * flick : 0;
  return { px: P.x, py: P.y, dirX, dirY, planeX, planeY, eye: eyeH, horizon, torch: torchPow, bobX: bobX + shx };
}


/* ============================================================
   Everything drawn over the raster at display resolution.
   ============================================================ */

const GRAIN = [];
function buildGrain() {
  for (let k = 0; k < 5; k++) {
    const c = document.createElement('canvas'); c.width = 160; c.height = 90;
    const g = c.getContext('2d');
    const d = g.createImageData(160, 90);
    for (let i = 0; i < 160 * 90; i++) {
      const v = Math.random() * 255;
      d.data[i * 4] = v; d.data[i * 4 + 1] = v; d.data[i * 4 + 2] = v;
      d.data[i * 4 + 3] = 30;
    }
    g.putImageData(d, 0, 0);
    GRAIN.push(c);
  }
}

/* With motion reduced the grain holds for a beat instead of strobing. */
let grainHold = 0, grainIdx = 0;
function grainTile() {
  if (REDUCED_MOTION) {
    if (performance.now() > grainHold) { grainHold = performance.now() + 260; grainIdx = (grainIdx + 1) % GRAIN.length; }
    return GRAIN[grainIdx];
  }
  return GRAIN[(Math.random() * GRAIN.length) | 0];
}

const DUST = [];
function initDust() { for (let i = 0; i < 90; i++) DUST.push({ x: Math.random(), y: Math.random(), s: .3 + Math.random(), v: .1 + Math.random() * .5 }); }

/* Type scale. Sized from a 960x540 reference and scaled up, so the
   smallest thing on screen is 11px at reference rather than 9. */
const MONO_FAM = 'ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace';
const SLAB = '"Arial Narrow", "Helvetica Neue", Impact, system-ui, sans-serif';
function mono(px, s, bold) { return (bold ? 'bold ' : '') + Math.round(px * s) + 'px ' + MONO_FAM; }

const AMBER = 'rgba(226,192,132,';
const BONE = 'rgba(224,224,218,';

/* each message channel gets its own colour and weight */
const CHANNEL = {
  obj: { col: 'rgba(236,206,152,', size: 15, bold: false },
  item: { col: 'rgba(172,214,182,', size: 14, bold: false },
  radio: { col: 'rgba(174,206,230,', size: 14, bold: false },
  warn: { col: 'rgba(250,190,86,', size: 16, bold: true },
  danger: { col: 'rgba(248,102,70,', size: 17, bold: true },
  loss: { col: 'rgba(224,88,88,', size: 16, bold: true }
};

/* Shrink until it fits. Anything drawn inside a box goes through this so a
   longer string can never spill into whatever is beside it. */
function fitFont(g, text, maxW, basePx, s, bold) {
  let px = basePx;
  for (let i = 0; i < 8; i++) {
    g.font = mono(px, s, bold);
    if (g.measureText(text).width <= maxW) return px;
    px -= 1;
    if (px < 7) break;
  }
  g.font = mono(Math.max(px, 7), s, bold);
  return Math.max(px, 7);
}

function rule(g, x, y, w, a) { g.fillStyle = AMBER + a + ')'; g.fillRect(x, y, w, 1); }

/* Text that has to survive being read over a fire or a rubble pile.
   A dark halo costs nothing and keeps the flat amber look intact. */
function inkText(g, text, x, y, col, halo) {
  g.save();
  g.lineJoin = 'round';
  g.lineWidth = halo || 3;
  g.strokeStyle = 'rgba(3,4,6,0.82)';
  g.strokeText(text, x, y);
  g.fillStyle = col;
  g.fillText(text, x, y);
  g.restore();
}

function plate(g, x, y, w, h, a) {
  g.fillStyle = 'rgba(6,7,10,' + a + ')';
  g.fillRect(x, y, w, h);
  g.fillStyle = 'rgba(226,192,132,0.13)';
  g.fillRect(x, y, w, 1); g.fillRect(x, y + h - 1, w, 1);
}

function drawOverlay(g, W, H, dt) {
  g.save();
  const s = Math.min(W / 960, H / 540);

  const dl = clamp(dust * .9 + quakeLevel * .5, 0, 1) * (REDUCED_MOTION ? .45 : 1);
  if (dl > .02) {
    g.fillStyle = 'rgba(190,180,166,' + (dl * .28) + ')';
    for (const p of DUST) {
      p.y += p.v * dt * (.25 + dl) * motion();
      if (p.y > 1) { p.y = -.02; p.x = Math.random(); }
      g.fillRect(p.x * W, p.y * H, p.s * 1.6, p.s * 4.5);
    }
    g.fillStyle = 'rgba(120,104,88,' + (dl * .10) + ')';
    g.fillRect(0, 0, W, H);
  }

  drawWeapon(g, W, H);

  const wound = clamp(1 - P.hp / 100, 0, 1);
  if (wound > .02 || P.hurtFlash > 0) {
    const r = g.createRadialGradient(W / 2, H / 2, H * .22, W / 2, H / 2, H * .78);
    r.addColorStop(0, 'rgba(90,6,4,0)');
    r.addColorStop(1, 'rgba(84,6,4,' + (wound * .62 + P.hurtFlash * .45) + ')');
    g.fillStyle = r; g.fillRect(0, 0, W, H);
  }
  if (P.bleed > 0) {
    g.fillStyle = 'rgba(120,10,8,' + pulse(320, .05, .15) + ')';
    g.fillRect(0, 0, W, H);
  }

  const v = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .92);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.60)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);

  g.globalAlpha = REDUCED_MOTION ? .32 : .5;
  g.drawImage(grainTile(), 0, 0, W, H);
  g.globalAlpha = 1;

  drawHUD(g, W, H, s);
  g.restore();
}

function drawWeapon(g, W, H) {
  const s = H / 540;
  const t = P.swing < 0 ? 0 : P.swing;
  const arc = t <= 0 ? 0 : Math.sin(t * Math.PI);
  const bob = (Math.sin(P.bob * 2) * 6 * s + (P.sprint ? Math.sin(P.bob * 4) * 5 * s : 0)) * motion();
  const cx = W * .78 - arc * W * .34, cy = H + 30 * s - arc * H * .30 + bob;
  g.save();
  g.translate(cx, cy);
  g.rotate(-0.62 + arc * 1.5);
  g.scale(s, s);
  const grad = g.createLinearGradient(-14, 0, 14, 0);
  grad.addColorStop(0, '#0b0c0e'); grad.addColorStop(.42, '#2c3036'); grad.addColorStop(1, '#101216');
  g.fillStyle = grad;
  g.fillRect(-12, -300, 24, 330);
  g.fillStyle = 'rgba(78,44,22,0.45)';
  g.fillRect(-12, -160, 24, 44);
  g.fillStyle = '#141518';
  g.fillRect(-14, -70, 28, 62);
  g.fillStyle = '#23272c';
  g.beginPath();
  g.moveTo(-12, -300); g.lineTo(-30, -344); g.lineTo(-16, -352);
  g.lineTo(4, -324); g.lineTo(12, -300); g.closePath(); g.fill();
  g.fillStyle = '#0a0b0d';
  g.beginPath(); g.moveTo(-22, -340); g.lineTo(-16, -330); g.lineTo(-24, -332); g.closePath(); g.fill();
  g.fillStyle = 'rgba(64,10,8,0.6)';
  g.fillRect(-16, -336, 12, 26);
  g.restore();
}

/* what to do right now, in one line */
function objectiveLine() {
  if (birdDown) return 'GET TO THE PAD \u2192 BOARD';
  if (birdETA > 0) return 'HOLD THE PAD \u2192 BIRD INBOUND ' + Math.ceil(birdETA) + 'S';
  if (saved + lost >= TUNE.SURVIVORS) return 'NOBODY LEFT OUT THERE \u2192 GET TO THE PAD';
  const following = survivors.filter(x => x.alive && x.state === 'following').length;
  if (following > 0) return 'ESCORT ' + following + ' TO THE PAD \u2192 THEN GO BACK';
  const waiting = survivors.filter(x => x.alive && x.state === 'waiting').length;
  if (waiting > 0) return 'FIND A LIT WINDOW \u2192 ESCORT THEM TO THE PAD';
  return 'EVERYONE ACCOUNTED FOR \u2192 GET TO THE PAD';
}

function drawHUD(g, W, H, s) {
  g.textBaseline = 'middle';

  /* ---------- bearing tape ---------- */
  const tapeW = 320 * s, ty = 30 * s;
  g.globalAlpha = .75;
  rule(g, W / 2 - tapeW / 2, ty, tapeW, .35);
  const heading = ((-P.ang * 180 / Math.PI) % 360 + 360) % 360;
  g.font = mono(11, s); g.textAlign = 'center';
  for (let d = -60; d <= 60; d += 15) {
    const abs = ((heading + d) % 360 + 360) % 360;
    const px = W / 2 + (d / 60) * (tapeW / 2);
    const major = abs % 45 < 7.5 || abs % 45 > 37.5;
    g.fillStyle = AMBER + (major ? .6 : .34) + ')';
    g.fillRect(px, ty - (major ? 6 : 4) * s, 1.4, (major ? 6 : 4) * s);
  }
  const bAng = Math.atan2(CHECK.y - P.y, CHECK.x - P.x);
  const relDeg = (((bAng - P.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI) * 180 / Math.PI;
  const mx = W / 2 + (clamp(relDeg, -62, 62) / 60) * (tapeW / 2);
  g.fillStyle = Math.abs(relDeg) > 62 ? AMBER + '.45)' : AMBER + '.95)';
  g.beginPath(); g.moveTo(mx, ty - 10 * s); g.lineTo(mx - 5 * s, ty - 19 * s); g.lineTo(mx + 5 * s, ty - 19 * s); g.closePath(); g.fill();
  g.font = mono(13, s, true); g.fillStyle = AMBER + '.85)';
  g.fillText('PAD ' + Math.round(Math.hypot(CHECK.x - P.x, CHECK.y - P.y) * 3) + 'M', W / 2, ty + 14 * s);

  if (P.radioLock) {
    const rAng = Math.atan2(P.radioLock.y - P.y, P.radioLock.x - P.x);
    const rDeg = (((rAng - P.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI) * 180 / Math.PI;
    const rx = W / 2 + (clamp(rDeg, -62, 62) / 60) * (tapeW / 2);
    const fade = clamp(P.radioLock.t / 2, 0, 1);
    g.fillStyle = 'rgba(160,192,216,' + (Math.abs(rDeg) > 62 ? .35 : .95) * fade + ')';
    g.beginPath(); g.moveTo(rx, ty + 6 * s); g.lineTo(rx - 5 * s, ty + 15 * s); g.lineTo(rx + 5 * s, ty + 15 * s); g.closePath(); g.fill();
    g.font = mono(13, s, true); g.fillStyle = 'rgba(160,192,216,' + .95 * fade + ')';
    g.fillText('VOICE ' + Math.round(Math.hypot(P.radioLock.x - P.x, P.radioLock.y - P.y) * 3) + 'M', W / 2, ty + 30 * s);
  }
  g.globalAlpha = 1;

  /* ---------- clock, objective, tally ---------- */
  const m = Math.max(0, Math.floor(clock / 60)), sec = Math.max(0, Math.floor(clock % 60));
  g.textAlign = 'left';
  const urgent = clock < 90;
  g.font = mono(urgent ? 20 : 17, s, urgent);
  g.fillStyle = urgent ? 'rgba(232,104,66,' + pulse(220, .5, 1) + ')' : AMBER + '.85)';
  g.fillText('EVAC  ' + m + ':' + String(sec).padStart(2, '0'), 26 * s, 32 * s);

  g.font = mono(13, s, true);
  inkText(g, objectiveLine(), 26 * s, 52 * s, AMBER + '.92)');
  g.font = mono(13, s); g.fillStyle = AMBER + '.7)';
  g.fillText('THROUGH THE LINE ' + saved + '/' + TUNE.SURVIVORS + (lost ? '     LOST ' + lost : ''), 26 * s, 69 * s);

  /* ---------- escort banner, first rescue only ---------- */
  if (P.escortHint > 0) {
    const a = clamp(P.escortHint / 1.5, 0, 1);
    const label = 'ESCORT \u2192 PAD  \u00b7  ' + Math.round(Math.hypot(CHECK.x - P.x, CHECK.y - P.y) * 3) + 'M  \u00b7  KEEP THEM CLOSE';
    g.textAlign = 'left'; g.font = mono(13, s, true);
    const tw = g.measureText(label).width;
    plate(g, 22 * s, 78 * s, tw + 20 * s, 22 * s, .78 * a);
    g.fillStyle = 'rgba(174,206,230,' + (.6 * a) + ')';
    g.fillRect(22 * s, 78 * s, 3 * s, 22 * s);
    inkText(g, label, 32 * s, 89 * s, 'rgba(190,218,238,' + a + ')');
  }

  /* ---------- status chips ---------- */
  const chips = [];
  if (P.crouch) chips.push(['CROUCHED \u00b7 QUIET', 'rgba(150,200,170,']);
  else if (P.sprint) chips.push(['RUNNING \u00b7 LOUD', 'rgba(238,150,70,']);
  if (P.stam < 25) chips.push(['WINDED', 'rgba(226,120,70,']);
  if (P.torch) chips.push(['LAMP ON \u00b7 SEEN', 'rgba(226,192,132,']);
  if (P.radioLock) chips.push(['BEARING HELD', 'rgba(160,192,216,']);
  if (P.bleed > 0) chips.push(['BLEEDING \u00b7 PRESS R', 'rgba(226,72,58,']);
  if (birdDown) chips.push(['BIRD ON THE PAD', 'rgba(172,214,182,']);
  else if (birdETA > 0) chips.push(['BIRD INBOUND ' + Math.ceil(birdETA) + 'S', 'rgba(172,214,182,']);
  else if (saved + lost >= TUNE.SURVIVORS) chips.push(['ALL ACCOUNTED FOR', 'rgba(172,214,182,']);
  const following = survivors.filter(x => x.alive && x.state === 'following').length;
  if (following > 0) chips.push([following + ' FOLLOWING', 'rgba(180,200,220,']);

  g.textAlign = 'right';
  chips.forEach((c, i) => {
    const y = (touchUI ? 74 * s : 32 * s) + i * 21 * s;
    g.font = mono(13, s, true);
    const tw = g.measureText(c[0]).width;
    plate(g, W - 26 * s - tw - 10 * s, y - 10 * s, tw + 20 * s, 20 * s, .70);
    g.fillStyle = c[1] + '.95)';
    g.fillText(c[0], W - 36 * s, y);
  });

  /* ---------- resources ---------- */
  const bx = 26 * s, by = touchUI ? 96 * s : H - 92 * s;
  const meter = (label, val, col, i) => {
    const y = by + i * 20 * s;
    g.font = mono(13, s, true); g.fillStyle = AMBER + '.8)'; g.textAlign = 'left';
    g.fillText(label, bx, y);
    const w = 104 * s;
    g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(bx + 62 * s, y - 4 * s, w, 5 * s);
    g.fillStyle = col; g.fillRect(bx + 62 * s, y - 4 * s, w * clamp(val, 0, 1), 5 * s);
  };
  meter('BLOOD', P.hp / 100, P.bleed > 0 ? 'rgba(214,62,46,0.95)' : 'rgba(178,60,48,0.85)', 0);
  meter('WIND', P.stam / 100, P.stam < 25 ? 'rgba(226,120,70,0.9)' : 'rgba(168,178,190,0.75)', 1);
  meter('LAMP', P.batt / 100, P.torch ? 'rgba(232,200,130,0.95)' : 'rgba(100,94,82,0.6)', 2);

  if (!touchUI) {
    // on touch the counts live on the buttons themselves
    g.font = mono(15, s, true); g.fillStyle = AMBER + '.9)';
    g.fillText('FLARES ' + P.flares + '     DRESSINGS ' + P.bands, bx, H - 24 * s);
  }

  /* ---------- footfall warning ---------- */
  let danger = null;
  for (const st of stomps) {
    const d = Math.hypot(P.x - st.x, P.y - st.y);
    if (d < 9) danger = d;
  }
  if (danger !== null) {
    const pl = pulse(REDUCED_MOTION ? 90 : 90, .55, .98);
    g.textAlign = 'center'; g.font = mono(26, s, true);
    inkText(g, 'MOVE', W / 2, H * .32, 'rgba(255,96,66,' + pl + ')', 5 * s);
    g.font = mono(14, s, true);
    g.fillStyle = 'rgba(240,150,120,' + pl + ')';
    g.fillText('IT IS COMING DOWN HERE', W / 2, H * .365);
  }

  /* ---------- radio tuning ---------- */
  if (P.radio > 0) {
    const bw = 90 * s;
    g.textAlign = 'center';
    plate(g, W / 2 - bw / 2 - 12 * s, H * .70 - 24 * s, bw + 24 * s, 36 * s, .6);
    g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(W / 2 - bw / 2, H * .70, bw, 5 * s);
    g.fillStyle = 'rgba(160,192,216,0.95)'; g.fillRect(W / 2 - bw / 2, H * .70, bw * clamp(P.radio, 0, 1), 5 * s);
    g.font = mono(13, s, true); g.fillStyle = BONE + '.95)';
    g.fillText('TUNING \u00b7 HOLD STILL', W / 2, H * .70 - 13 * s);
  }

  /* ---------- route marker, first night only ---------- */
  if (guideTarget) {
    const gAng = Math.atan2(guideTarget.y - P.y, guideTarget.x - P.x);
    const rel = ((gAng - P.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    const dist = Math.hypot(guideTarget.x - P.x, guideTarget.y - P.y);
    const onScreen = Math.abs(rel) < FOV / 2;
    const label = guideTarget.kind === 'pad' ? 'PAD' : 'VOICE';
    const col = guideTarget.kind === 'pad' ? 'rgba(172,214,182,' : 'rgba(240,196,140,';
    if (onScreen) {
      // a chevron sitting on the ground ahead
      const sx2 = W / 2 + Math.tan(rel) * (W / 2) / Math.tan(FOV / 2);
      const y2 = H * .60;
      const a = .55 + .45 * (REDUCED_MOTION ? .5 : (0.5 + 0.5 * Math.sin(performance.now() / 300)));
      g.save();
      g.translate(sx2, y2);
      g.strokeStyle = col + a + ')';
      g.lineWidth = 3.5 * s; g.lineCap = 'round'; g.lineJoin = 'round';
      for (let i = 0; i < 2; i++) {
        const o = i * 11 * s;
        g.beginPath();
        g.moveTo(-11 * s, -6 * s + o); g.lineTo(0, 3 * s + o); g.lineTo(11 * s, -6 * s + o);
        g.stroke();
      }
      g.restore();
      g.textAlign = 'center'; g.font = mono(12, s, true);
      inkText(g, label + ' ' + Math.round(dist * 3) + 'M', sx2, y2 + 30 * s, col + '.95)');
    } else {
      // off to one side: a wedge at the screen edge
      const left = rel < 0;
      const ex = left ? 40 * s : W - 40 * s, ey = H * .58;
      g.save(); g.translate(ex, ey); g.rotate(left ? Math.PI : 0);
      g.fillStyle = col + '.9)';
      g.beginPath(); g.moveTo(14 * s, 0); g.lineTo(-8 * s, -11 * s); g.lineTo(-8 * s, 11 * s); g.closePath(); g.fill();
      g.restore();
      g.textAlign = 'center'; g.font = mono(11, s, true);
      inkText(g, label, ex, ey + 26 * s, col + '.9)');
    }
  }

  /* ---------- combat coaching ---------- */
  if (P.threat !== null && P.threat !== undefined && !prompt) {
    const close = P.threat < 2.2;
    const label = close ? 'CLICK TO SWING'
      : (P.flares > 0 ? 'BACK OFF \u00b7 CLICK TO SWING \u00b7 Q FOR A FLARE'
        : 'BACK OFF \u00b7 CLICK TO SWING \u00b7 CROUCH TO GO QUIET');
    g.textAlign = 'center'; g.font = mono(close ? 18 : 14, s, true);
    const tw = g.measureText(label).width;
    plate(g, W / 2 - tw / 2 - 16 * s, H * .55 - 15 * s, tw + 32 * s, 30 * s, .78);
    inkText(g, label, W / 2, H * .55, close ? 'rgba(250,140,110,0.98)' : 'rgba(240,190,140,0.95)', 4 * s);
  }

  /* ---------- interaction prompt ---------- */
  if (prompt) {
    g.textAlign = 'center'; g.font = mono(20, s, true);
    const tw = g.measureText(prompt).width;
    const py2 = touchUI ? H * .30 : H * .615;
    plate(g, W / 2 - tw / 2 - 18 * s, py2 - 18 * s, tw + 36 * s, 36 * s, .84);
    inkText(g, prompt, W / 2, py2, 'rgba(246,246,242,1)', 4 * s);
  }

  /* ---------- message channels ---------- */
  g.textAlign = 'center';
  msgs.forEach((mm, i) => {
    const ch = CHANNEL[mm.kind] || CHANNEL.obj;
    const a = clamp(mm.t / .8, 0, 1);
    const y = (touchUI ? H * .46 : H - 122 * s) - i * 25 * s;
    g.font = mono(ch.size, s, ch.bold);
    const tw = g.measureText(mm.text).width;
    plate(g, W / 2 - tw / 2 - 14 * s, y - 13 * s, tw + 28 * s, 26 * s, .70 * a);
    if (ch.bold) inkText(g, mm.text, W / 2, y, ch.col + a + ')', 3.5 * s);
    else { g.fillStyle = ch.col + a + ')'; g.fillText(mm.text, W / 2, y); }
    if (ch.bold) {
      g.fillStyle = ch.col + (.7 * a) + ')';
      g.fillRect(W / 2 - tw / 2 - 14 * s, y - 12 * s, 3 * s, 25 * s);
    }
  });

  /* ---------- grace banner ---------- */
  if (grace > 0) {
    g.textAlign = 'center';
    const a = clamp(grace / 2, 0, 1);
    g.font = mono(14, s, true);
    g.fillStyle = 'rgba(170,204,228,' + (.95 * a) + ')';
    g.fillText('NOTHING HAS NOTICED YOU YET \u00b7 ' + Math.ceil(grace) + 'S', W / 2, H * .12);
  }

  drawAwardToasts(g, W, H, s);
  if (showControls) drawControlCard(g, W, H, s);
}

/* ---------- reopenable control card ---------- */
function drawControlCard(g, W, H, s) {
  const cw = 470 * s, chh = 312 * s;
  const x = W / 2 - cw / 2, y = H / 2 - chh / 2;
  g.fillStyle = 'rgba(4,5,8,0.92)'; g.fillRect(x, y, cw, chh);
  g.fillStyle = 'rgba(226,192,132,0.22)';
  g.fillRect(x, y, cw, 1.5); g.fillRect(x, y + chh - 1.5, cw, 1.5);
  g.textBaseline = 'middle';
  g.textAlign = 'left';
  g.font = mono(15, s, true); g.fillStyle = BONE + '.95)';
  g.fillText('CONTROLS', x + 24 * s, y + 26 * s);
  g.font = mono(11, s); g.fillStyle = AMBER + '.5)';
  g.textAlign = 'right';
  g.fillText('H CLOSES THIS', x + cw - 24 * s, y + 26 * s);
  const rows = [
    ['WASD', 'move'],
    ['SHIFT', 'run \u2014 loud, wakes them'],
    ['C or CTRL', 'crouch \u2014 quiet, slow'],
    ['MOUSE / ARROWS', 'look'],
    ['CLICK', 'swing the bar'],
    ['E or SPACE', 'take, bring, board'],
    ['F', 'lamp on and off'],
    ['Q', 'drop a flare, they go to it'],
    ['R', 'field dressing, stops bleeding'],
    ['T or V', 'hold still, work the radio'],
    ['B', 'on the pad: call the bird in early'],
    ['P or ESC', 'pause'],
    ['J', 'awards'],
    ['M', 'reduced motion' + (REDUCED_MOTION ? '  \u2014 ON' : '')]
  ];
  rows.forEach((r, i) => {
    const ry = y + 54 * s + i * 17.6 * s;
    g.textAlign = 'right'; g.font = mono(13, s, true); g.fillStyle = BONE + '.95)';
    g.fillText(r[0], x + 150 * s, ry);
    g.textAlign = 'left'; g.font = mono(13, s); g.fillStyle = AMBER + '.82)';
    g.fillText(r[1], x + 164 * s, ry);
  });
}

/* ---------- pause ---------- */
function drawPause(g, W, H) {
  const s = Math.min(W / 960, H / 540);
  g.fillStyle = 'rgba(3,4,7,0.82)'; g.fillRect(0, 0, W, H);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = BONE + '.95)'; g.font = 'bold ' + Math.round(52 * s) + 'px ' + SLAB;
  g.fillText('PAUSED', W / 2, H * .36);
  g.font = mono(14, s); g.fillStyle = AMBER + '.7)';
  g.fillText('The grid is holding its breath. Nothing moves until you do.', W / 2, H * .44);
  g.font = mono(16, s, true); g.fillStyle = BONE + pulse(400, .35, .95) + ')';
  g.fillText(TOUCH ? 'TAP TO RESUME' : 'CLICK TO RESUME', W / 2, H * .54);
  g.font = mono(12, s); g.fillStyle = AMBER + '.5)';
  g.fillText('H  CONTROLS          ESC  RELEASES THE MOUSE', W / 2, H * .62);
  if (showControls) drawControlCard(g, W, H, s);
}

/* ---------- screens ---------- */
let titleButtons = [];

function drawTitle(g, W, H) {
  const s = Math.min(W / 960, H / 540);
  g.fillStyle = 'rgba(0,0,0,0.74)'; g.fillRect(0, 0, W, H);
  g.textAlign = 'center'; g.textBaseline = 'middle';

  g.fillStyle = AMBER + '.45)'; g.font = mono(11, s);
  g.fillText('CIVIL DEFENSE BROADCAST  \u2014  GRID 4  \u2014  0347 LOCAL', W / 2, H * .085);
  g.globalAlpha = .5; rule(g, W / 2 - 200 * s, H * .112, 400 * s, .6); g.globalAlpha = 1;

  g.fillStyle = BONE + '.95)';
  g.font = 'bold ' + Math.round(64 * s) + 'px ' + SLAB;
  g.fillText('LEVIATHAN HOUR', W / 2, H * .195);

  fitFont(g, 'The animal came up through the harbor at 0210.', W * .8, 13, s, false);
  g.fillStyle = AMBER + '.7)';
  g.fillText('The animal came up through the harbor at 0210.', W / 2, H * .275);

  g.font = mono(12, s); g.fillStyle = AMBER + '.6)';
  const rows = [
    'A LAMP IN A WINDOW MEANS SOMEONE IS STILL IN THAT BUILDING.',
    'THEY HUNT SOUND. GLASS CARRIES. CROUCH TO GO QUIET.',
    'A RING OF LIGHT ON THE STREET MEANS A FOOT IS COMING DOWN THERE.'
  ];
  rows.forEach((r, i) => {
    fitFont(g, r, W * .84, 12, s, false);
    g.fillStyle = AMBER + '.6)';
    g.fillText(r, W / 2, H * .345 + i * 18 * s);
  });

  /* ---- difficulty, in its own band with nothing else in it ---- */
  g.font = mono(11, s); g.fillStyle = AMBER + '.4)';
  g.fillText(TOUCH ? 'CHOOSE YOUR NIGHT  \u00b7  TAP ONE' : 'CHOOSE YOUR NIGHT  \u00b7  PRESS 1 OR 2, OR CLICK', W / 2, H * .475);

  titleButtons = [];
  const opts = [DIFFS.recruit, DIFFS.veteran];

    g.lineWidth = on ? 2 * s : 1 * s;

    }

    fitFont(g, head, bw - pad, 16, s, true);
    g.fillStyle = on ? BONE + '.99)' : AMBER + '.55)';

  inkText(g, (TOUCH ? 'TAP TO BEGIN' : 'CLICK THE FRAME TO BEGIN'), W / 2, H * .845, BONE + pulse(400, .4, .98) + ')');
  g.font = mono(11, s); g.fillStyle = AMBER + '.45)';
  g.fillText((TOUCH ? 'AWARDS ' : 'H  CONTROLS      J  AWARDS ') + awardCount() + '/' + ACHIEVEMENTS.length + (TOUCH ? '' : '      M  REDUCED MOTION' + (REDUCED_MOTION ? ' (ON)' : '')), W / 2, H * .905);
  if (showControls) drawControlCard(g, W, H, s);
}

/* did a title click land on a difficulty button? */
function titleHit(px, py) {
  for (const b of titleButtons) {
    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return b.key;
  }
  return null;
}

/* One thing to take into the next run. Picks the lesson that actually
   applies to how this one ended, preferring a tool they never reached for. */
function tacticalLesson() {
  if (ending === 'crushed')
    return 'THE RING ON THE STREET IS THE KILL ZONE. WALK OUT OF IT, NOT AROUND IT.';
  if (ending === 'left' && met > saved)
    return 'BOARD EARLY WITH THREE RATHER THAN LATE WITH FIVE.';
  if (ending === 'left')
    return 'THE PAD MARKER SITS ON THE BEARING TAPE. HEAD BACK BEFORE THE LAST NINETY SECONDS.';
  if (ending === 'dead' && !P.usedCrouch)
    return 'CROUCHING CUTS YOUR NOISE TO A THIRD. THEY HUNT WHAT THEY HEAR.';
  if (ending === 'dead' && !P.usedFlare)
    return 'A FLARE PULLS THEM OFF YOU FOR TWENTY SECONDS. YOU FINISHED THE RUN HOLDING THEM.';
  if (ending === 'dead')
    return 'BACK OFF AND SWING ON THE RECOIL. TRADING BITES WITH THEM NEVER WORKS.';
  if (lost > 0)
    return 'THEY ARE TAKEN WHEN YOU GET MORE THAN A FEW STRIDES AHEAD. KEEP THEM ON YOUR SHOULDER.';
  if (!P.usedRadio && saved < TUNE.SURVIVORS)
    return 'HOLD T AND STAND STILL FOR A BEARING ON THE NEAREST VOICE.';
  if (saved < TUNE.SURVIVORS)
    return 'A LAMP IN A WINDOW MEANS SOMEONE IS STILL IN THAT BUILDING.';
  return 'NOTHING TO TEACH YOU. RUN IT FASTER.';
}

function drawEnd(g, W, H) {
  const s = Math.min(W / 960, H / 540);
  g.fillStyle = 'rgba(0,0,0,' + (ending === 'out' ? .82 : .91) + ')'; g.fillRect(0, 0, W, H);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  let head, sub;
  if (ending === 'out') { head = 'WHEELS UP'; sub = 'The city goes small and orange underneath you.'; }
  else if (ending === 'left') { head = 'THE BIRD LEFT'; sub = 'You hear it climb away over the rooftops. Then you hear the other thing.'; }
  else if (ending === 'crushed') { head = 'UNDERFOOT'; sub = 'The shadow closed over the whole street and then there was no street.'; }
  else { head = 'YOU DID NOT GET UP'; sub = 'Something small stands on your chest and does not hurry.'; }

  g.fillStyle = BONE + '.96)'; g.font = 'bold ' + Math.round(54 * s) + 'px ' + SLAB;
  g.fillText(head, W / 2, H * .145);
  g.font = mono(14, s); g.fillStyle = AMBER + '.78)';
  g.fillText(sub, W / 2, H * .218);

  /* ---- tally ---- */
  const cw = 440 * s, cx = W / 2 - cw / 2, cy = H * .275;
  g.globalAlpha = .55; rule(g, cx, cy, cw, .7); g.globalAlpha = 1;
  const stat = (label, val, i, col) => {
    const y = cy + 26 * s + i * 25 * s;
    g.textAlign = 'left'; g.font = mono(14, s); g.fillStyle = AMBER + '.72)';
    g.fillText(label, cx + 10 * s, y);
    g.textAlign = 'right'; g.font = mono(18, s, true);
    inkText(g, String(val), cx + cw - 10 * s, y, col || BONE + '.98)');
  };
  const missing = TUNE.SURVIVORS - saved - lost;
  stat('CIVILIANS THROUGH THE LINE', saved + ' / ' + TUNE.SURVIVORS, 0,
    saved === TUNE.SURVIVORS ? 'rgba(180,222,190,0.98)' : 'rgba(200,214,190,0.96)');
  stat('LOST', lost, 1, lost ? 'rgba(228,96,84,0.98)' : BONE + '.5)');
  stat('NEVER REACHED', missing < 0 ? 0 : missing, 2, missing > 0 ? 'rgba(226,180,110,0.95)' : BONE + '.5)');
  stat('CONTACTED', met, 3);
  stat('TIME REMAINING', Math.max(0, Math.floor(clock)) + 'S', 4);
  stat('RUN', DIF.label, 5, AMBER + '.85)');
  g.globalAlpha = .55; rule(g, cx, cy + 167 * s, cw, .7); g.globalAlpha = 1;

  /* ---- how it ended ---- */
  let y = cy + 190 * s;
  if (cause) {
    g.textAlign = 'center'; g.font = mono(11, s); g.fillStyle = AMBER + '.45)';
    g.fillText('CAUSE', W / 2, y);
    g.font = mono(14, s, true);
    inkText(g, cause.toUpperCase(), W / 2, y + 19 * s, 'rgba(232,122,102,0.96)');
    y += 46 * s;
  }

  /* ---- one thing to take with you ---- */
  g.textAlign = 'center'; g.font = mono(11, s); g.fillStyle = AMBER + '.45)';
  g.fillText('NEXT TIME', W / 2, y);
  g.font = mono(14, s, true);
  const lesson = tacticalLesson();
  const lw = g.measureText(lesson).width;
  plate(g, W / 2 - lw / 2 - 16 * s, y + 8 * s, lw + 32 * s, 26 * s, .55);
  inkText(g, lesson, W / 2, y + 21 * s, 'rgba(190,218,238,0.98)');

  g.font = mono(12, s); g.fillStyle = AMBER + '.6)';
  let verdict;
  if (ending === 'out' && saved === TUNE.SURVIVORS) verdict = 'EVERY ONE OF THEM. THAT DOES NOT HAPPEN.';
  else if (ending === 'out' && saved >= 3) verdict = 'MOST OF THEM. YOU WILL COUNT THE REST LATER.';
  else if (ending === 'out' && saved > 0) verdict = 'YOU BROUGHT SOMEONE OUT. HOLD ONTO THAT.';
  else if (ending === 'out') verdict = 'YOU SAVED YOURSELF. IT IS ALLOWED.';
  else verdict = 'THE GRID BURNED UNTIL MORNING.';
  g.fillText(verdict, W / 2, y + 50 * s);

  const fresh = ACHIEVEMENTS.filter(a => unlocked[a.id] && Date.now() - unlocked[a.id] < 60000);
  if (fresh.length) {
    g.textAlign = 'center'; g.font = mono(11, s); g.fillStyle = AMBER + '.45)';
    g.fillText('AWARDED THIS RUN', W / 2, y + 74 * s);
    g.font = mono(12, s, true);
    fresh.slice(0, 3).forEach((a, i) => {
      inkText(g, a.name, W / 2, y + 92 * s + i * 17 * s, 'rgba(236,206,152,0.96)');
    });
  }

  g.font = mono(17, s, true);
  inkText(g, TOUCH ? 'TAP  \u00b7  RUN IT AGAIN' : 'R  OR CLICK  \u00b7  RUN IT AGAIN', W / 2, H * .955, BONE + pulse(400, .45, .98) + ')');
}

  },

  },
  {

    desc: 'Fly out without burning a flare or a dressing.'
  },
  {
    id: 'blackout', name: 'BLACKOUT',
    desc: 'Fly out having never once switched the lamp on.'
  },
  {
    id: 'quick', name: 'INSIDE THE HOUR',
    desc: 'Fly out with more than half the clock still to run.'
  },

  },

  }
];

const ACH_KEY = 'leviathan-hour.awards.v1';
let unlocked = {};
let achToast = [];
let runStats = null;

/* Storage is best effort: some sandboxes refuse it outright, and the game
   still has to run. Anything unlocked in this session stays for the session. */
function loadAwards() {
  unlocked = {};
  try {
    const raw = window.localStorage && window.localStorage.getItem(ACH_KEY);
    if (raw) unlocked = JSON.parse(raw) || {};
  } catch (e) { unlocked = {}; }
}
function saveAwards() {
  try {
    if (window.localStorage) window.localStorage.setItem(ACH_KEY, JSON.stringify(unlocked));
  } catch (e) { /* session only */ }
}

function resetStats() {
  runStats = {
    sprinted: false, flaresUsed: 0, bandsUsed: 0,
    lampOn: false, kills: 0, stare: 0, threaded: false
  };
}

function award(id) {
  if (unlocked[id]) return;
  const a = ACHIEVEMENTS.find(x => x.id === id);
  if (!a) return;
  unlocked[id] = Date.now();
  saveAwards();
  achToast.unshift({ name: a.name, desc: a.desc, t: 6 });
  if (achToast.length > 3) achToast.length = 3;
  sfxAward();
}

/* mid-run checks */
function tickAwards(dt) {
  if (!runStats || ending || paused) return;

  // holding it in view. kaijuPixels is set by the renderer each frame.
  const big = kaijuPixels > (RES_W * RES_H) * 0.02;
  runStats.stare = big ? runStats.stare + dt : 0;
  if (runStats.stare >= 5) award('eyes');

  if (P.sprint) runStats.sprinted = true;
  if (P.torch) runStats.lampOn = true;
  if (runStats.kills >= 5) award('butcher');
  if (runStats.threaded) award('threaded');

  for (const t of achToast) t.t -= dt;
  achToast = achToast.filter(t => t.t > 0);
}

/* end of run */
function settleAwards() {
  if (!runStats || ending !== 'out') return;
  award('first');
  if (saved >= TUNE.SURVIVORS && lost === 0) award('allout');
  if (runStats.flaresUsed === 0 && runStats.bandsUsed === 0) award('austere');
  if (!runStats.lampOn) award('blackout');
  if (clock > TUNE.RUN_TIME / 2) award('quick');
  if (!runStats.sprinted) award('quiet');
  if (DIF.key === 'veteran') award('veteran');
}

const awardCount = () => ACHIEVEMENTS.filter(a => unlocked[a.id]).length;

/* ---------- presentation ---------- */

/* ============================================================
   Touch. A left thumb for walking, a right thumb for looking,
   and the verbs as buttons where a thumb can actually reach.
   ============================================================ */

let TOUCH = false;            // device reports touch
let touchUI = false;          // draw and accept the on-screen controls
let stick = null;             // { id, ox, oy, x, y }
let lookTouch = null;         // { id, x, y }
let touchMove = { x: 0, y: 0 };
let touchSprint = false, touchCrouch = false;
let btnFlash = {};

/* A 16:9 canvas inside a portrait phone is a letterbox strip: the buttons
   end up around 23px, well under the ~44px a thumb needs. Ask for landscape
   rather than shipping controls nobody can hit. */
let portraitBlock = false;

function checkOrientation() {
  if (!TOUCH) { portraitBlock = false; return false; }
  const w = window.innerWidth || 0, h = window.innerHeight || 0;
  portraitBlock = (h > w * 1.08);
  return portraitBlock;
}

function drawRotateNotice(g, W, H) {
  const s = Math.min(W / 960, H / 540);
  g.fillStyle = 'rgba(3,4,7,0.96)'; g.fillRect(0, 0, W, H);
  g.textAlign = 'center'; g.textBaseline = 'middle';

  // a phone turning on its side
  const cx = W / 2, cy = H * .40, u = Math.min(W, H) * .10;
  g.save();
  g.translate(cx, cy);
  g.rotate(Math.sin(performance.now() / 700) * .38 - .38);
  g.strokeStyle = 'rgba(226,192,132,0.85)';
  g.lineWidth = Math.max(2, 3 * s);
  g.beginPath();
  const rw = u * .62, rh = u * 1.15, rr = u * .16;
  g.moveTo(-rw + rr, -rh);
  g.arcTo(rw, -rh, rw, -rh + rr, rr);
  g.arcTo(rw, rh, rw - rr, rh, rr);
  g.arcTo(-rw, rh, -rw, rh - rr, rr);
  g.arcTo(-rw, -rh, -rw + rr, -rh, rr);
  g.closePath(); g.stroke();
  g.restore();

  g.fillStyle = 'rgba(226,226,220,0.95)';
  g.font = 'bold ' + Math.round(22 * s) + 'px ' + SLAB;
  g.fillText('TURN YOUR PHONE SIDEWAYS', cx, H * .66);
  g.font = mono(12, s);
  g.fillStyle = AMBER + '.65)';
  g.fillText('The grid is wider than it is tall.', cx, H * .74);
}

function detectTouch() {
  try {
    TOUCH = ('ontouchstart' in window) ||
      (navigator.maxTouchPoints > 0) ||
      (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  } catch (e) { TOUCH = false; }
  touchUI = TOUCH;
  return TOUCH;
}

/* ---------- layout ----------
   Everything is derived from the canvas size so it lands in the same
   place on a phone, a tablet, and a desktop window. */
function touchLayout(W, H) {
  const u = Math.min(W, H);
  const r = u * .115;                 // action button radius
  const pad = u * .055;
  const bx = W - pad - r;             // right column x
  const by = H - pad - r;             // bottom row y
  const gap = r * 2.28;

  return {
    stickR: u * .17,
    stickZone: { x: 0, y: H * .34, w: W * .42, h: H * .66 },
    r,
    buttons: [
      // primary, closest to the thumb
      { id: 'swing', label: 'SWING', x: bx, y: by, r: r * 1.24, tone: 'hot' },
      { id: 'use', label: 'USE', x: bx - gap, y: by, r: r, tone: 'good' },
      { id: 'crouch', label: 'CROUCH', x: bx, y: by - gap, r: r, tone: 'cool', toggle: true },
      { id: 'flare', label: 'FLARE', x: bx - gap, y: by - gap, r: r * .86, tone: 'warm' },
      { id: 'lamp', label: 'LAMP', x: bx - gap * 1.72, y: by - gap * .52, r: r * .86, tone: 'warm' },
      { id: 'wrap', label: 'WRAP', x: bx, y: by - gap * 2, r: r * .86, tone: 'warm' },
      { id: 'radio', label: 'RADIO', x: bx - gap * .86, y: by - gap * 2.14, r: r * .86, tone: 'cool' },
      // run is a big flat pad above the stick, easy to hit with the left thumb
      { id: 'run', label: 'RUN', x: pad + r * 1.1, y: H * .30, r: r * .92, tone: 'warm', toggle: true },
      // small, out of the way, but reachable
      { id: 'pause', label: 'II', x: W - pad - r * .5, y: pad + r * .5, r: r * .52, tone: 'cool' }
    ]
  };
}

const TONES = {
  hot: ['rgba(226,96,64,', 'rgba(255,140,110,'],
  good: ['rgba(150,200,170,', 'rgba(190,232,206,'],
  warm: ['rgba(226,192,132,', 'rgba(248,220,168,'],
  cool: ['rgba(160,192,216,', 'rgba(198,224,244,']
};

function buttonAt(L, px, py) {
  for (const b of L.buttons) {
    const rr = b.r * 1.16;            // a little forgiveness
    if ((px - b.x) ** 2 + (py - b.y) ** 2 <= rr * rr) return b;
  }
  return null;
}

function inStickZone(L, px, py) {
  const z = L.stickZone;
  return px >= z.x && px <= z.x + z.w && py >= z.y && py <= z.y + z.h;
}

/* ---------- the verbs ---------- */
function pressButton(id) {
  btnFlash[id] = 1;
  switch (id) {
    case 'swing':
      if (P.swing < 0 && !ending && !paused) { P.swing = 0; P.swingHit = false; sfxSwing(); }
      break;
    case 'use': interact(); break;
    case 'flare': useFlare(); break;
    case 'wrap': useBandage(); break;
    case 'lamp':
      if (P.batt > 0) { P.torch = !P.torch; say(P.torch ? 'LAMP ON. THEY CAN SEE IT.' : 'LAMP OFF. HARDER TO FIND YOU.', 2.5, 'item'); }
      else say('THE CELL IS FLAT.', 2.5, 'warn');
      break;
    case 'crouch': touchCrouch = !touchCrouch; break;
    case 'run': touchSprint = !touchSprint; break;
    case 'pause': setPaused(true); break;
    case 'radio': break;              // held, handled by the touch layer
  }
}

/* radio needs a hold, so track it separately */
let radioHeld = false;

function updateTouchFlash(dt) {
  for (const k in btnFlash) {
    btnFlash[k] -= dt * 3.5;
    if (btnFlash[k] <= 0) delete btnFlash[k];
  }
}

/* ---------- drawing ---------- */
function drawTouchControls(g, W, H) {
  if (!touchUI || !inGame || ending) return;
  const L = touchLayout(W, H);
  const s = Math.min(W / 960, H / 540);

  // stick
  if (stick) {
    g.save();
    g.strokeStyle = 'rgba(226,192,132,0.20)';
    g.lineWidth = 2 * s;
    g.beginPath(); g.arc(stick.ox, stick.oy, L.stickR, 0, Math.PI * 2); g.stroke();
    g.fillStyle = 'rgba(6,7,10,0.34)';
    g.beginPath(); g.arc(stick.ox, stick.oy, L.stickR, 0, Math.PI * 2); g.fill();
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy;
    const d = Math.hypot(dx, dy) || 1;
    const k = Math.min(1, d / L.stickR);
    const hx = stick.ox + dx / d * L.stickR * k;
    const hy = stick.oy + dy / d * L.stickR * k;
    g.fillStyle = 'rgba(236,206,152,0.72)';
    g.beginPath(); g.arc(hx, hy, L.stickR * .38, 0, Math.PI * 2); g.fill();
    g.restore();
  } else {
    // a resting hint so the zone is discoverable
    const z = L.stickZone;
    const cx = z.x + z.w * .42, cy = z.y + z.h * .62;
    g.save();
    g.globalAlpha = .30;
    g.strokeStyle = 'rgba(226,192,132,0.5)'; g.lineWidth = 2 * s;
    g.beginPath(); g.arc(cx, cy, L.stickR * .72, 0, Math.PI * 2); g.stroke();
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = mono(11, s, true); g.fillStyle = 'rgba(226,192,132,0.7)';
    g.fillText('MOVE', cx, cy);
    g.restore();
  }

  // buttons
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const b of L.buttons) {
    const on = (b.id === 'crouch' && touchCrouch) || (b.id === 'run' && touchSprint) ||
      (b.id === 'radio' && radioHeld) || (b.id === 'lamp' && P.torch);
    const flash = btnFlash[b.id] || 0;
    const tone = TONES[b.tone] || TONES.warm;

    let dim = 1;
    if (b.id === 'flare' && P.flares <= 0) dim = .34;
    if (b.id === 'wrap' && P.bands <= 0) dim = .34;
    if (b.id === 'run' && P.stam < 6) dim = .45;

    g.fillStyle = 'rgba(6,7,10,' + (on ? .74 : .52) + ')';
    g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill();

    g.lineWidth = (on ? 2.6 : 1.6) * s;
    g.strokeStyle = tone[on ? 1 : 0] + (on ? .95 : .42 * dim) + ')';
    g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.stroke();

    if (flash > 0) {
      g.fillStyle = tone[1] + (flash * .30) + ')';
      g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill();
    }

    const px = Math.max(9, Math.round(b.r * .30));
    g.font = 'bold ' + px + 'px ' + MONO_FAM;
    g.fillStyle = tone[on ? 1 : 0] + (on ? 1 : .82 * dim) + ')';
    g.fillText(b.label, b.x, b.y);

    // counts on the consumables
    if (b.id === 'flare' || b.id === 'wrap') {
      const n = b.id === 'flare' ? P.flares : P.bands;
      g.font = 'bold ' + Math.max(8, Math.round(b.r * .26)) + 'px ' + MONO_FAM;
      g.fillStyle = tone[0] + (.9 * dim) + ')';
      g.fillText(String(n), b.x, b.y + b.r * .52);
    }
  }
}


/* ============================================================
   Boot, input, and the pause state.
   ============================================================ */

let canvas, lastT = 0, freeLook = null;
let inGame = false, atTitle = true, showControls = false, showAwards = false;
let lockMode = true;        // false once we learn pointer lock is unavailable
let lockPending = 0;        // when a lock request is in flight
let clickGuard = 0;         // swallow the click that starts or resumes play
let lastClick = null;
let radioTouchId = -1;

function resize() {
  const wrap = document.getElementById('wrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  const target = RES_W / RES_H;
  let cw = w, ch = w / target;
  if (ch > h) { ch = h; cw = h * target; }
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, TOUCH ? 1.5 : 2);
  const cap = TOUCH ? 1000 : 1600;
  const px = Math.max(320, Math.min(cap, Math.round(cw * dpr)));
  canvas.width = px;
  canvas.height = Math.max(180, Math.round(px / target));
}

const locked = () => document.pointerLockElement === canvas;

function setPaused(v) {
  if (!inGame || ending) return;
  if (v === paused) return;
  paused = v;
  if (paused) {
    for (const k in keys) keys[k] = false;
    if (locked()) document.exitPointerLock();
    if (AC && AC.state === 'running' && AC.suspend) AC.suspend().catch(() => { });
  } else {
    resumeAudio();
    clickGuard = performance.now() + 220;
  }
}

function resumeAudio() {
  initAudio();
  if (AC && AC.state === 'suspended' && AC.resume) AC.resume().catch(() => { });
}

function boot() {
  canvas = document.getElementById('view');
  initRender(canvas);
  buildKaiju();
  buildKaijuParts();
  buildSprites();
  buildGrain();
  initDust();
  loadAwards();
  resetStats();

  try {
    const mq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
    REDUCED_MOTION = !!(mq && mq.matches);
    // honour the setting if it changes while the tab is open
    if (mq) {
      const onChange = e => { REDUCED_MOTION = e.matches; };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }
  } catch (e) { REDUCED_MOTION = false; }

  detectTouch();
  if (TOUCH) lockMode = false;      // no pointer lock on a phone
  resize();
  checkOrientation();
  window.addEventListener('resize', () => { checkOrientation(); resize(); });
  window.addEventListener('orientationchange', () => { checkOrientation(); resize(); });

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const handled = ['w', 'a', 's', 'd', ' ', 'shift', 'control', 'e', 'q', 'r', 'f', 'c', 't', 'v', 'p', 'h', 'm', 'b', 'j', '1', '2',
      'arrowleft', 'arrowright', 'arrowup', 'arrowdown'];
    if (handled.includes(k)) e.preventDefault();
    if (e.repeat) return;
    keys[k] = true;

    if (k === '1' && atTitle) { DIF = DIFFS.recruit; return; }
    if (k === '2' && atTitle) { DIF = DIFFS.veteran; return; }
    if (k === 'j') { showAwards = !showAwards; return; }
    if (k === 'h') { showControls = !showControls; return; }
    if (k === 'm') {
      REDUCED_MOTION = !REDUCED_MOTION;
      if (inGame && !ending) say(REDUCED_MOTION ? 'REDUCED MOTION ON.' : 'REDUCED MOTION OFF.', 3, 'item');
      return;
    }
    if (k === 'escape') { setPaused(true); return; }

    if (ending) { if (k === 'r' || k === 'enter') restart(); return; }
    if (!inGame) return;

    if (k === 'p') { setPaused(!paused); return; }
    if (paused) return;

    if (k === 'e' || k === ' ') interact();
    if (k === 'q') useFlare();
    if (k === 'b') signalBird(false);
    if (k === 'r') useBandage();
    if (k === 'f') {
      if (P.batt > 0) { P.torch = !P.torch; say(P.torch ? 'LAMP ON. THEY CAN SEE IT.' : 'LAMP OFF. HARDER TO FIND YOU.', 2.5, 'item'); }
      else say('THE CELL IS FLAT.', 2.5, 'warn');
    }
  });
  document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  /* ---------- focus loss is a pause, not just dropped keys ---------- */
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; setPaused(true); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });

  /* ---------- mouse look, with a fallback if lock is refused ---------- */
  document.addEventListener('mousemove', e => {
    if (locked()) {
      freeLook = null;
      P.ang += e.movementX * 0.0022;
      P.pitch = clamp(P.pitch - e.movementY * 0.0020, -PITCH_MAX, PITCH_MAX);
      return;
    }
    if (!inGame || ending || paused || lockMode) { freeLook = null; return; }
    const r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const fx = (e.clientX - r.left) / r.width - .5;
    const fy = (e.clientY - r.top) / r.height - .5;
    freeLook = (Math.abs(fx) > .5 || Math.abs(fy) > .5) ? null : { fx, fy };
  });

  /* Swinging is on mousedown, but only when play is actually live and the
     click was not the one that started, resumed, or captured the mouse. */
  canvas.addEventListener('mousedown', e => {
    if (TOUCH) return;
    if (e.button !== 0) return;
    if (!inGame || ending || paused || showControls) return;
    if (performance.now() < clickGuard) return;
    if (lockMode && !locked()) return;
    if (P.swing < 0) { P.swing = 0; P.swingHit = false; sfxSwing(); }
  });

  canvas.addEventListener('click', (e) => {
    {
      const r = canvas.getBoundingClientRect();
      lastClick = (r.width && r.height)
        ? { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) }
        : null;
    }
    resumeAudio();
    if (showAwards) { showAwards = false; clickGuard = performance.now() + 220; return; }
    if (showControls) { showControls = false; clickGuard = performance.now() + 220; return; }
    if (atTitle) {
      // a click on a difficulty card selects it instead of starting
      if (lastClick) {
        const hit = titleHit(lastClick.x, lastClick.y);
        if (hit) { DIF = DIFFS[hit]; return; }
      }
      atTitle = false; newRun(); inGame = true; clickGuard = performance.now() + 260; lock(); return;
    }
    if (ending) { restart(); return; }
    if (paused) { setPaused(false); lock(); return; }
    if (lockMode && !locked()) { clickGuard = performance.now() + 220; lock(); }
  });

  /* ---------- touch ----------
     A tap is not a click here. The left thumb walks, the right thumb
     looks, and every verb has a button, so nothing is triggered by
     simply touching the world. */
  const canvasPt = (t) => {
    const r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return { x: 0, y: 0 };
    return {
      x: (t.clientX - r.left) * (canvas.width / r.width),
      y: (t.clientY - r.top) * (canvas.height / r.height)
    };
  };

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    resumeAudio();
    if (portraitBlock) { goFullscreen(); return; }
    const W = canvas.width, H = canvas.height;

    for (const t of e.changedTouches) {
      const p = canvasPt(t);

      // menus and screens first
      if (showAwards) { showAwards = false; continue; }
      if (showControls) { showControls = false; continue; }
      if (atTitle) {
        const hit = titleHit(p.x, p.y);
        if (hit) { DIF = DIFFS[hit]; continue; }
        goFullscreen();
        atTitle = false; newRun(); inGame = true;
        continue;
      }
      if (ending) { restart(); continue; }
      if (paused) { setPaused(false); continue; }

      const L = touchLayout(W, H);
      const b = buttonAt(L, p.x, p.y);
      if (b) {
        if (b.id === 'radio') { radioHeld = true; btnFlash.radio = 1; radioTouchId = t.identifier; }
        else pressButton(b.id);
        continue;
      }
      if (!stick && inStickZone(L, p.x, p.y)) {
        stick = { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y };
        continue;
      }
      if (!lookTouch) lookTouch = { id: t.identifier, x: p.x, y: p.y };
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const W = canvas.width, H = canvas.height;
    const L = touchLayout(W, H);
    for (const t of e.changedTouches) {
      const p = canvasPt(t);
      if (stick && t.identifier === stick.id) {
        stick.x = p.x; stick.y = p.y;
        let dx = stick.x - stick.ox, dy = stick.y - stick.oy;
        const d = Math.hypot(dx, dy);
        if (d > L.stickR) { dx = dx / d * L.stickR; dy = dy / d * L.stickR; }
        // screen down is forward
        touchMove.x = dx / L.stickR;
        touchMove.y = -dy / L.stickR;
      } else if (lookTouch && t.identifier === lookTouch.id) {
        const sens = 3.1 / canvas.width;
        P.ang += (p.x - lookTouch.x) * sens;
        P.pitch = clamp(P.pitch - (p.y - lookTouch.y) * sens * 1.15, -PITCH_MAX, PITCH_MAX);
        lookTouch.x = p.x; lookTouch.y = p.y;
      }
    }
  }, { passive: false });

  const endTouch = e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (stick && t.identifier === stick.id) { stick = null; touchMove.x = 0; touchMove.y = 0; }
      if (lookTouch && t.identifier === lookTouch.id) lookTouch = null;
      if (radioHeld && t.identifier === radioTouchId) { radioHeld = false; radioTouchId = -1; }
    }
  };
  canvas.addEventListener('touchend', endTouch, { passive: false });
  canvas.addEventListener('touchcancel', endTouch, { passive: false });

  document.addEventListener('pointerlockchange', () => {
    if (locked()) { lockPending = 0; return; }
    for (const k in keys) keys[k] = false;
    // Losing the capture mid-run means the player hit Esc or tabbed away.
    if (inGame && !ending && lockMode && !lockPending) setPaused(true);
  });

  // Some browsers and embeds refuse pointer lock outright. Fall back to
  // cursor steering rather than pausing the player into a corner.
  document.addEventListener('pointerlockerror', () => {
    lockMode = false; lockPending = 0;
    setPaused(false);
    say('MOUSE CAPTURE UNAVAILABLE. STEER WITH THE CURSOR OR ARROW KEYS.', 6, 'warn');
  });

  requestAnimationFrame(frame);
}

/* Best effort: phones give far more usable screen in fullscreen landscape,
   but every one of these calls can be refused and the game must not care. */
function goFullscreen() {
  if (!TOUCH) return;
  try {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req && !document.fullscreenElement) {
      const r = req.call(el);
      if (r && r.catch) r.catch(() => { });
    }
  } catch (e) { /* refused */ }
  try {
    if (screen.orientation && screen.orientation.lock) {
      const r = screen.orientation.lock('landscape');
      if (r && r.catch) r.catch(() => { });
    }
  } catch (e) { /* refused */ }
}

function restart() {
  newRun();
  stick = null; lookTouch = null; touchMove.x = 0; touchMove.y = 0;
  touchCrouch = false; touchSprint = false; radioHeld = false;
  inGame = true; paused = false; showControls = false;
  clickGuard = performance.now() + 260;
  resumeAudio();
  lock();
}

let lockCool = 0;
function lock() {
  if (!lockMode) return;
  if (performance.now() < lockCool) return;
  lockCool = performance.now() + 1200;
  lockPending = performance.now();
  try {
    const r = canvas.requestPointerLock ? canvas.requestPointerLock() : null;
    if (r && r.catch) r.catch(() => { lockMode = false; lockPending = 0; });
  } catch (e) { lockMode = false; lockPending = 0; }
  // if the lock never lands, stop demanding it
  setTimeout(() => {
    if (lockPending && !locked()) { lockMode = false; lockPending = 0; }
  }, 700);
}

function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;

  const W = canvas.width, H = canvas.height;
  if (!W || !H) return;

  if (portraitBlock) {
    if (inGame && !ending) paused = true;
    drawRotateNotice(vctx, W, H);
    return;
  }

  if (atTitle) {
    if (!started) {
      started = true; genCity(12345);
      P.x = 24.5; P.y = 41.5; P.ang = -Math.PI / 2; P.pitch = .20;
      sealUnreachable(P.x | 0, P.y | 0);
    }
    P.ang += dt * 0.012;
    kaiju.dist = 210;
    kaiju.height = 170;
    kaiju.x = P.x + Math.cos(P.ang) * kaiju.dist;
    kaiju.y = P.y + Math.sin(P.ang) * kaiju.dist;
    renderWorld(camera());
    present();
    vctx.save();
    const v = vctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .9);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.85)');
    vctx.fillStyle = v; vctx.fillRect(0, 0, W, H);
    vctx.globalAlpha = .5; vctx.drawImage(GRAIN[(Math.random() * GRAIN.length) | 0], 0, 0, W, H); vctx.globalAlpha = 1;
    drawTitle(vctx, W, H);
    if (showAwards) drawAwardPanel(vctx, W, H);
    vctx.restore();
    return;
  }

  if (inGame && !ending && !paused) {
    if (freeLook && !locked()) {
      const dz = .10;
      const ax = Math.abs(freeLook.fx) < dz ? 0 : (freeLook.fx - Math.sign(freeLook.fx) * dz);
      const ay = Math.abs(freeLook.fy) < dz ? 0 : (freeLook.fy - Math.sign(freeLook.fy) * dz);
      P.ang += ax * 3.4 * dt;
      P.pitch = clamp(P.pitch - ay * 2.0 * dt, -PITCH_MAX, PITCH_MAX);
    }
    step(dt);
  }

  renderWorld(camera());
  present();
  drawOverlay(vctx, W, H, paused ? 0 : dt);
  updateTouchFlash(dt);
  drawTouchControls(vctx, W, H);

  if (ending) {
    if (locked()) document.exitPointerLock();
    drawEnd(vctx, W, H);
  } else if (paused) {
    drawPause(vctx, W, H);
  }
  if (showAwards) drawAwardPanel(vctx, W, H);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
</body>
