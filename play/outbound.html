const W=960,H=600;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let dpr=Math.min(window.devicePixelRatio||1,2);
function fit(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=W*dpr;cv.height=H*dpr;
  const s=Math.min(window.innerWidth/W,window.innerHeight/H);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',fit);fit();

for(const name in PLANET_ART){
  const a=PLANET_ART[name];
  a.img=new Image();
  a.ready=false;
  a.img.onload=()=>{
    // silhouette for camera-dark rendering
    const c=document.createElement('canvas');
    c.width=a.img.width;c.height=a.img.height;
    const cc=c.getContext('2d');
    cc.drawImage(a.img,0,0);
    cc.globalCompositeOperation='source-in';
    cc.fillStyle='#0e1622';
    cc.fillRect(0,0,c.width,c.height);
    a.sil=c;a.ready=true;
  };
  a.img.src='data:image/webp;base64,'+a.b64;
  delete a.b64;
}
function drawPlanetArt(a,img,bx,by,r){
  const drawW=(2*r/a.coreFrac);
  const scale=drawW/a.img.width;
  const drawH=a.img.height*scale;
  ctx.drawImage(img,bx-a.ax*drawW,by-a.ay*drawH,drawW,drawH);
}

// ---------- audio core ----------
let AC=null, noiseBuf=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  if(AC&&!noiseBuf){
    const n=AC.sampleRate*2|0;
    noiseBuf=AC.createBuffer(1,n,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  }
}
function tone(f,dur,type,vol,slide){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),AC.currentTime+dur);
  g.gain.setValueAtTime(vol||0.08,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur+0.02);
}
const SFX={
  toggle(){tone(320,0.06,'square',0.04);},
  signal(){tone(880,0.4,'sine',0.05,-120);setTimeout(()=>tone(760,0.5,'sine',0.05,-80),200);},
  fail(){tone(180,0.4,'sawtooth',0.07,-60);},
  discover(){tone(520,0.25,'sine',0.06,180);},
  flyby(){tone(240,0.5,'triangle',0.06,120);},
  die(){tone(140,1.6,'sine',0.08,-110);},
  type(){tone(1200+Math.random()*300,0.015,'square',0.015);},
  key(){tone(700,0.03,'square',0.02);}
};

// Turning systems off literally thins the soundscape until only
// the flight computer is left ticking.
// Sustained hums retired: too present. The soundscape is now silence,
// a slow computer heartbeat, and the sparse voices of nearby bodies.
const HUM_DEF={

const AMB={ready:false,hums:{},voices:{}};
function ambInit(){
  if(AMB.ready||!AC)return;
  for(const k in HUM_DEF){
    const d=HUM_DEF[k], g=AC.createGain();
    g.gain.value=0; g.connect(AC.destination);
    let src;
    if(d.noise){
      src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;
      const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=3000;f.Q.value=0.7;
      src.connect(f);f.connect(g);src.start();
    }else{
      src=AC.createOscillator();src.type=d.type;src.frequency.value=d.f;
      src.connect(g);src.start();
    }
    AMB.hums[k]={gain:g,vol:d.vol};
  }
  AMB.ready=true;
}
function ambTick(){
  if(!AMB.ready)return;
  const inRun=(mode==='run'&&run&&!run.paused);
  for(const k in AMB.hums){
    const h=AMB.hums[k];
    let target=0;
    if(inRun&&run.sys[k]&&run.sys[k].on&&run.sys[k].alive){
      target=h.vol;
      if(run.dead)target=k==='computer'?h.vol*clamp(1-run.shutdownT/2.5,0,1):0;
    }
    h.gain.gain.setTargetAtTime(target,AC.currentTime,0.7);
  }
  // the flight computer's heartbeat: one soft blip, every four seconds,
  // for as long as it lives. the only sound you make just by existing.
  if(inRun&&!run.dead&&AC.currentTime>=(AMB.beat||0)){
    AMB.beat=AC.currentTime+4;
    tone(520,0.06,'sine',0.022);
  }
}

// ---------- celestial voices ----------
// Each body kind speaks in the register of real plasma-wave
// recordings: whistlers, choruses, static, a dead probe's beacon.
// Heard through the radio; anomalies only through the magnetometer.
function voiceGate(b){
  if(!run)return false;
  if(b.magnetOnly)return run.sys.magneto.on&&run.sys.magneto.alive;
  return run.sys.radio.on&&run.sys.radio.alive;
}
function makeVoice(b){
  const v={body:b,sustain:[],t:0,next:0};
  function pad(f,type,vol){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;g.gain.value=0;
    o.connect(g);g.connect(AC.destination);o.start();
    v.sustain.push({o,g,vol});
  }
  switch(b.kind){
    case 'giant': pad(36,'sawtooth',0.042); break; // the KRONOS rumble stays
    default: break; // everyone else: sparse one-shots only, no sustained tones
  }
  v.kind=b.kind;
  return v;
}
function voiceTick(v,prox,dt){
  const g=voiceGate(v.body)?prox:0;
  for(const s of v.sustain)s.g.gain.setTargetAtTime(s.vol*g,AC.currentTime,0.55);
  if(g<=0.02)return;
  v.t+=dt;
  switch(v.kind){
    case 'giant': // descending whistlers over the rumble
      if(v.t>v.next){v.next=v.t+4+Math.random()*4;
        tone(650+Math.random()*350,1.3,'sine',0.034*g,-480);}
      break;
    case 'rock': // one low note, falling, rarely
      if(v.t>v.next){v.next=v.t+6+Math.random()*4;
        tone(200,0.9,'sine',0.024*g,-80);}
      break;
    case 'ice': // a whistler in a colder register
      if(v.t>v.next){v.next=v.t+5+Math.random()*4;
        tone(1700+Math.random()*300,1.1,'sine',0.020*g,-800);}
      break;
    case 'comet': // a call and its echo
      if(v.t>v.next){v.next=v.t+6+Math.random()*4;
        tone(1100,0.5,'sine',0.022*g,-200);
        setTimeout(()=>tone(980,0.5,'sine',0.017*g,-180),350);}
      break;
    case 'derelict': // a two-second beacon, still running
      if(v.t>v.next){v.next=v.t+2.2;
        tone(1050,0.09,'sine',0.056*g);
        setTimeout(()=>tone(1050,0.09,'sine',0.049*g),160);}
      break;
    case 'cloud': // a slow breath upward
      if(v.t>v.next){v.next=v.t+7+Math.random()*5;
        tone(300,2.4,'sine',0.020*g,70);}
      break;
    case 'anomaly': // something very deep, sinking
      if(v.t>v.next){v.next=v.t+8+Math.random()*4;
        tone(92,3,'sine',0.034*g,-50);}
      break;
  }
}
function killVoice(v){
  for(const s of v.sustain){
    s.g.gain.setTargetAtTime(0,AC.currentTime,0.2);
    setTimeout(()=>{try{s.o.stop();}catch(e){}},600);
  }
}
function voicesUpdate(dt){
  if(!AC||mode!=='run'||!run)return;
  // nearest 2 audible bodies within 1300
  const near=[];
  for(const b of BODIES){
    const d=Math.hypot(b.x-run.x,b.y-run.y);
    if(d<1300)near.push({b,d});
  }
  near.sort((a,c)=>a.d-c.d);
  const keep=new Set();
  near.slice(0,2).forEach(({b,d})=>{
    keep.add(b.name);
    if(!AMB.voices[b.name]){
      const v=makeVoice(b);AMB.voices[b.name]=v;
    }
    const prox=clamp(1-d/1300,0,1);
    voiceTick(AMB.voices[b.name],prox*prox,dt);
  });
  for(const name in AMB.voices){
    if(!keep.has(name)){killVoice(AMB.voices[name]);delete AMB.voices[name];}
  }
}
function voicesClear(){
  for(const name in AMB.voices){killVoice(AMB.voices[name]);delete AMB.voices[name];}
}


// ---------- sparse piano ----------
// A few soft felt notes from home, thinning as you go. Never busier
// than the bodies' voices; the deep runs are nearly without music.
const PIANO_SCALE=[110,130.81,146.83,164.81,196,220,261.63,293.66,329.63,392];
function pianoNote(f,vol){
  if(!AC)return;
  const partials=[[1,1,3.8],[2,0.35,2.2],[3,0.12,1.2],[4.2,0.05,0.6]];
  for(const [m,pv,dec] of partials){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=f*m*(1+(Math.random()-0.5)*0.0015);
    g.gain.setValueAtTime(0,AC.currentTime);
    g.gain.linearRampToValueAtTime(vol*pv,AC.currentTime+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dec);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+dec+0.05);
  }
}
function pianoTick(){
  if(!AC||mode!=='run'||!run||run.dead||run.paused)return;
  if(AC.currentTime<(AMB.pianoT||0))return;
  // sparser with distance: near home a note every ~9-17s, out deep every ~25-45s
  const stretch=1+au()/18;
  AMB.pianoT=AC.currentTime+(9+Math.random()*8)*stretch;
  const f=PIANO_SCALE[Math.floor(Math.random()*PIANO_SCALE.length)];
  pianoNote(f,0.035);
  if(Math.random()<0.28){
    const f2=PIANO_SCALE[Math.floor(Math.random()*PIANO_SCALE.length)];
    setTimeout(()=>pianoNote(f2,0.026),700+Math.random()*500);
  }
}

    if(mode==='run'&&run&&!run.overlay&&inCircle(p,STEER_R)){activeTouches[t.identifier]={steer:1};continue;}
    activeTouches[t.identifier]={steer:0};

    if(a.steer!==0){
      // allow sliding between the two steer pads
      if(inCircle(p,STEER_L))a.steer=-1;

function nearestBodyDist(){
  let bd=1e9;
  for(const b of BODIES){const d=Math.hypot(b.x-run.x,b.y-run.y);if(d<bd)bd=d;}
  return bd;
}
function update(rdt){
  if(mode!=='run')return;
  if(run.dead){
    run.shutdownT+=rdt;
    if(run.shutdownT>1.6&&!run.lastwordsDone&&!run.overlay){
      run.overlay={type:'lastwords',pick:[null,null,null]};
    }
    return;
  }
  if(run.overlay||run.paused)return;

  // auto time acceleration in the empty stretches
  const nb=nearestBodyDist();
  const targetTs=nb>1500?3:1;
  run.ts=lerp(run.ts,targetTs,Math.min(1,rdt*2));
  const dt=rdt*run.ts;

  run.t+=dt;

  // opening beats: a verb, a rule, a warning
  if(run.introStep===0&&run.t>1.5){run.introStep=1;toast('Witness what you can. Go as far as you can.',WARM);}
  else if(run.introStep===1&&run.t>6.5){run.introStep=2;toast('Your generator only falls. Everything left on spends it.',VEC);}
  else if(run.introStep===2&&run.t>12){run.introStep=3;toast('The magnetometer is off. Some things cannot be seen any other way.',FIELDCOL);}

  // steering
  const canSteer=run.sys.gyros.on&&run.sys.gyros.alive&&run.prop>0;
  if(canSteer){
    let turn=touchSteer();
    if(keys['KeyA']||keys['ArrowLeft'])turn=-1;
    if(keys['KeyD']||keys['ArrowRight'])turn=1;
    if(turn!==0){
      run.heading+=turn*32*D2R*rdt; // steering feel stays real-time
      run.prop=Math.max(0,run.prop-6*rdt);
    }
  }

  const vx=Math.cos(run.heading)*run.speed,vy=Math.sin(run.heading)*run.speed;
  run.x+=vx*dt;run.y+=vy*dt;
  run.distPx+=run.speed*dt;

  // power
  const out=rtgOut(),dw=drawW();
  run.brownout=dw>out;
  if(run.brownout&&Math.random()<0.08*dt*5){
    const cands=Object.keys(run.sys).filter(k=>k!=='computer'&&run.sys[k].alive&&run.sys[k].on);
    if(cands.length){
      const k=cands[Math.floor(Math.random()*cands.length)];
      run.sys[k].alive=false;run.sys[k].on=false;
      toast(run.sys[k].label+' burned out in the brownout.',ALERT);
      SFX.fail();
    }
  }
  if(out<=run.sys.computer.draw){run.dead=true;SFX.die();voicesClear();return;}

  // transmit
  if(run.txT>0){
    run.txT-=dt;
    if(run.txT<=0){
      run.sent+=run.data;run.data=0;
      toast('Archive transmitted. '+(au()>25?'No acknowledgment expected.':'Acknowledgment in '+(au()*8.3|0)+' minutes, if anyone is listening.'),VEC);
    }
  }

  // cold failures
  run.failT-=dt;
  if(run.failT<=0){
    run.failT=12;
    const heat=run.sys.heaters.on&&run.sys.heaters.alive;
    const p=0.10*(heat?1:2.6)*(1+au()/40);
    if(Math.random()<p){
      const cands=Object.keys(run.sys).filter(k=>k!=='computer'&&run.sys[k].alive);
      if(cands.length){
        const k=cands[Math.floor(Math.random()*cands.length)];
        run.overlay={type:'event',sysKey:k,flavor:FAIL_FLAVOR[k]};
        SFX.fail();
      }
    }
  }

  // mid-leg events, only in the empty stretches
  run.legT-=dt;
  if(run.legT<=0&&nb>1200&&au()>1){
    run.legT=70+Math.random()*45;
    const roll=Math.random();
    if(roll<0.4){
      const cands=Object.keys(run.sys).filter(k=>k!=='computer'&&run.sys[k].alive);
      if(cands.length){
        const k=cands[Math.floor(Math.random()*cands.length)];
        run.overlay={type:'event',sysKey:k,flavor:'A micrometeorite came through without knocking. '+FAIL_FLAVOR[k]};
        SFX.fail();
      }
    }else if(roll<0.7&&au()<10){
      run.overlay={type:'flare'};SFX.fail();
    }else if(run.sys.camera.alive&&!run.dusty){
      run.overlay={type:'dust'};
    }
  }

  // signals
  if(run.signalIdx<SIGNALS.length){
    const s=SIGNALS[run.signalIdx];
    if(au()>=s.au){
      run.signalIdx++;
      if(Math.random()<=s.chance){
        if(run.sys.radio.on&&run.sys.radio.alive){
          run.overlay={type:'signal',sig:s,shown:0};
          run.heard++;AtlasStore.signals[s.from]=s;SFX.signal();
        }else{
          run.missed++;
          toast('carrier detected. receiver dark.',DIM);
        }
      }
    }
  }

  // bodies: layered discovery + flyby
  for(const b of BODIES){
    const d=Math.hypot(b.x-run.x,b.y-run.y);
    if(d<900){
      const rec=layerRec(b.name);
      if(!b.magnetOnly&&!rec.photo&&run.sys.camera.on&&run.sys.camera.alive){
        rec.photo=true;run.witnessed++;
        const gained=run.dusty?4:8;
        run.data+=gained;
        toast(b.name+' photographed'+(run.dusty?' through a fogged lens':'')+'. +'+gained+' data.',VEC);
        SFX.discover();
      }
      if(!b.magnetOnly&&!rec.comp&&run.sys.spectro.on&&run.sys.spectro.alive){
        rec.comp=true;run.data+=5;
        toast(b.name+': '+b.comp+'. +5 data.',COMPCOL);
        SFX.discover();
      }
      if(!rec.field&&run.sys.magneto.on&&run.sys.magneto.alive){
        rec.field=true;run.data+=5;
        if(b.magnetOnly)run.witnessed++;
        toast(b.name+': '+b.fieldLine+' +5 data.',FIELDCOL);
        SFX.discover();
      }
    }
    if(b.magnetOnly&&!run.magHint&&d<1200&&!(run.sys.magneto.on&&run.sys.magneto.alive)){
      run.magHint=true;
      toast('the magnetometer boom twitches. it is switched off.',FIELDCOL);
    }
    if(b.exits&&!b.visited&&d<b.influence){
      b.visited=true;
      run.overlay={type:'flyby',body:b,velaDone:false};
      SFX.flyby();
    }
  }

  for(let i=run.toasts.length-1;i>=0;i--){
    const t=run.toasts[i];t.t+=rdt;
    if(t.t>t.life)run.toasts.splice(i,1);
  }
}

// ---------- garble ----------
function garble(text,level){
  if(level<=0)return text;
  let out='';
  for(const ch of text){
    if(ch!==' '&&Math.random()<level)out+='\u00b7';
    else out+=ch;
  }
  return out;
}

// ---------- render helpers ----------
function wrapText(text,x,y,maxW,lh,align){
  ctx.textAlign=align||'left';
  const words=text.split(' ');let line='',yy=y;
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,yy);line=w;yy+=lh;}
    else line=test;
  }
  if(line)ctx.fillText(line,x,yy);
  return yy;
}


function labelPill(x,y,text,color,alpha,size){
  ctx.font=size+'px "Helvetica Neue",Helvetica,Arial,sans-serif';
  ctx.textAlign='center';
  const w=ctx.measureText(text).width;
  ctx.fillStyle='rgba(3,6,10,0.72)';
  ctx.fillRect(x-w/2-5,y-size,w+10,size+6);
  ctx.fillStyle=rgba(color,alpha);
  ctx.fillText(text,x,y);
}

// ---------- render ----------
function render(){
  clickables=[];
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(mode==='title'){renderTitle();handleClicks();return;}
  if(mode==='name'){renderName();handleClicks();return;}
  if(mode==='atlas'){renderAtlas();handleClicks();return;}
  if(mode==='dead'){renderDead();handleClicks();return;}

  const camX=run.x-W*0.38,camY=run.y-H/2;
  const g=ctx.createLinearGradient(0,0,W,0);
  const sunFade=clamp(1-au()/30,0,1);
  g.addColorStop(0,rgba('#101a2c',0.9));
  g.addColorStop(1,rgba('#05080e',1));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  const tnow=performance.now()/1000;
  for(const s of stars){
    const sx=(s.x-camX*s.z),sy=(s.y-camY*s.z);
    if(sx<-4||sx>W+4||sy<-4||sy>H+4)continue;
    const tw=0.75+0.25*Math.sin(tnow*1.3+s.tw);
    ctx.fillStyle='rgba(210,225,240,'+(s.b*tw*0.9).toFixed(3)+')';
    ctx.fillRect(sx,sy,s.z>0.8?1.6:1,s.z>0.8?1.6:1);
  }
  {
    const sx=SUN.x-camX,sy=SUN.y-camY;
    const rad=900*sunFade+120;
    if(sx>-rad&&sx<W+rad&&sunFade>0.02){
      const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,rad);
      sg.addColorStop(0,rgba('#ffe8c0',0.5*sunFade));
      sg.addColorStop(0.25,rgba('#ffcf90',0.12*sunFade));
      sg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,rad,0,TAU);ctx.fill();
    }
  }

  const camOn=run.sys.camera.on&&run.sys.camera.alive;
  const specOn=run.sys.spectro.on&&run.sys.spectro.alive;
  const magOn=run.sys.magneto.on&&run.sys.magneto.alive;

  for(const b of BODIES){
    const bx=b.x-camX,by=b.y-camY;
    if(bx<-300||bx>W+300||by<-300||by>H+300)continue;
    const d=Math.hypot(b.x-run.x,b.y-run.y);
    const rec=AtlasStore.layers[b.name];
    if(b.magnetOnly){
      if(magOn&&d<1400){
        for(let i=0;i<3;i++){
          const rr=b.r*(0.7+i*0.45)+Math.sin(tnow*1.5+i)*6;
          ctx.strokeStyle=rgba(b.color,0.28-i*0.07);
          ctx.lineWidth=1.2;
          ctx.beginPath();ctx.arc(bx,by,rr,0,TAU);ctx.stroke();
        }
        if(rec&&rec.field){
          labelPill(bx,by-b.r*1.6-12,b.name,FIELDCOL,0.95,10);
        }
      }
      continue;
    }
    const art=PLANET_ART[b.name];
    if(art&&art.ready){
      // camera dark: silhouette only; camera live and near: the render itself
      if(camOn&&d<1300)drawPlanetArt(art,art.img,bx,by,b.r);
      else drawPlanetArt(art,art.sil,bx,by,b.r);
    }else{
      ctx.fillStyle=rgba('#0e1622',0.9);
      ctx.beginPath();ctx.arc(bx,by,b.r,0,TAU);ctx.fill();
    }
    if(camOn&&d<1300){
      if(!(art&&art.ready)){
        const shade=ctx.createRadialGradient(bx-b.r*0.4,by-b.r*0.4,b.r*0.1,bx,by,b.r);
        shade.addColorStop(0,rgba(b.color,0.85));
        shade.addColorStop(1,rgba(b.color,0.12));
        ctx.fillStyle=shade;
        ctx.beginPath();ctx.arc(bx,by,b.r,0,TAU);ctx.fill();
        if(b.kind==='giant'){
          ctx.strokeStyle=rgba('#8a7850',0.4);ctx.lineWidth=3;
          for(let i=-1;i<=1;i++){
            ctx.beginPath();ctx.ellipse(bx,by+i*b.r*0.35,b.r*0.92,b.r*0.28,0,0,Math.PI);ctx.stroke();
          }
        }
        if(b.kind==='derelict'){
          ctx.strokeStyle=rgba('#d8e0e8',0.7);ctx.lineWidth=1.2;
          ctx.beginPath();ctx.moveTo(bx-14,by+10);ctx.lineTo(bx+16,by-12);ctx.stroke();
          ctx.beginPath();ctx.arc(bx+8,by-6,7,0,TAU);ctx.stroke();
        }
      }
      if(rec&&rec.photo){
        let top=by-b.r;
        if(art&&art.ready){
          const dw=2*b.r/art.coreFrac;
          top=by-art.ay*(art.img.height*(dw/art.img.width));
        }
        if(specOn&&rec.comp){
          labelPill(bx,top-8,b.comp,COMPCOL,0.85,9);
          labelPill(bx,top-24,b.name,VEC,0.95,11);
        }else{
          labelPill(bx,top-8,b.name,VEC,0.95,11);
        }
      }
    }
  }

  {
    const px=run.x-camX,py=run.y-camY;
    ctx.strokeStyle=rgba(VEC,0.35);ctx.lineWidth=1;
    ctx.setLineDash([2,7]);
    ctx.beginPath();ctx.moveTo(px,py);
    ctx.lineTo(px+Math.cos(run.heading)*640,py+Math.sin(run.heading)*640);
    ctx.stroke();ctx.setLineDash([]);
    ctx.save();
    ctx.translate(px,py);
    if(PROBE_READY){
      ctx.rotate(run.t*0.13);
      const sw=56,sh=sw*(PROBE_SPRITE.height/PROBE_SPRITE.width);
      ctx.drawImage(PROBE_SPRITE,-sw/2,-sh/2,sw,sh);
    }else{
      ctx.rotate(run.heading);
      ctx.strokeStyle=rgba('#e8f0f8',0.95);ctx.lineWidth=1.4;
      ctx.strokeRect(-5,-3,10,6);
      ctx.beginPath();ctx.arc(6,0,4,0,TAU);ctx.stroke();
    }
    ctx.restore();
  }

  {
    const v=clamp(au()/45,0,0.5);
    const vg=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.85);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,'+(0.25+v)+')');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  }

  renderHUD();
  renderToasts();
  if(run.paused){
    ctx.fillStyle='rgba(0,0,4,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle=rgba(VEC,0.9);ctx.font='14px "Helvetica Neue",Helvetica,Arial,sans-serif';
    ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2);
  }
  if(run.overlay)renderOverlay();
  if(run.dead&&!run.overlay){
    ctx.fillStyle='rgba(0,0,0,'+clamp(run.shutdownT/3,0,1)+')';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle=rgba(DIM,clamp(run.shutdownT/2,0,0.9));
    ctx.font='12px "Helvetica Neue",Helvetica,Arial,sans-serif';
    ctx.textAlign='center';
    ctx.fillText('power below flight computer minimum',W/2,H/2);
  }
  handleClicks();
}

function renderHUD(){
  const flick=run.brownout&&Math.sin(performance.now()/60)>0?0.4:1;
  ctx.globalAlpha=flick;
  ctx.font='11px "Helvetica Neue",Helvetica,Arial,sans-serif';
  ctx.textAlign='left';
  ctx.fillStyle=rgba(VEC,0.9);
  ctx.fillText(run.name,16,22);
  ctx.fillStyle=rgba(VEC,0.6);
  ctx.fillText(au().toFixed(1)+' AU'+(run.ts>1.6?'  \u00d73':''),16,38);
  const out=rtgOut(),dw=drawW();
  ctx.fillStyle=run.brownout?rgba(ALERT,0.95):rgba(VEC,0.7);
  ctx.fillText('RTG '+out.toFixed(0)+'W \u00b7 DRAW '+dw.toFixed(0)+'W'+(run.brownout?'  BROWNOUT':''),16,54);
  ctx.fillStyle=rgba(VEC,0.55);
  ctx.fillText('PROP '+run.prop.toFixed(0)+' \u00b7 DATA '+run.data+' \u00b7 SENT '+run.sent,16,70);
  if(run.dusty){
    ctx.fillStyle=rgba(ALERT,0.7);
    ctx.fillText('LENS FOGGED',16,86);
    if(run.prop>=10)button(16,92,130,20,'REORIENT \u00b7 10 PROP',()=>{run.prop-=10;run.dusty=false;toast('Lens clear. The dust went its own way.',VEC);});
  }

  const px=W-176,py=14;
  let i=0;
  for(const k in run.sys){
    const s=run.sys[k];
    const y=py+i*24;i++;
    const col=!s.alive?'#6b4a44':(s.on?VEC:DIM);
    ctx.fillStyle=rgba(col,!s.alive?0.8:(s.on?0.95:0.5));
    ctx.textAlign='left';
    ctx.fillText((s.alive?(s.on?'\u25a0 ':'\u25a1 '):'\u2715 ')+s.label,px,y+14);
    ctx.textAlign='right';
    ctx.fillStyle=rgba(col,0.5);
    ctx.fillText(s.alive?s.draw+'W':'DEAD',px+150,y+14);
    if(!s.locked&&s.alive){
      clickables.push({x:px-6,y:y-2,w:166,h:24,fn:((key)=>()=>{
        run.sys[key].on=!run.sys[key].on;SFX.toggle();
      })(k)});
    }
  }
  if(run.sys.radio.on&&run.sys.radio.alive&&run.data>0&&run.txT<=0&&!run.dead){
    button(W-176,py+7*24+6,150,22,'TRANSMIT ARCHIVE (+25W)',()=>{run.txT=5;toast('Transmitting. Draw increased.',WARM);});
  }else if(run.txT>0){
    ctx.textAlign='left';
    ctx.fillStyle=rgba(WARM,0.9);
    ctx.fillText('TRANSMITTING '+Math.ceil(run.txT)+'s',W-176,py+7*24+20);
  }
  ctx.textAlign='center';
  ctx.fillStyle=rgba(DIM,0.7);
  const canSteer=run.sys.gyros.on&&run.sys.gyros.alive&&run.prop>0;
  if(IS_TOUCH){
    ctx.fillText(canSteer?'hold the arrows to steer \u00b7 tap systems to shed load':'no attitude control',W/2,H-14);
    const st=touchSteer();
    [[STEER_L,'\u25c0',st<0],[STEER_R,'\u25b6',st>0]].forEach(([c,glyph,on])=>{
      ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,TAU);
      ctx.fillStyle=rgba(VEC,on?0.16:0.05);ctx.fill();
      ctx.strokeStyle=rgba(VEC,canSteer?(on?0.8:0.35):0.15);ctx.lineWidth=1.4;ctx.stroke();
      ctx.fillStyle=rgba(VEC,canSteer?(on?1:0.55):0.2);
      ctx.font='18px "Helvetica Neue",Helvetica,Arial,sans-serif';
      ctx.fillText(glyph,c.x,c.y+6);
    });
  }else{
    ctx.fillText((canSteer?'A / D nudge heading':'no attitude control'+(run.prop<=0?' \u00b7 propellant spent':''))+' \u00b7 P pause \u00b7 click systems to shed load',W/2,H-14);
  }
  ctx.globalAlpha=1;
}

function renderToasts(){
  ctx.font='11px "Helvetica Neue",Helvetica,Arial,sans-serif';
  ctx.textAlign='center';
  let y=H-44;
  for(const t of run.toasts){
    const a=t.t<0.3?t.t/0.3:(t.t>t.life-0.8?(t.life-t.t)/0.8:1);
    ctx.fillStyle=rgba(t.color,0.9*clamp(a,0,1));
    ctx.fillText(t.txt,W/2,y);y-=16;
  }
}

function renderOverlay(){
  const o=run.overlay;
  ctx.fillStyle='rgba(0,0,4,0.72)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';

  if(o.type==='signal'){
    o.shown=(o.shown||0)+2.2;
    const s=o.sig;
    const lvl=clamp((s.au-14)/50,0,0.5);
    if(!o.cached){o.cached=garble(s.text,s.au>=28?lvl:lvl*0.6);o.degraded=o.cached!==s.text;}
    const shownText=o.cached.slice(0,o.shown|0);
    if((o.shown|0)%3===0&&o.shown<o.cached.length)SFX.type();
    ctx.fillStyle=rgba(WARM,0.55);
    ctx.font='10px "Helvetica Neue",Helvetica,Arial,sans-serif';
    ctx.fillText('INCOMING TRANSMISSION \u00b7 '+(au()*8.3|0)+' LIGHT-MINUTES OLD',W/2,150);
    if(o.degraded){
      ctx.fillStyle=rgba(ALERT,0.6);
      ctx.fillText('SIGNAL DEGRADED AT THIS RANGE \u00b7 PACKETS LOST',W/2,136);
    }
    ctx.fillStyle=rgba(WARM,0.95);
    ctx.font='12px "Helvetica Neue",Helvetica,Arial,sans-serif';
    ctx.fillText(s.from,W/2,174);
    ctx.font='13px Georgia,serif';
    ctx.fillStyle=rgba('#ffe8c8',0.95);
    wrapText(shownText,W/2,210,560,22,'center');
    if(o.shown>=o.cached.length){
      button(W/2-70,H-130,140,26,'CONTINUE',()=>{run.overlay=null;});
    }else{
      clickables.push({x:0,y:0,w:W,h:H,fn:()=>{o.shown=o.cached.length;}});
    }
  }

  if(o.type==='event'){
    const k=o.sysKey,s=run.sys[k];
    ctx.fillStyle=rgba(ALERT,0.95);
    ctx.font='13px "Helvetica Neue",Helvetica,Arial,sans-serif';
    ctx.fillText('FAULT \u00b7 '+s.label,W/2,200);
    ctx.fillStyle=rgba('#e8d8d0',0.9);
    ctx.font='13px Georgia,serif';
    wrapText(o.flavor||'A component failed in the cold.',W/2,232,520,20,'center');
    button(W/2-190,300,175,30,'SALVAGE \u00b7 +24 PROPELLANT',()=>{
      s.alive=false;s.on=false;run.prop+=24;run.overlay=null;
      toast(s.label+' stripped for reaction mass.',DIM);
    });
    button(W/2+15,300,175,30,'BYPASS \u00b7 50% \u00b7 +30% DRAW',()=>{
      if(Math.random()<0.5){
        s.draw=Math.round(s.draw*1.3);
        toast(s.label+' restored on a jury line. Draw increased.',VEC);
      }else{
        s.alive=false;s.on=false;
        toast('Bypass failed. '+s.label+' is gone.',ALERT);
      }
      run.overlay=null;
    });
  }

  if(o.type==='flare'){
    ctx.fillStyle=rgba(ALERT,0.95);
    ctx.font='13px "Helvetica Neue",Helvetica,Arial,sans-serif';
    ctx.fillText('SOLAR FLARE INBOUND',W/2,200);
    ctx.fillStyle=rgba('#e8d8d0',0.9);
    ctx.font='13px Georgia,serif';
    wrapText('The sun cleared its throat. A particle front arrives in minutes.',W/2,232,520,20,'center');
    button(W/2-200,300,185,30,'REORIENT SHIELDING \u00b7 10 PROP',()=>{
      run.prop=Math.max(0,run.prop-10);run.overlay=null;
      toast('You turned your back to it. It passed.',VEC);
    });
    button(W/2+15,300,185,30,'RIDE IT OUT \u00b7 35% BURN',()=>{
      if(Math.random()<0.35){
        const cands=Object.keys(run.sys).filter(k=>k!=='computer'&&run.sys[k].alive);
        if(cands.length){
          const k=cands[Math.floor(Math.random()*cands.length)];
          run.sys[k].alive=false;run.sys[k].on=false;
          toast(run.sys[k].label+' took the flare badly.',ALERT);SFX.fail();
        }
      }else toast('It washed over you and moved on.',DIM);
      run.overlay=null;
    });
  }

  if(o.type==='dust'){
    ctx.fillStyle=rgba(DIM,0.95);
    ctx.font='13px "Helvetica Neue",Helvetica,Arial,sans-serif';
    ctx.fillText('DUST LANE',W/2,200);
    ctx.fillStyle=rgba('#d8dce8',0.9);
    ctx.font='13px Georgia,serif';
    wrapText('You crossed the wake of something old. Fine grit is settling on the camera lens. Photographs will suffer until you shake it loose.',W/2,232,520,20,'center');
    button(W/2-70,300,140,28,'CONTINUE',()=>{run.dusty=true;run.overlay=null;});
  }

  if(o.type==='flyby'){
    const b=o.body;
    ctx.fillStyle=rgba(VEC,0.95);
    ctx.font='14px "Helvetica Neue",Helvetica,Arial,sans-serif';
    ctx.fillText('GRAVITY ASSIST \u00b7 '+b.name,W/2,160);
    ctx.fillStyle=rgba('#cddcec',0.85);
    ctx.font='13px Georgia,serif';
    wrapText(b.lore,W/2,190,520,20,'center');

    if(b.kind==='derelict'&&!o.velaDone){
      const radioOk=run.sys.radio.on&&run.sys.radio.alive;
      ctx.fillStyle=radioOk?rgba(WARM,0.9):rgba(DIM,0.8);
      ctx.font='12px Georgia,serif';
      wrapText(radioOk?VELA_LOG:'Its beacon repeats, two seconds, patient. Your receiver is dark. Whatever it has been saying, it says to no one.',W/2,236,540,19,'center');
      button(W/2-200,330,185,30,'SALVAGE \u00b7 +20 PROP \u00b7 +3W',()=>{
        run.prop+=20;run.rtgBonus+=3;o.velaDone=true;
        AtlasStore.vela='stripped';
        toast('You took what it no longer needed. Its dish still points home.',DIM);
      });
      button(W/2+15,330,185,30,'LEAVE IT POINTING HOME',()=>{
        o.velaDone=true;
        AtlasStore.vela='left';
        toast('You passed close enough to touch, and did not.',WARM);
      });
      ctx.fillStyle=rgba(DIM,0.7);
      ctx.font='10px "Helvetica Neue",Helvetica,Arial,sans-serif';
      ctx.fillText('either way is permanent. either way is remembered.',W/2,382);
      return;
    }

    ctx.fillStyle=rgba(DIM,0.8);
    ctx.font='11px "Helvetica Neue",Helvetica,Arial,sans-serif';
    ctx.fillText('choose an exit trajectory. there is no coming back.',W/2,262);
    const n=b.exits.length,bw=200;
    b.exits.forEach((ex,i)=>{
      const x=W/2-(n*bw+(n-1)*14)/2+i*(bw+14);
      button(x,296,bw,32,ex[1],()=>{
        run.heading=ex[0]*D2R;
        run.speed=Math.min(64,run.speed+6);
        run.overlay=null;
        toast('Assist complete. Velocity increased.',VEC);
      });
    });
  }

  if(o.type==='lastwords'){
    ctx.fillStyle=rgba(WARM,0.9);
    ctx.font='13px "Helvetica Neue",Helvetica,Arial,sans-serif';
    ctx.fillText('FINAL TRANSMISSION \u00b7 LAST RESERVE POWER',W/2,96);
    ctx.fillStyle=rgba(DIM,0.8);
    ctx.font='11px "Helvetica Neue",Helvetica,Arial,sans-serif';
    ctx.fillText('compose it. three lines is all the budget allows.',W/2,116);
    const cols=[LAST_OPEN,LAST_MID,LAST_CLOSE];
    cols.forEach((pool,ci)=>{
      const x=W/2-310+ci*220;
      pool.forEach((frag,fi)=>{
        const y=150+fi*42;
        const sel=o.pick[ci]===fi;
        clickables.push({x:x-10,y:y-14,w:210,h:36,fn:()=>{o.pick[ci]=fi;SFX.key();}});
        ctx.fillStyle=sel?rgba(WARM,0.95):rgba('#cdd8e4',0.5);
        ctx.font=(sel?'italic ':'')+'11px Georgia,serif';
        ctx.textAlign='left';
        wrapText(frag,x,y,200,13,'left');
        if(sel){ctx.strokeStyle=rgba(WARM,0.5);ctx.strokeRect(x-10,y-14,210,36);}
      });
    });
    ctx.textAlign='center';
    if(o.pick.every(p=>p!==null)){
      const msg=LAST_OPEN[o.pick[0]]+' '+LAST_MID[o.pick[1]]+' '+LAST_CLOSE[o.pick[2]];
      const radioOk=run.sys.radio.alive;
      button(W/2-110,H-64,220,30,radioOk?'TRANSMIT FINAL':'RECORD \u00b7 RADIO GONE',()=>{
        run.lastwordsDone=true;run.overlay=null;run.finalMsg=msg;run.finalSent=radioOk;
        AtlasStore.legacy.unshift({name:run.name,au:au(),witnessed:run.witnessed,sent:run.sent,msg,sentHome:radioOk});
        setTimeout(()=>{mode='dead';},50);
      },radioOk?WARM:DIM);
    }
  }
}

function renderTitle(){
  const t=performance.now()/1000;
  for(const s of stars){
    const sx=((s.x-t*8*s.z)%(W+40)+W+40)%(W+40)-20;
    const sy=(s.y%(H+40)+H+40)%(H+40)-20;
    ctx.fillStyle='rgba(210,225,240,'+(s.b*0.5)+')';
    ctx.fillRect(sx,sy,1,1);
  }
  ctx.textAlign='center';
  ctx.fillStyle='rgba(232,240,248,0.95)';
  ctx.font='300 46px "Helvetica Neue",Helvetica,Arial,sans-serif';
  ctx.fillText('O U T B O U N D',W/2,180);
  ctx.fillStyle=rgba(VEC,0.6);
  ctx.font='13px Georgia,serif';
  ctx.fillText('one probe. one trajectory. see how far.',W/2,212);
  ctx.fillStyle=rgba(DIM,0.85);
  ctx.font='12px "Helvetica Neue",Helvetica,Arial,sans-serif';
  const rules=[
    'Your generator loses a fifth of a watt every second, forever.',
    'Everything you keep on costs watts. Everything you shut off goes dark, and goes quiet.',
    'Instruments are how you see. Nearby worlds speak, if the right receiver is alive.',
    'Sometimes home says something. Sometimes you get to say something back.'
  ];
  rules.forEach((l,i)=>ctx.fillText(l,W/2,280+i*22));
  button(W/2-160,400,150,32,'LAUNCH',()=>{enterNameMode();});
  button(W/2+10,400,150,32,'ATLAS \u00b7 '+layerCount()+' / '+layerTotal(),()=>{atlasTab='bodies';mode='atlas';});
}

function renderName(){
  ctx.textAlign='center';
  ctx.fillStyle=rgba(VEC,0.9);
  ctx.font='300 20px "Helvetica Neue",Helvetica,Arial,sans-serif';
  ctx.fillText('DESIGNATE THE PROBE',W/2,170);
  ctx.fillStyle='rgba(232,240,248,0.95)';
  ctx.font='300 34px "Helvetica Neue",Helvetica,Arial,sans-serif';
  const cursor=Math.sin(performance.now()/280)>0?'_':' ';
  ctx.fillText(pendingName+cursor,W/2,240);
  ctx.strokeStyle=rgba(VEC,0.4);
  ctx.strokeRect(W/2-180,206,360,48);
  clickables.push({x:W/2-180,y:206,w:360,h:48,fn:()=>{nameInput.value=pendingName;nameInput.focus();}});
  ctx.fillStyle=rgba(DIM,0.8);
  ctx.font='11px "Helvetica Neue",Helvetica,Arial,sans-serif';
  ctx.fillText('type a name, or take a suggestion',W/2,282);
  button(W/2-230,310,140,28,'SUGGEST',()=>{pendingName=genName();});
  button(W/2-70,310,140,28,'CLEAR',()=>{pendingName='';});
  button(W/2+90,310,140,28,'LAUNCH',()=>{if(pendingName.trim()){nameInput.blur();newRun(pendingName.trim());mode='run';}},WARM);
  if(AtlasStore.legacy.length){
    ctx.fillStyle=rgba(DIM,0.6);
    ctx.font='10px "Helvetica Neue",Helvetica,Arial,sans-serif';
    const prev=AtlasStore.legacy[0];
    ctx.fillText('the last one was called '+prev.name+'. it reached '+prev.au.toFixed(1)+' AU.',W/2,380);
  }
}

function renderAtlas(){
  ctx.textAlign='center';
  ctx.fillStyle=rgba(VEC,0.9);
  ctx.font='300 22px "Helvetica Neue",Helvetica,Arial,sans-serif';
  ctx.fillText('THE ATLAS',W/2,44);
  button(W/2-240,58,140,24,'BODIES',()=>{atlasTab='bodies';},atlasTab==='bodies'?WARM:VEC);
  button(W/2-70,58,140,24,'PROBES \u00b7 '+AtlasStore.legacy.length,()=>{atlasTab='probes';},atlasTab==='probes'?WARM:VEC);
  button(W/2+100,58,140,24,'SIGNALS \u00b7 '+Object.keys(AtlasStore.signals).length,()=>{atlasTab='signals';},atlasTab==='signals'?WARM:VEC);

  if(atlasTab==='bodies'){
    ctx.fillStyle=rgba(DIM,0.8);
    ctx.font='11px "Helvetica Neue",Helvetica,Arial,sans-serif';
    const pct=Math.round(layerCount()/layerTotal()*100);
    ctx.fillText(layerCount()+' of '+layerTotal()+' readings taken \u00b7 '+pct+'% \u00b7 photograph / composition / field',W/2,100);
    const cols=5,cw=176,ch=88,ox=(W-cols*cw)/2+cw/2,oy=140;
    BODIES.forEach((b,i)=>{
      const x=ox+(i%cols)*cw,y=oy+Math.floor(i/cols)*ch;
      const rec=AtlasStore.layers[b.name];
      const known=bodyKnown(b.name);
      ctx.strokeStyle=rgba(known?b.color:'#25303c',known?0.9:0.7);
      ctx.lineWidth=1.4;
      if(b.magnetOnly){
        ctx.setLineDash([3,4]);
        ctx.beginPath();ctx.arc(x,y,15,0,TAU);ctx.stroke();
        ctx.setLineDash([]);
      }else{
        ctx.fillStyle=rgba(known?b.color:'#141c26',known?0.35:0.8);
        ctx.beginPath();ctx.arc(x,y,15,0,TAU);ctx.fill();ctx.stroke();
      }
      ctx.fillStyle=rgba(known?VEC:'#2c3844',0.9);
      ctx.font='10px "Helvetica Neue",Helvetica,Arial,sans-serif';
      ctx.fillText(known?b.name:'\u2014',x,y+29);
      // layer dots
      const dots=b.magnetOnly?[['field',FIELDCOL]]:[['photo',VEC],['comp',COMPCOL],['field',FIELDCOL]];
      dots.forEach(([key,col],di)=>{
        const dx=x-(dots.length-1)*7+di*14;
        ctx.beginPath();ctx.arc(dx,y+40,3,0,TAU);
        if(rec&&rec[key]){ctx.fillStyle=rgba(col,0.9);ctx.fill();}
        else{ctx.strokeStyle=rgba(col,0.3);ctx.lineWidth=1;ctx.stroke();}
      });
      if(b.kind==='derelict'&&AtlasStore.vela){
        ctx.fillStyle=rgba(AtlasStore.vela==='left'?WARM:DIM,0.6);
        ctx.font='8px "Helvetica Neue",Helvetica,Arial,sans-serif';
        ctx.fillText(AtlasStore.vela==='left'?'left in peace':'stripped',x,y+52);
      }
    });
  }

  if(atlasTab==='probes'){
    ctx.font='11px "Helvetica Neue",Helvetica,Arial,sans-serif';
    if(!AtlasStore.legacy.length){
      ctx.fillStyle=rgba(DIM,0.7);
      ctx.fillText('no probe has flown yet.',W/2,180);
    }
    AtlasStore.legacy.slice(0,8).forEach((L,i)=>{
      const y=120+i*52;
      ctx.fillStyle=rgba(VEC,0.9);ctx.textAlign='left';
      ctx.fillText(L.name+' \u00b7 '+L.au.toFixed(1)+' AU \u00b7 '+L.witnessed+' witnessed \u00b7 '+L.sent+' sent',150,y);
      ctx.fillStyle=rgba(L.sentHome?WARM:DIM,0.8);
      ctx.font='italic 12px Georgia,serif';
      ctx.fillText('\u201c'+L.msg+'\u201d'+(L.sentHome?'':' (recorded aboard. never sent.)'),150,y+18);
      ctx.font='11px "Helvetica Neue",Helvetica,Arial,sans-serif';
    });
  }

  if(atlasTab==='signals'){
    ctx.font='11px "Helvetica Neue",Helvetica,Arial,sans-serif';
    const heard=Object.values(AtlasStore.signals);
    if(!heard.length){
      ctx.fillStyle=rgba(DIM,0.7);
      ctx.fillText('nothing received yet. keep the radio warm.',W/2,180);
    }
    let y=120;
    heard.forEach(s=>{
      ctx.fillStyle=rgba(WARM,0.9);ctx.textAlign='left';
      ctx.fillText(s.from,120,y);
      ctx.fillStyle=rgba('#e8dcc8',0.75);
      ctx.font='11px Georgia,serif';
      y=wrapText(s.text,120,y+16,720,15,'left')+30;
      ctx.font='11px "Helvetica Neue",Helvetica,Arial,sans-serif';
    });
  }

  button(W/2-70,H-44,140,26,'BACK',()=>{mode='title';});
}

function renderDead(){
  ctx.textAlign='center';
  ctx.fillStyle=rgba(DIM,0.9);
  ctx.font='300 20px "Helvetica Neue",Helvetica,Arial,sans-serif';
  ctx.fillText('FINAL TELEMETRY \u00b7 '+run.name,W/2,110);
  ctx.font='13px Georgia,serif';
  ctx.fillStyle='rgba(220,230,240,0.9)';
  const lines=[
    au().toFixed(1)+' astronomical units from home.',
    run.witnessed+' bodies witnessed. '+run.sent+' data sent. '+run.data+' still aboard, addressed to no one.',
    run.heard+' transmissions heard.'+(run.missed>0?' '+run.missed+' passed in silence.':'')
  ];
  lines.forEach((l,i)=>ctx.fillText(l,W/2,160+i*26));
  if(run.finalMsg){
    ctx.fillStyle=rgba(WARM,0.95);
    ctx.font='italic 14px Georgia,serif';
    wrapText('\u201c'+run.finalMsg+'\u201d',W/2,268,560,22,'center');
    ctx.fillStyle=rgba(DIM,0.7);
    ctx.font='10px "Helvetica Neue",Helvetica,Arial,sans-serif';
    ctx.fillText(run.finalSent?'sent home at '+(au()*8.3/60).toFixed(1)+' light-hours. arrival not guaranteed.':'recorded aboard. the radio went first.',W/2,320);
  }
  let epitaph;
  const a=au();
  if(a<8)epitaph='It stayed close, and saw closely.';
  else if(a<20)epitaph='It crossed the plane and kept its eyes open as long as it could.';
  else if(a<35)epitaph='It went farther than the voices could follow.';
  else epitaph='It went dark still moving. It is moving now.';
  ctx.fillStyle=rgba(VEC,0.7);
  ctx.font='italic 13px Georgia,serif';
  ctx.fillText(epitaph,W/2,356);
  const pct=Math.round(layerCount()/layerTotal()*100);
  ctx.fillStyle=rgba(VEC,0.55);
  ctx.font='11px "Helvetica Neue",Helvetica,Arial,sans-serif';
  ctx.fillText('the atlas stands at '+pct+'%. the rest is still out there.',W/2,392);
  button(W/2-160,430,150,30,'NEW PROBE',()=>{enterNameMode();});
  button(W/2+10,430,150,30,'ATLAS',()=>{atlasTab='probes';mode='atlas';});
}

// ---------- loop ----------
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);
  if(AC){ambInit();ambTick();voicesUpdate(dt);pianoTick();}
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
